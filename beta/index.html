<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- === [V38] PWA === 
     file:// 로 열면 이 세 줄은 조용히 무시된다 (manifest·SW 모두 https 필요).
     GitHub Pages 등 https에 올렸을 때만 '홈 화면에 추가'가 활성화된다.
     로컬 파일 사용은 지금과 똑같이 계속 된다. -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#090b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TKSTOCK">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<!-- === [V43] 매매일지 전용 글꼴: 나눔고딕코딩 (영문 1칸 · 한글·기호 2칸 고정폭) ===
     일지 원문의 표는 '한글 = 영문 2칸'으로 공백을 넣어 맞춰져 있다. 이 비율이 정확히 1:2인 글꼴로
     그려야 작성할 때와 같은 칸에 선다. 못 받으면(오프라인) 기존 고정폭 글꼴로 대신 그린다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<title>TKSTOCK TERMINAL</title>
<style>
  :root{
    --bg:#000000; --panel:#0b0b0d; --panel2:#111114; --line:#26261c;
    --amber:#ffb000; --amber-dim:#b37c00; --white:#e9e9e4; --muted:#7d7d68;
    --up:#33d17a; --dn:#ff5b5b; --cyan:#4fd4ff; --violet:#c08cff; --warn:#ffd23f;
    --hdr-fg:#000000;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);}
  body{
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
    color:var(--white); font-size:12px; line-height:1.35;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  #app{display:flex; flex-direction:column; height:100vh;}
  a,.k{color:var(--cyan); cursor:pointer; text-decoration:none;}
  .k:hover{background:var(--cyan); color:#000;}
  .amber{color:var(--amber);} .muted{color:var(--muted);} .up{color:var(--up);} .dn{color:var(--dn);}
  .cyan{color:var(--cyan);} .warn{color:var(--warn);} .violet{color:var(--violet);}
  .b{font-weight:700;}

  /* top bar */
  #topbar{display:flex; align-items:center; gap:14px; padding:5px 10px;
    background:linear-gradient(#151510,#0a0a08); border-bottom:1px solid var(--line);}
  #brand{font-weight:800; letter-spacing:2px; color:var(--amber);}
  #brand .go{background:var(--amber); color:#000; padding:0 5px; margin-left:6px; border-radius:1px;}
  #topbar .stat{white-space:nowrap;}
  #topbar .spacer{flex:1;}
  #reglight{padding:1px 8px; border:1px solid var(--line); border-radius:2px; font-weight:700;}
  #clock{color:var(--muted);}
  #conn{font-weight:700;}

  /* command bar */
  #cmdbar{display:flex; align-items:center; gap:8px; padding:4px 10px;
    background:#0a0a08; border-bottom:1px solid var(--line);}
  #prompt{color:var(--amber); font-weight:700;}
  #cmd{flex:0 0 auto; width:230px; background:#000; border:1px solid var(--amber-dim);
    color:var(--amber); font:inherit; padding:2px 6px; outline:none; text-transform:uppercase;}
  #cmd:focus{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber-dim) inset;}
  #cmdhint{color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  #cmdhint b{color:var(--amber-dim);}

  /* ticker tape */
  #tape{overflow:hidden; white-space:nowrap; border-bottom:1px solid var(--line);
    background:#050504; padding:3px 0; position:relative;}
  #tapeInner{display:inline-block; padding-left:100%; animation:tape 55s linear infinite;}
  #tape:hover #tapeInner{animation-play-state:paused;}
  @keyframes tape{from{transform:translateX(0)} to{transform:translateX(-50%)}}
  .tq{margin:0 18px;} .tq .sym{color:var(--amber);} .tq .px{color:var(--white);}

  /* screen */
  #screen{flex:1; overflow:auto; padding:8px; }
  /* === [V49] 모든 화면이 창 높이를 채운다 — 내용이 짧으면 마지막 덩어리(또는 지정한 칸)가 늘어나고, 길면 지금처럼 스크롤 */
  .vfill{display:flex;flex-direction:column;height:100%;}
  .vfill>*{flex:0 0 auto;}
  .vfill>:last-child{flex:1 0 auto;}
  .vfill>.panel:last-child,.vfill>.grid:last-child{margin-bottom:0;}
  .vf-MENU>.grid{flex:1 0 auto;margin-bottom:8px;}
  .vf-MENU>.grid:last-child{margin-bottom:0;}
  .vf-MENU>.grid>.panel{margin-bottom:0;display:flex;flex-direction:column;}
  .vf-MENU>.grid>.panel>.pb{flex:1 1 auto;}
  @media(min-width:901px){   /* 메뉴: 위 세 칸은 내용 높이, 아래 두 칸(리서치·리비전)이 남는 높이를 채우고 넘치면 잘림 */
    .vf-MENU>.grid.g3{flex:0 0 auto;}
    .vf-MENU>.grid.g2:last-child{flex:1 1 0;min-height:220px;grid-template-rows:minmax(0,1fr);}
    .vf-MENU>.grid.g2:last-child>.panel{min-height:0;overflow:hidden;}
    .vf-MENU>.grid.g2:last-child>.panel>.pb{min-height:0;overflow:hidden;}
  }
  .vf-RISK>.grid>.panel,.vf-SIG>.grid>.panel{margin-bottom:0;}
  .vf-RISK>.grid,.vf-SIG>.grid{margin-bottom:8px;}
  #screen::-webkit-scrollbar{width:9px;height:9px;} #screen::-webkit-scrollbar-thumb{background:#2a2a1c;}
  .viewhdr{display:flex; align-items:baseline; gap:10px; margin-bottom:6px;}
  .viewhdr .code{background:var(--amber); color:#000; font-weight:800; padding:1px 7px;}
  .viewhdr .ttl{color:var(--amber); font-weight:700; letter-spacing:1px;}
  .viewhdr .sub{color:var(--muted);}

  .panel{border:1px solid var(--line); background:var(--panel); margin-bottom:8px;}
  .panel>.ph{background:var(--amber); color:#000; font-weight:700; padding:2px 8px; letter-spacing:.5px;
    display:flex; justify-content:space-between; align-items:center;}
  .panel>.ph .rt{font-weight:600; color:#3a2b00;}
  .panel>.pb{padding:6px 8px;}
  .grid{display:grid; gap:8px;}
  .g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:900px){.g2,.g3{grid-template-columns:1fr;}}

  table{border-collapse:collapse; width:100%;}
  th,td{padding:1px 8px 1px 0; text-align:right; white-space:nowrap;}
  th{color:var(--amber-dim); font-weight:600; border-bottom:1px solid var(--line); text-align:right;}
  th:first-child,td:first-child{text-align:left; padding-left:2px;}
  tr.row:hover td{background:#17170f;}
  td.sym{color:var(--cyan); cursor:pointer;} td.sym:hover{background:var(--cyan); color:#000;}
  .bar{display:inline-block; height:8px; vertical-align:middle;}
  .tag{padding:0 5px; border:1px solid currentColor; border-radius:2px; font-size:10px; font-weight:700;}
  .chip{padding:0 5px; border-radius:2px; font-weight:700;}
  .chip.on{background:var(--up); color:#000;} .chip.off{background:var(--dn); color:#000;}
  .chip.neu{background:#333; color:var(--white);}

  /* launchpad tiles */
  .tiles{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; margin-bottom:8px;}
  @media(max-width:1500px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr));}}
  @media(max-width:1100px){.tiles{grid-template-columns:repeat(2,1fr);}}
  .tile{border:1px solid var(--line); background:var(--panel); padding:8px; cursor:pointer; position:relative;}
  .tile:hover{border-color:var(--amber); background:var(--panel2);}
  .tile .num{position:absolute; top:6px; right:8px; color:var(--amber-dim); font-weight:800;}
  .tile .code{color:var(--amber); font-weight:800; letter-spacing:1px;}
  .tile .nm{color:var(--white); margin-top:2px;} .tile .ko{color:var(--muted); font-size:11px;}

  .banner{border:1px solid var(--amber-dim); background:#1a1204; color:var(--warn);
    padding:4px 8px; margin-bottom:8px; font-size:11px;}
  .foot{padding:3px 10px; border-top:1px solid var(--line); background:#0a0a08; color:var(--muted);
    display:flex; gap:14px; flex-wrap:wrap;}
  .foot .k{padding:0 4px;}
  .sep{height:1px;background:var(--line);margin:6px 0;}
  .kpi{font-size:20px; font-weight:800;}
  .mono-sm{font-size:11px;}
  svg text{font-family:inherit;}
  .legend span{margin-right:12px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:3px;}
  /* === [V24] 뉴스 팝업 모달 === */
  #modalbg{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;z-index:60;align-items:flex-start;justify-content:center;padding:6vh 12px}
  #modal{width:min(760px,100%);max-height:82vh;overflow:auto;background:#0d1117;border:1px solid var(--amber);padding:14px 16px;box-shadow:0 0 30px rgba(0,0,0,.6)}
  #modal .mraw{white-space:pre-wrap;word-break:break-word;background:#161b22;border:1px solid var(--bd);padding:8px;margin-top:6px;font-size:12px;line-height:1.5}
  [data-news]{cursor:pointer}
  /* === [V40] 섹터 로테이션 보드 === */
  .rrghead{padding:6px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;line-height:1.5}
  .qs{display:inline-flex;gap:1px;vertical-align:middle}
  .qs i{display:inline-block;width:14px;height:15px;font-style:normal;font-size:9.5px;line-height:15px;text-align:center;color:#000;font-weight:800;font-family:system-ui,sans-serif}
  .qs i.na{background:#1a1a14}
  tr.hl td{background:#1b1706}
  .rrgcards{display:none;grid-template-columns:1fr;gap:6px}
  .rcard{border:1px solid var(--line);background:var(--panel2);padding:7px 8px;display:flex;flex-direction:column;gap:5px}
  .rcard .rtop{display:flex;justify-content:space-between;align-items:center}
  .rcard .rq{color:#000;font-weight:800;padding:0 6px;border-radius:2px;font-family:system-ui,sans-serif;font-size:11px}
  .rcard .rnum{display:flex;flex-wrap:wrap;gap:4px 12px}
  .rcard .rv{font-family:system-ui,sans-serif;line-height:1.45}
  @media(max-width:700px){.rrgtable{display:none}.rrgcards{display:grid}}
  /* === [V41] 폰 폭: 상단 상태줄이 화면 밖으로 밀려(레이아웃 폭 ~640px) 페이지가 옆으로 스크롤되던 것 → 줄바꿈 === */
  @media(max-width:700px){#topbar{flex-wrap:wrap;gap:4px 10px}#topbar .spacer{display:none}#clock{font-size:11px}#modal{box-sizing:border-box}}
  /* === [V43] 매매일지 서식 보존 ===
     줄 하나 = .jl 한 줄. 줄 앞 공백은 padding(ch)으로, 줄 안 공백은 pre-wrap으로 그대로 둔다.
     □ ㅇ - ① ※ 머리기호는 매달린 들여쓰기 → 화면이 좁아 접혀도 본문이 기호 뒤에 맞춰 선다. */
  :root{--jff:"Nanum Gothic Coding","NanumGothicCoding","D2Coding","GulimChe","굴림체","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;}
  /* 글자 크기는 짝수 px만 쓴다: 영문 반칸(0.5em)이 정수 px여야 브라우저 반올림으로 한글 2칸과 어긋나지 않는다 */
  textarea.jin{font-family:var(--jff);font-size:12px;line-height:1.6;tab-size:4;font-kerning:none;font-variant-ligatures:none;}
  .jdoc{font-family:var(--jff);font-size:var(--jfs,12px);line-height:1.6;color:var(--white);font-kerning:none;font-variant-ligatures:none;}
  .jdoc .jl{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;}
  .jdoc .jb{height:calc(var(--jfs,12px) * .8);}
  .jdoc .jh1{color:var(--amber);font-weight:700;}
  .jdoc .jh2 .jm{color:var(--amber-dim);font-weight:700;}
  .jdoc .jh3 .jm{color:var(--muted);}
  .jdoc .jnum .jm{color:var(--warn);font-weight:700;}
  .jdoc .jnote{color:var(--muted);}
  .jdoc .jlab{font-weight:700;color:#fff;}
  .jdoc .jh1 .jlab{color:inherit;}
  .jdoc .jref{color:var(--cyan);}
  .jdoc .jlink{color:var(--cyan);cursor:pointer;border-bottom:1px dotted var(--cyan);}
  /* 표: 줄바꿈 없이 가로 스크롤. 오른쪽(왼쪽)에 더 있으면 가장자리가 은은하게 빛난다(스크롤 그림자) */
  .jdoc .jtbl{--tb:#0e0e0a;overflow-x:auto;margin:1px 0;border-left:2px solid #2a2a1c;
    background:linear-gradient(to right,var(--tb) 30%,transparent) left/28px 100% no-repeat local,
      linear-gradient(to left,var(--tb) 30%,transparent) right/28px 100% no-repeat local,
      linear-gradient(to right,rgba(255,176,0,.30),transparent) left/12px 100% no-repeat scroll,
      linear-gradient(to left,rgba(255,176,0,.30),transparent) right/12px 100% no-repeat scroll,
      var(--tb);}
  .jdoc .jtbl>div{width:max-content;min-width:100%;}
  .jdoc .jtbl .jl{display:block;white-space:pre;}
  .jfal .jdoc .jnum .jm,.jfalc .jdoc .jnum .jm{color:var(--dn);}
  .jsec-h{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--amber-dim);margin:2px 0 3px;}
  .jsec-h.dn{color:var(--dn);}
  .jclamp{max-height:calc(var(--jl,12) * var(--jfs,12px) * 1.6);overflow:hidden;position:relative;}
  .jclamp.over::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.2em;pointer-events:none;
    background:linear-gradient(rgba(11,11,13,0),var(--panel));}
  .jmore{display:inline-block;margin-top:2px;font-size:11px;}
  .jclamp:not(.over)+.jmore{display:none;}
  .ph.jhd,.jhd2{cursor:pointer;}
  .ph.jhd{gap:10px;align-items:flex-start;}
  .ph.jhd .jhl{min-width:0;word-break:keep-all;}
  .ph.jhd .rt{white-space:nowrap;}
  .ph.jhd .k{color:#000;text-decoration:underline;}
  .jbar{display:flex;gap:10px;align-items:center;margin-bottom:4px;}
  .jent{padding:6px 0;border-bottom:1px dashed var(--line);}
  .jent:first-child{padding-top:0;} .jent:last-child{border-bottom:0;padding-bottom:0;}
  .jhd2{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;margin-bottom:3px;}
  .jhd2:hover .b{color:var(--cyan);}
  tr.jrow{cursor:pointer;} tr.jrow:hover td.jttl{color:var(--cyan);}
  td.jttl{white-space:normal;min-width:120px;}
  /* 읽기 창 (일지 1건 전체) */
  #modalbg.jm{padding:3vh 10px;}
  #modal.jm{width:min(1100px,100%);max-height:92vh;padding:0 18px 18px;--jfs:14px;}
  #modal.jm .jmh{position:sticky;top:0;z-index:2;background:#0d1117;padding:12px 0 6px;box-shadow:0 1px 0 var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  #modal.jm .jmt{color:var(--amber);font-weight:700;font-size:15px;line-height:1.4;word-break:keep-all;min-width:0;}
  #modal.jm .jmeta{color:var(--muted);font-size:11px;margin-top:8px;display:flex;flex-wrap:wrap;gap:3px 12px;}
  #modal.jm .jact{margin-top:6px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:11px;}
  #modal.jm .jact .jcur{background:var(--cyan);color:#000;}
  #modal.jm .jsec{margin-top:12px;}
  #modal.jm .jfal{border-left:2px solid var(--dn);padding-left:12px;margin-top:16px;}
  #modal.jm .jdoc .jtbl{--tb:#11151b;}
  @media(max-width:700px){
    #modalbg.jm{padding:1.5vh 4px;}
    #modal.jm{max-height:97vh;padding:0 10px 14px;--jfs:12px;}
    #modal.jm .jfal{padding-left:8px;}
    td.jprev,th.jprev{display:none;}
  }
  /* === [V44] 1 NEWS·MAP — 파급 노출 맵 (NEWS + MAP 통합) ===
     데스크톱: 보유 카드 → 지도(가운데) + 인박스(오른쪽 리모컨) → 지도 아래 상세.
     폰(≤700px): 보유 카드마다 그 보유를 가운데 둔 작은 그래프 → 보유 밖 → 인박스. */
  .nmv{display:flex;flex-direction:column;gap:8px;height:100%;min-height:760px;}   /* 노트북(768px 높이)에선 살짝 스크롤 — 지도를 작게 만들지 않는다 */
  .nmv .panel{margin-bottom:0;}
  .nmhd{margin-bottom:0;align-items:center;flex-wrap:wrap;gap:6px 10px;}
  .nmb{font:inherit;font-size:11px;background:transparent;color:var(--amber);border:1px solid var(--amber-dim);padding:1px 8px;cursor:pointer;white-space:nowrap;}
  .nmb:hover{border-color:var(--amber);}
  .nmb.on{background:var(--amber);color:#000;border-color:var(--amber);}
  .nmb.red{color:var(--dn);border-color:var(--dn);}
  .nmb.red.on{background:var(--dn);color:#000;}
  .nmseg{display:inline-flex;}
  .nmseg .nmb+.nmb{border-left:0;}
  .nmhold{display:flex;gap:8px;min-width:0;}
  .nmcards{display:flex;gap:8px;overflow-x:auto;min-width:0;flex:1 1 auto;}
  .nmcard{flex:1 1 280px;min-width:240px;max-width:430px;display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;font-size:11px;
    color:var(--white);background:var(--panel);border:1px solid var(--line);padding:5px 9px;cursor:pointer;}
  .nmcard:hover{border-color:var(--amber-dim);}
  .nmcard.on{border-color:var(--cyan);background:#06222b;}
  .nmcard>span{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;}
  .nmcard>span.nmc3{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nmtk{font-size:14px;}
  .nmbar{display:inline-flex;width:72px;height:7px;background:#161612;border:1px solid var(--line);flex:0 0 auto;}
  .nmbar i{display:block;height:100%;}
  .nmbg{font-size:10px;font-weight:700;padding:0 4px;border:1px solid;white-space:nowrap;flex:0 0 auto;font-style:normal;}
  .nmbg.s{background:var(--dn);color:#000;border-color:var(--dn);}
  .nmbg.w{color:#ff8a8a;border-color:var(--dn);border-style:dashed;}
  .nmbg.n{color:var(--muted);border-color:#3a3a2c;}
  .nmbg.tp{color:var(--warn);border-color:var(--warn);}
  .nmbg.t0{color:var(--cyan);border-color:var(--cyan);}
  .nmbg.t1{color:var(--amber);border-color:var(--amber);}
  .nmbg.t2{color:var(--muted);border-color:var(--muted);}
  .nmbg.p{color:var(--amber);border-color:var(--amber-dim);}
  .nmw{color:#e0a0a0;}
  .nmout{border:1px solid var(--line);background:var(--panel);padding:5px 9px;font-size:11px;display:flex;flex-direction:column;gap:2px;min-width:300px;flex:0 1 420px;}
  .nmo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nmbody{flex:1;min-height:0;display:flex;gap:8px;}
  .nmmap{flex:1 1 0;min-width:0;display:flex;flex-direction:column;}
  .nmcap{padding:5px 10px 0;font-size:13px;line-height:1.45;word-break:keep-all;}
  .nmsvgw{flex:1;min-height:280px;position:relative;}
  .nmsvgw>svg{position:absolute;left:0;top:0;width:100%;height:100%;}
  .nmlegend{display:flex;gap:12px;padding:3px 10px;font-size:10px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;}
  .nmlegend i{font-style:normal;color:#f2f2ec;padding:0 4px;}
  .nmdet{height:124px;flex:0 0 auto;overflow-y:auto;padding:4px 10px;display:flex;flex-direction:column;gap:2px;}
  .nmdet>*{flex:0 0 auto;}

<script>
"use strict";
/* ============================================================================
   TKSTOCK TERMINAL  —  10개 고도화 방안 통합 콕핏 (V49: 7개 화면 = 1~7 · 2 CAT 삭제)
   1 NEWS·MAP   파급 노출 맵 + 인박스(핵심논지·원문)   5 REV·VAL    PER 경주선
   2 RISK       ATR 손절·규칙 엔진                    6 SIG        신호 백테스트·애널리스트 원장
   3 PORT·STAGE 포트폴리오·F×P 점검판                7 THESIS     테제 카드·매매일지
   4 REGIME·RRG 레짐·로테이션 (사분면 보드)
   예전 코드(MAP·STAGE·RRG·VAL)를 입력해도 통합 화면으로 간다.

   [DATA] 단면(현재가/RS/U/D/EPS/PER/PEG/목표가/보유단가/섹터ETF/VIX)은
   실제 시트(2026-07-19)에서 읽은 값. 시계열(ATR·MA·PER히스토리·EPS리비전·
   백테스트)은 현재값에 앵커링한 시드(seed) 데이터로 로직을 실제 구동한다.
   (LIVE에서는 ATR 손절가·MA·EPS 리비전·RS가 V22~V40에 실측으로 바뀌었고,
    [V46] PER 히스토리도 Database '27년 PER' 주간 값으로 바뀐다. 시드는 SIM 데모와 SIG 백테스트에만 남는다.)
   → LIVE 연결: [V41] 파일에 URL·키를 넣지 않는다. 첫 실행 때 SETUP 화면에서 입력 → 이 브라우저에만 저장.
   ========================================================================== */

/* === [V47] 5 REV·VAL · 3 PORT·STAGE 통합 (B+) ===
   ① 5 REV·VAL: 27E EPS 리비전 + "PER이 왜 움직였나"(주가 선 vs EPS 선 경주) + 자기 26주 z를 한 화면에. 9 VAL은 8로.
      Code.gs perHist 점을 [날짜, PER27, 현재가, 27E EPS, 목표가]로 넓혔다 (V47 조각). 구버전 점이면 주가를 PER×EPS로 역산.
   ② 3 PORT·STAGE: 도넛·종목별 평가액·비중·평가손익·스테이지 + 예수금 + 테제(F)×가격(P) 칸. 11 STAGE는 5로.
      비중 = 총자산(주식 + 예수금) 기준 (10-06 결정). 예수금 = Code.gs가 'Cash' 탭에서 보내는 cash (StockAuto가 KIS로 기록).
      손절 정책·밴드·비중상한·F축은 Journal 탭에서 읽는다 (시트 칸·파일 상수 추가 없음). AI 판정은 Code.gs verdicts (선택).
   ③ 상단바 '룰위반' = 손절 정책이 적용되는 종목의 손절선 이탈만 (경고·미적용은 따로 표시, 원시 규칙은 2 RISK).
   ④ (V48) 통합 전 구 화면은 삭제. */
/* === [V46] VAL z-스코어 = 실측 PER 히스토리 ===
   ① V45까지 VAL의 '자기 26주 PER'은 genWeekly()가 티커 이름을 씨앗(seed)으로 만든 가짜 26주였다.
      LIVE에서도 마찬가지라, z·백분위는 '오늘 PER을 지어낸 과거와 비교한 값'이었다 (10-02 기준 15종목 중 6종목 부호 반대).
   ② Code.gs가 perHist(티커별 Database '27년 PER' 주간 값)를 보내면 그것으로 z를 계산한다.

/* ============================ 시드 히스토리 엔진 ============================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedFor(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const std=a=>{const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)));};

function genDaily(tk,px,rs){
  const r=mulberry32(seedFor(tk+"|dly"));
  const N=130, vol=0.016+r()*0.022, drift=(rs/100)/N*1.4;
  let c=[1]; for(let i=1;i<N;i++){c.push(c[i-1]*(1+drift+(r()*2-1)*vol));}
  const sc=px/c[N-1]; c=c.map(x=>x*sc);
  const hi=c.map(x=>x*(1+(0.25+r()*0.6)*vol)), lo=c.map(x=>x*(1-(0.25+r()*0.6)*vol));
  return {c,hi,lo,vol};
}
function genWeekly(tk,e27,daily){
  const r=mulberry32(seedFor(tk+"|wk")), W=26;
  const dir=r()<0.5?-1:1, mag=0.0004+r()*0.0045;               // 리비전 드리프트
  let eps=[],cur=e27; for(let i=0;i<W;i++){eps.unshift(cur);cur=cur/(1+dir*mag);}
  const wp=[]; for(let i=0;i<W;i++){const idx=daily.c.length-1-(W-1-i)*5; wp.push(daily.c[Math.max(0,idx)]);}
  const per=eps.map((e,i)=> e>0? wp[i]/e : null);
  return {eps,per,wp,dir};
}
function genRS(tk,curRS){
  const r=mulberry32(seedFor(tk+"|rs")), W=13; let s=[];
  let v=curRS+(r()*2-1)*22;
  for(let i=0;i<W-1;i++){s.push(v); v=v*0.72+(r()*2-1)*14;}
  s.push(curRS); return s;                                     // 마지막=현재
}
function atr(d,p=14){const {c,hi,lo}=d,t=[];for(let i=1;i<c.length;i++){t.push(Math.max(hi[i]-lo[i],Math.abs(hi[i]-c[i-1]),Math.abs(lo[i]-c[i-1])));}const s=t.slice(-p);return avg(s);}
const sma=(a,p)=>avg(a.slice(-p));

/* === [V40] 주 1점 정리 — Code.gs weeklyPick과 같은 규칙 ===

function weekKey(ds){
  const d=new Date(String(ds).slice(0,10)+"T00:00:00Z"); if(isNaN(d))return null;
  const dow=d.getUTCDay(); return new Date(d.getTime()-((dow+6)%7)*864e5).toISOString().slice(0,10);
}
/* === [V46] epsHist 점이 [날짜, EPS, PER]이면 PER만 뽑아 {tk:[[날짜,PER],...]} === */
function perFromEpsHist(eh){
  const out={};
  if(!eh||typeof eh!=="object")return out;
  Object.keys(eh).forEach(tk=>{
    const arr=eh[tk]; if(!Array.isArray(arr))return;
    const pts=arr.filter(p=>Array.isArray(p)&&p.length>2&&isFinite(+p[2])&&+p[2]>0).map(p=>[p[0],+p[2]]);
    if(pts.length)out[tk]=pts;
  });
  return out;
}

  const out={};

    arr.filter(p=>Array.isArray(p)).slice().sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).forEach(p=>{

function weeklyHist(obj){

    const wk={};
    arr.slice().sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).forEach(p=>{

/* RS 주간 시계열 + 머리점(대시보드 현재 RS). 대시보드 기준일이 히스토리 마지막 주보다

function rsWeekly(tk,curRS){
  const rh=LIVE_RSH[tk];
  if(!rh||rh.length<2)return null;
  const d=[],v=[];
  rh.forEach(p=>{if(typeof p[1]==="number"&&isFinite(p[1])){d.push(String(p[0]).slice(0,10));v.push(p[1]);}});
  if(v.length<2)return null;
  const asof=String(CONFIG.ASOF||"").slice(0,10), last=d[d.length-1];
  if(curRS!=null&&isFinite(curRS)&&asof>last&&weekKey(asof)!==weekKey(last)){d.push(asof);v.push(curRS);}
  return {d,v};
}

function rebuildAll(){

function spark(arr,w=120,h=26,color="#4fd4ff"){
  const mn=Math.min(...arr),mx=Math.max(...arr),rng=(mx-mn)||1;
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-((v-mn)/rng)*h).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}">${arr.length>1?`<polyline fill="none" stroke="${color}" stroke-width="1.3" points="${pts}"/>`:""}</svg>`;

/* === [V40] 섹터 로테이션 보드 (RRG 대체) ===
   읽는 순서: ① 맨 위 한 줄(이번 주 바뀐 것) → ② 노란 줄 섹터의 13주 흐름 → ③ 아래 RRG로 위치 감각.
   숫자는 전부 SX(rebuildAll)에서 온다 — 여기서는 그리기만 한다. */
const SEC_KO={XLK:"기술",XLF:"금융",XLV:"헬스케어",XLY:"경기소비재",XLC:"커뮤니케이션",XLI:"산업재",
              XLP:"필수소비재",XLE:"에너지",XLU:"유틸리티",XLRE:"부동산",XLB:"소재"};
const RRG_COLS=13;     // 보드에 보여줄 주 수
const RRG_TAIL=4;      // 보조 RRG 꼬리 길이(주)
function rrgVerdict(s,withRank){
  const q=s.q||[], n=q.length, cur=s.quad, p1=n>=2?q[n-2]:null, p4=n>=5?q[n-5]:null;
  if(!cur)return "<span class='muted'>데이터 부족 (5주 미만)</span>";
  let t;
  if(cur==="주도")      t=(p4&&p4!=="주도")?`주도 진입 (4주 전 ${p4})`:`주도 ${s.streak}주째`;
  else if(cur==="약화") t=(p1==="주도")?"이번 주 주도에서 꺾임":`강하지만 힘 빠지는 중 ${s.streak}주째`;
  else if(cur==="개선") t=(p1==="소외")?"바닥에서 돌아서는 중 · 관찰 후보":`약하지만 좋아지는 중 ${s.streak}주째`;
  else                  t=(p4==="주도"||p4==="약화")?`4주 사이 주도권 상실 (${p4}→소외)`:`소외 ${s.streak}주째`;
  if(withRank&&s._r4&&s._r0&&Math.abs(s._r4-s._r0)>=3)t+=` · 순위 ${s._r4}→${s._r0}`;
  const tags=[];
  if(Math.abs(s.rs)<1||(s.mom!=null&&Math.abs(s.mom)<1))tags.push("경계선");
  if(s.streak===1&&p1&&p1!==cur)tags.push("2주 확인 전");
  return esc(t)+(tags.length?` <span class="muted">· ${tags.join(" · ")}</span>`:"");
}
function rsSpark(arr,w,h,col){
  if(!arr||arr.length<2)return "";
  const mn=Math.min(0,...arr),mx=Math.max(0,...arr),rg=(mx-mn)||1,p=2;
  const X=i=>p+i/(arr.length-1)*(w-2*p), Y=v=>p+(mx-v)/rg*(h-2*p);
  const pts=arr.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const i4=arr.length-5;
  return `<svg width="${w}" height="${h}" style="display:block">
    <polygon points="${X(0)},${Y(0)} ${pts} ${X(arr.length-1)},${Y(0)}" fill="${col}" fill-opacity="0.13"/>
    <line x1="${p}" x2="${w-p}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#4a4a3a" stroke-dasharray="2 2"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.4"/>
    ${i4>=0?`<circle cx="${X(i4).toFixed(1)}" cy="${Y(arr[i4]).toFixed(1)}" r="1.8" fill="#8a8672"/>`:""}
    <circle cx="${X(arr.length-1).toFixed(1)}" cy="${Y(arr[arr.length-1]).toFixed(1)}" r="2.6" fill="${col}"/></svg>`;
}
function quadStrip(s,cols){
  const q=s.q||[], n=q.length, from=Math.max(0,n-cols);
  let h="";
  for(let k=0;k<cols-(n-from);k++)h+=`<i class="na"></i>`;
  for(let i=from;i<n;i++){const x=q[i];
    h+=x?`<i style="background:${QUAD[x]}${i<n-1?";opacity:.8":""}" title="${s._rsD?s._rsD[i]:""} ${x}">${x[0]}</i>`:`<i class="na"></i>`;}
  return `<span class="qs">${h}</span>`;
}

/* === [V22] EPS 리비전 브레드스 — Database 주간 스냅샷 기반 실측 === */
const REV_EPS_TH=0.05;   // ±0.05% 이내는 '보합'으로 (반올림 노이즈 제외)

/* === [V30] 자체 Database 브레드스를 '정식 지표'로 쓰기 위한 두 가지 가드 ===
   이 지표는 S&P 500 전체가 아니라 '내가 추적하는 종목'의 EPS 리비전을 집계한다.
   표본이 얇다는 사실을 숨기면 지표가 아니라 착시가 되므로, 두 가지를 명시한다.

   ① 섹터별 표본 수(N) 하한 — N이 이 값 미만인 섹터는 평균을 숨기고 N/A 처리.
      추적 종목 31개를 11개 GICS 섹터로 쪼개면 섹터당 1~2개가 다수다.
      그 상태의 '섹터 평균'은 개별 종목 한 개의 EPS 변화를 섹터 신호로 오독하게 만든다.
   ② 스냅샷 성숙도 — Database append가 주 1회이므로 4주 리비전에는 5주치가 필요하다.
      그 전까지는 IMMATURE 배지를 띄워 '아직 판단 근거로 쓰지 말 것'을 표시한다.
   ※ 둘 다 '시간이 해결하는' 문제라 지표 자체를 내리지 않고 라벨만 붙인다. */
const REV_SEC_MIN_N=3;   // 섹터 평균을 표시할 최소 종목 수
const REV_MATURE_N=5;    // 4주 리비전이 성립하는 최소 주간 스냅샷 수

/* === [V38] 섹터 EPS (SectorEPS 탭 수동입력) ===
   S&P DJI 자동수집은 GitHub Actions IP 차단으로 불가능하고, Drive 반자동도
   결국 매월 사람 손이 필요하다. 그래서 지수 EPS와 같은 방식으로 일원화했다.
   11개 섹터를 다 채울 필요는 없다 — 채운 행만 표시된다.
   정렬은 '가장 가까운 미래 연도의 성장률' 내림차순: 어느 섹터의 이익이
   빨리 늘고 있는지가 한눈에 보이도록. 값이 없는 섹터는 뒤로 밀린다. */

/* === [V23] 테제 카드 + 매매일지·아이디어 (Journal 탭 연동) === */
const KIND_COL={"테제":"amber","매매일지":"cyan","아이디어":"violet"};
const ST_COL={"활성":"up","관찰":"warn","검증됨":"cyan","폐기":"muted"};
let TH_FILTER="";
const _idSafe=id=>String(id).replace(/[^A-Za-z0-9_-]/g,"");

/* === [V31] 저장 결과를 '추정'하지 않는다 ===
   기존 코드는 응답 파싱에 실패하면 {ok:true}를 돌려줬다. 배포가 낡아 doPost가 없거나
   Apps Script가 HTML 에러 페이지를 반환해도 화면엔 "✓ 저장됨"이 떴다는 뜻이다.
   저장 여부는 시트를 다시 읽어 확인하고(thesisAdd), 여기서는 사실만 돌려준다. */
async function jPost(payload){
  /* === [V37] no-cors 전송 ===
     file:// 에서는 POST 응답도 읽을 수 없다 (tryLive와 같은 이유).
     mode:"no-cors"는 응답을 opaque로 만들지만 전송 자체는 이뤄지므로,
     성공 여부는 응답이 아니라 '시트를 다시 읽어 실제로 있는지'로 판정한다.
     V31이 이미 그렇게 설계돼 있어서(thesisAdd의 엔드투엔드 확인) 여기만
     바꾸면 나머지는 그대로 맞물린다. res.id는 못 받게 되므로 판정은
     제목·내용 매칭으로 바뀐다 (thesisAdd 쪽 수정 참조). */
  payload.key=CONFIG.WRITE_KEY;
  try{
    await fetch(CONFIG.LIVE_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)});
    return {sent:true};
  }catch(e){
    return {sent:false,error:"전송 실패 — "+e.message};
  }
}
/* === [V42] 저장 확인 — Journal 탭만 가볍게, 짧은 간격으로 여러 번 ===
   V41까지는 저장 뒤 '전체' 데이터(텔레그램 인덱스·Database 포함)를 다시 받아 확인했다.
   저장 직후엔 시트 재계산과 겹쳐 25초 한도를 넘기는 일이 있었고, 그러면 터미널 전체가 SIM으로
   떨어지고 버튼이 '저장 중…'에서 멈췄다 (2026-09-29 MSFT·AMZN 편출 — 실제 기록은 돼 있었음).
   → ?mode=journal (Code.gs V42)로 Journal 탭만 읽는다. 구버전 GAS면 전체 페이로드가 오지만
     거기에도 journal 필드가 있으니 똑같이 동작한다(느릴 뿐). 확인 실패가 LIVE 상태를 건드리지 않는다. */
async function refreshJournal(timeoutMs){
  const u=CONFIG.LIVE_URL+(CONFIG.LIVE_URL.indexOf("?")>=0?"&":"?")+"mode=journal";
  const j=await jsonpGet(u,timeoutMs||30000);
  if(!j||!Array.isArray(j.journal))throw new Error((j&&j.error)||"journal 응답 없음");
  JOURNAL=j.journal;
  if(j.gasVer)LIVE_GAS={ver:j.gasVer,hasPost:!!j.hasPost};
  return JOURNAL;
}
async function confirmJournal(pred,onTry){
  const waits=[1000,3000,6000];
  let err="";
  for(let i=0;i<waits.length;i++){
    await new Promise(r=>setTimeout(r,waits[i]));
    if(onTry)onTry(i+1,waits.length);
    try{await refreshJournal(30000); if(pred())return {ok:true};}
    catch(e){err=(e&&e.message)||String(e);}
  }
  return {ok:false,err};
}
function thMsg(html){const m=el("thMsg");if(m)m.innerHTML=html;}
async function thesisAdd(){
  if(SAVING)return;                                   // === [V42] 연타로 두 번 저장되는 것 방지
  if(!LIVE_ON){flashHint("LIVE 연결 필요 — SETUP에서 URL 입력 후 사용 가능");return;}
  if(!CONFIG.WRITE_KEY){flashHint("일지 저장 키가 없음 — SETUP에서 입력");openSetup();return;}
  const kind=el("thKind").value, tk=el("thTk").value.trim().toUpperCase();
  const title=el("thTitle").value.trim(), text=el("thText").value.trim(), fal=el("thFal").value.trim();
  if(!title&&!text){flashHint("제목 또는 내용을 입력하세요");return;}
  thDraftSave();                                      // 확인 전까지 이 기기에 보관
  const before=new Set(JOURNAL.map(x=>String(x.id)));
  const t200=title.slice(0,200).trim(), x4000=text.slice(0,20000).trim();   // Code.gs V42 한도와 동일
  const setBtn=(busy)=>{const b=el("thSave");if(!b)return;b.textContent=busy?"저장 중…":"💾 저장";
    b.style.pointerEvents=busy?"none":"";b.style.opacity=busy?".5":"";};
  SAVING=true; setBtn(true); thMsg("<span class='muted'>전송 중…</span>");
  const finish=(html)=>{SAVING=false; setBtn(false); thMsg(html);};
  try{
    const res=await jPost({action:"add",kind,tk,title,text,falsify:fal});
    if(!res.sent){finish(`<span class='dn'>전송 실패 — ${esc(res.error||"네트워크 오류")}. 글은 그대로 있으니 다시 눌러도 됩니다.</span>`);return;}
    const c=await confirmJournal(
      ()=>JOURNAL.some(x=>!before.has(String(x.id))&&((t200&&x.title===t200)||(x4000&&x.text===x4000))),
      (n,m)=>thMsg(`<span class='muted'>전송됨 — 시트 기록 확인 중 (${n}/${m})…</span>`));
    if(c.ok){
      SAVING=false;
      TH_FIELDS.forEach(k=>{const e=el(k); if(e&&k!=="thKind")e.value="";});   // 확인됐으니 폼을 비운다
      thDraftClear(); render();                       // (render가 빈 폼을 보관 → 초안도 비워진 상태 유지)
      thMsg("<span class='up'>✓ 저장됨 — Journal 탭 기록을 확인했습니다</span>");
      flashHint("✓ 저장됨");
    }else{
      finish(`<span class='warn'>전송은 됐지만 기록 확인이 안 됐습니다. <b>다시 누르지 말고</b> 잠시 뒤 R(새로고침)로 목록을 확인하세요 — 다시 누르면 같은 글이 두 번 저장될 수 있습니다.`
        +` 계속 안 보이면 SETUP의 일지 저장 키가 Code.gs의 WRITE_KEY와 같은지 확인하세요.</span>`
        +(c.err?` <span class='muted'>(${esc(c.err)})</span>`:""));
    }
  }catch(err){finish(`<span class='dn'>저장 실패: ${esc(err.message)}</span>`);}
}
async function thesisStatus(id,status){
  if(SAVING)return;
  if(!LIVE_ON){flashHint("LIVE 연결 필요");return;}
  SAVING=true;
  try{
    const res=await jPost({action:"setstatus",id,status});
    if(!res.sent){flashHint("실패: "+res.error);return;}
    flashHint("상태 변경 전송 — 확인 중…");
    const c=await confirmJournal(()=>{const row=JOURNAL.find(x=>String(x.id)===String(id));return !!row&&row.status===status;});
    SAVING=false;
    if(c.ok){render();flashHint("✓ 상태 → "+status);}
    else flashHint("상태 변경 확인이 늦어짐 — 잠시 뒤 R로 확인하세요");
  }catch(err){flashHint("실패: "+err.message);}
  finally{SAVING=false;}
}

/* === [V42] 작성 중인 일지 보존 ===
   재렌더(자동 갱신·화면 이동·저장 확인)나 새로고침으로 긴 글이 날아가지 않게, 저장이 '확인'될
   때까지 이 브라우저에 임시 보관한다. */
const TH_FIELDS=["thKind","thTk","thTitle","thText","thFal"], TH_DRAFT_KEY="tkstock.thDraft";
function thDraftSave(){
  if(!el("thTitle"))return;
  const d={}; let any=false;
  TH_FIELDS.forEach(k=>{const e=el(k); if(e){d[k]=e.value; if(k!=="thKind"&&e.value.trim())any=true;}});
  try{if(any)localStorage.setItem(TH_DRAFT_KEY,JSON.stringify(d)); else localStorage.removeItem(TH_DRAFT_KEY);}catch(e){}
}
function thDraftClear(){try{localStorage.removeItem(TH_DRAFT_KEY);}catch(e){}}
function thDraftRestore(){
  let d=null; try{d=JSON.parse(localStorage.getItem(TH_DRAFT_KEY)||"null");}catch(e){}
  if(!d)return;
  TH_FIELDS.forEach(k=>{const e=el(k); if(e&&d[k]!=null)e.value=d[k];});
  thAutosize(el("thText")); thAutosize(el("thFal"));   // === [V43]
  thMsg("<span class='muted'>작성 중이던 글을 불러왔습니다 (저장이 확인되면 비워집니다)</span>");

document.addEventListener("input",e=>{if(e.target&&TH_FIELDS.includes(e.target.id))thDraftSave();
  if(e.target&&e.target.classList&&e.target.classList.contains("jin"))thAutosize(e.target);});
/* === [V43] 입력칸은 쓰는 만큼 늘어난다 (빈 칸이 화면을 다 차지해 저장한 기록이 아래로 밀리던 것 방지)
   내용칸은 화면 높이의 70%, 반증칸은 50%까지 늘고 그 뒤로는 칸 안에서 스크롤 */
function thAutosize(t){
  if(!t)return;
  const max=Math.round(innerHeight*(t.id==="thFal"?0.5:0.7));
  t.style.height="auto";
  const h=t.scrollHeight+2;
  t.style.height=Math.min(h,max)+"px";
  t.style.overflowY=h>max?"auto":"hidden";
}
document.addEventListener("change",e=>{if(e.target&&e.target.id==="thKind")thDraftSave();});

/* === [V43] 매매일지 서식 보존 렌더러 ===
   [원인] 시트 Journal 탭에는 줄바꿈·들여쓰기가 그대로 저장돼 있었다(입력·저장은 정상).
   화면이 esc(j.text)를 일반 <div>/<span>에 넣어서, HTML 기본 규칙(white-space:normal)대로
   줄바꿈과 연속 공백이 모두 공백 한 칸으로 접혀 한 문단이 됐다.
   [해결] 원문을 한 줄씩 그린다.
     · 줄 앞 공백 → 들여쓰기(ch). 줄 안 공백 → 그대로(pre-wrap). 글꼴은 영문1:한글2 고정폭.
     · □ ㅇ - ① ※ 머리기호 → 매달린 들여쓰기 + 단계별 색 (내용은 한 글자도 바꾸지 않는다)
     · 공백으로 칸을 맞춘 표(연속 공백 3칸 이상이 2줄 이상) → 줄바꿈 없이 가로 스크롤
     · 'R#번호'는 리포트 표시, 'J+숫자' 일지 ID는 누르면 그 일지를 연다. */
const escA=s=>esc(s).replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const J_W=c=>{const k=c.codePointAt(0);return (k<0x80||k===0xa0)?1:2;};   // 나눔고딕코딩 실측: ASCII·NBSP 1칸, 나머지 2칸
function jTabs(s){
  if(s.indexOf("\t")<0)return s;
  let o="",col=0;
  for(const ch of s){if(ch==="\t"){const n=4-(col%4);o+=" ".repeat(n);col+=n;}else{o+=ch;col+=J_W(ch);}}
  return o;
}
const J_MARKS=[
  [/^([□■◆◇▣])([ \u3000]+)/,"jh1"],
  [/^([ㅇ○◦●])([ \u3000]+)/,"jh2"],
  [/^([①-⑳]|\(\d{1,2}\)|\d{1,2}[.)]|[가나다라마바사아자차카타파하][.)])([ \u3000]+)/,"jnum"],
  [/^(※)([ \u3000]*)/,"jnote"],
  [/^([-–—·•∙▪*>→])([ \u3000]+)/,"jh3"]
];
const jFind=id=>JOURNAL.find(x=>String(x.id)===String(id));
function jInline(s){
  return esc(s)
    .replace(/\bR#(\d{3,})/g,'<span class="jref">R#$1</span>')
    .replace(/\b(J\d{10,})\b/g,(m,id)=>jFind(id)?`<span class="jlink" data-jid="${id}" title="이 일지 열기">${id}</span>`:m);
}
function jText(raw,cls){
  if(cls==="jh2"||cls==="jnum"){                       // "라벨 : 내용" → 라벨만 굵게
    const k=raw.search(/\s:\s/);
    if(k>0&&k<=24)return `<span class="jlab">${jInline(raw.slice(0,k))}</span>${jInline(raw.slice(k))}`;
  }
  if(cls==="jh3"){                                     // "(UBS) 질문…" → 앞 괄호만 굵게
    const m=raw.match(/^\([^)]{1,14}\)/);
    if(m)return `<span class="jlab">${jInline(m[0])}</span>${jInline(raw.slice(m[0].length))}`;
  }
  return jInline(raw);
}
const J_GAP=/\S[ \u3000]{3,}\S/;                         // 표 후보: 줄 안에 공백 3칸 이상
function jLine(line){
  if(!line.trim())return `<div class="jl jb"></div>`;
  const lead=line.match(/^[ \u3000\u00a0]*/)[0];
  let ind=0; for(const ch of lead)ind+=(ch==="\u3000"?2:1);
  let rest=line.slice(lead.length), cls="", mk="";
  for(const [re,c] of J_MARKS){const m=rest.match(re); if(m){cls=c; mk=m[0]; rest=rest.slice(mk.length); break;}}
  let mw=0; for(const ch of mk)mw+=J_W(ch);           // 머리기호 폭(칸): □·ㅇ·①·※ 2칸, 영문·공백 1칸
  // 첫 줄은 원래 들여쓰기(ind)에서, 접힌 줄은 기호 뒤(ind+mw)에서 시작 = 매달린 들여쓰기
  const sty=(ind+mw)?` style="padding-left:${ind+mw}ch${mw?`;text-indent:-${mw}ch`:""}"`:"";
  return `<div class="jl${cls?" "+cls:""}"${sty}>`+
    `${mk?`<span class="jm">${esc(mk)}</span>`:""}<span class="jt">${jText(rest,cls)}</span></div>`;
}
function jDoc(text){
  const L=String(text||"").replace(/\r\n?/g,"\n").split("\n").map(s=>jTabs(s).replace(/\s+$/,""));
  const cand=L.map(s=>J_GAP.test(s.trim()));
  let h="", i=0;
  while(i<L.length){
    if(cand[i]){                                       // 표 묶음: 후보 줄 + 사이의 빈 줄 1개까지
      let j=i, n=0, last=i;
      while(j<L.length){
        if(cand[j]){n++; last=j; j++;}
        else if(!L[j].trim()&&j+1<L.length&&cand[j+1])j++;
        else break;
      }
      if(n>=2){
        h+=`<div class="jtbl"><div>`+L.slice(i,last+1).map(s=>s.trim()?`<div class="jl">${jInline(s)}</div>`:`<div class="jl jb"></div>`).join("")+`</div></div>`;
        i=last+1; continue;
      }
    }
    h+=jLine(L[i]); i++;
  }
  return `<div class="jdoc">${h}</div>`;
}
/* 미리보기(카드·종목 화면): 정해진 줄 수만 보여주고 넘치면 흐림 + '이어서 보기' */
function jClamp(text,lines,id,extraCls){
  return `<div class="jclamp${extraCls?" "+extraCls:""}" style="--jl:${lines}">${jDoc(text)}</div>`+
    `<span class="jmore k" data-jid="${escA(id)}">▾ 이어서 보기</span>`;
}
function fitClamps(){
  document.querySelectorAll(".jclamp").forEach(e=>e.classList.toggle("over",e.scrollHeight>e.clientHeight+2));
}
let _fitT=null;
window.addEventListener("resize",()=>{clearTimeout(_fitT);_fitT=setTimeout(fitClamps,150);});
try{if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener("loadingdone",()=>fitClamps());}catch(e){}

/* === [V43] 일지 읽기 창 — 목록·카드·종목 화면 어디서든 눌러서 1건 전체를 본다 === */

    <div class="jmeta"><span class="${KIND_COL[j.kind]||'muted'} b">${esc(j.kind)}</span>${j.tk?(BY[j.tk]?symLink(j.tk):`<span>${esc(j.tk)}</span>`):""}<span class="${ST_COL[j.status]||'muted'} b">[${esc(j.status)}]</span><span>작성 ${esc(j.d||"")}</span>${j.upd&&j.upd!==j.d?`<span>수정 ${esc(j.upd)}</span>`:""}<span>${esc(j.id)}</span></div>

    ${j.text?`<div class="jsec">${jDoc(j.text)}</div>`:`<div class="jsec muted">(내용 없음)</div>`}

function jCopyFallback(s){
  try{const t=document.createElement("textarea");t.value=s;t.setAttribute("readonly","");
    t.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(t);t.select();
    const ok=document.execCommand("copy");t.remove();return ok;}catch(e){return false;}
}
function jCopy(){
  const j=jFind(JM_ID); if(!j)return;
  const s=[j.title||"","",j.text||""].concat(j.falsify?["","[반증 조건]",j.falsify]:[]).join("\n");
  const done=ok=>jMsg(ok?"<span class='up'>✓ 복사됨 (줄바꿈 그대로)</span>":"<span class='dn'>복사 실패 — 본문을 길게 눌러 선택하세요</span>");
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(()=>done(true),()=>done(jCopyFallback(s)));
  else done(jCopyFallback(s));

     ${(LIVE_ON&&!LIVE_GAS.ver)?"<div class='banner'>배포된 Apps Script가 doPost 이전 버전입니다. 저장을 눌러도 Journal 탭에 기록되지 않습니다 — 배포 &gt; 배포 관리 &gt; 연필 &gt; 새 버전으로 배포.</div>":""}

  return vHeader("THESIS")+form+

       ${dead.length?`<div class="muted mono-sm" style="margin:4px 0">폐기된 테제 ${dead.length}건 (Journal 탭에 보존)</div>`:""}</div>
     <div class="panel">${ph("매매일지 · 아이디어",`${shown.length}건${f?" · 필터 "+esc(f):""} · 행을 누르면 전체 보기`)}<div class="pb">

const STAGE_META={1:["바닥·축적","cyan","기저 형성. 돌파 대기 — 관찰 리스트"],

                  3:["천정·분산","warn","모멘텀 소진. 신규 매수 자제·비중 축소 검토"],
                  4:["하락·마크다운","dn","추세 하락. 보유 시 규칙 점검 필요"]};

}

  const flags=[o.fStop?"<span class='dn tag'>STOP</span>":"",o.fMA?"<span class='warn tag'>&lt;MA20</span>":"",o.fDD?"<span class='dn tag'>DD-10</span>":""].filter(Boolean).join(" ")||"<span class='up'>정상</span>";
  const kv=(k,v)=>`<tr><td class="muted" style="text-align:left">${k}</td><td class="b">${v}</td></tr>`;
  return `<div class="viewhdr"><span class="code">${tk}</span><span class="ttl">${esc(o.sec)}</span><span class="sub">${usd(o.px)} · 목표 ${usd(o.tgt)} (괴리 ${pct(o.gap)})${o.stage?" · "+stageChip(o.stage):""}</span></div>

     </table><div style="margin-top:4px">${spark(o._d.c,240,34,'#4fd4ff')}</div></div></div>

        ${kv("27E PER",fmt(o.p27))}${kv("28E PER",fmt(o.p28))}${kv("PER Z-스코어",o.pz!=null?`<span class="${o.pz<-1?'up':o.pz>1?'dn':'muted'}">${fmt(o.pz,2)}σ (${o.ppct.toFixed(0)}%ile · ${esc(o.perSrc||"")} ${o.perN}주)</span>`:(o.perSrc==="짧음"?`<span class="muted">— (기록 ${o.perN}주)</span>`:"—"))}${kv("PEG 27/28",`${fmt(o.peg27)} / ${fmt(o.peg28)}`)}${kv("성장률 27/28",`${pct(o.g27)} / ${pct(o.g28)}`)}
     </table></div></div>
     <div class="panel">${ph("RISK / RULES")}<div class="pb"><table>
        ${kv("ATR손절가",usd(o.stop))}${kv("손절까지",`<span class="${o.px<o.stop?'dn':'muted'}">${pct((o.px/o.stop-1)*100)}</span>`)}${kv("MA20",`${usd(o.ma20)} <span class="${cls(o.px-o.ma20)}">${o.px<o.ma20?'하회':'상회'}</span>`)}${kv("고점(60d)대비",`<span class="${cls(o.ddFromHi)}">${pct(o.ddFromHi)}</span>`)}${kv("규칙상태",flags)}

   </div>
   <div class="grid g3">

     <div class="panel">${ph("POSITION")}<div class="pb">${o.held?`<table>${kv("수량",o.qty)}${kv("평단",usd(o.avg))}${kv("손익%",`<span class="${cls(o.pnl)} b">${pct(o.pnl)}</span>`)}${kv("미실현$",usd(o.upl,0))}${kv("비중",(o.mv/PORT.mv*100).toFixed(1)+"%")}</table>`:"<span class='muted'>미보유</span>"}</div></div>
     <div class="panel">${ph("NEWS SIDECAR")}<div class="pb"><div>심리 ${o.nSent==null?"<span class='muted'>—</span>":`<span class="${o.nSent>0?'up':o.nSent<0?'dn':'muted'} b">${fmt(o.nSent,2)}</span>`} · 30D ${o.nCnt30} · 목표가Δ ${esc(o.nLastTC)||"—"}</div><div class="sep"></div>${news.length?news.map(n=>`<div class="mono-sm"><span class="muted">${n.d.slice(5)}</span> <span class="${n.dir==='강세'?'up':n.dir==='약세'?'dn':'muted'}">${n.dir}</span> ${esc(n.th).slice(0,52)} ${n.sim?"<span class='tag muted'>SIM</span>":""}</div>`).join(""):"<span class='muted'>커버리지 없음</span>"}</div></div>
   </div>
   ${(()=>{

        기존에는 kind==="테제"인 것만 걸렀다. 그런데 저장 폼의 기본 선택값이 '매매일지'라,
        구분을 바꾸지 않고 저장한 기록은 종목 화면에 아예 뜨지 않았다.
        게다가 0건이면 패널 자체를 렌더하지 않아 '기록이 없는 것'과 '화면이 고장난 것'을

     const mine=JOURNAL.filter(j=>j.tk===tk&&j.status!=="폐기");

     return `<div class="panel">${head}<div class="pb">`+
       mine.map(j=>{const a=escA(j.id); return `<div class="jent">
         <div class="jhd2" data-jid="${a}" title="눌러서 전체 보기">

         ${j.falsify?`<div class="jsec-h dn" style="margin-top:6px">반증 조건</div>${jClamp(j.falsify,6,j.id,"jfalc")}`:""}</div>`;}).join("")+`</div></div>`;})()}`;
}

/* =====================================================================================
   === [V44] 1 NEWS·MAP — 파급 노출 맵 (구 1 NEWS + 3 MAP 통합) ===
   왜: NEWS는 '종목 표 + 피드', MAP은 '테마·링크 표'라서 "이 소식이 내 포지션에 닿나?"를 보려면
       두 화면을 오가며 머릿속으로 이어 붙여야 했다. 지도(B안)를 가운데 두고, 순서와 경계(C안)를
       지도에 미리 그려 둔다 — 아무것도 누르지 않아도 첫 화면에서 답이 보이게.
   읽는 순서: ① 보유 카드의 경계/주의 배지 → ② 지도에서 빨간 화살표가 청록 고리(보유)로 들어오는지
             → ③ 오른쪽 인박스 (경계 → 주의 → 목표가 → 보유 직접 → 보유 간접 → 그 외, 같은 순위는 최신순)
   조작: 인박스 행 = 그 리포트의 파급을 지도에 · 노드 = 그 종목 중심 · 보유 카드 = 그 보유 중심 · ESC = 전체 흐름
   경계 규칙 (약세 리포트만, 티커 목록의 첫 번째 = 주인공):
     경계 = 주인공의 약세가 실제 LINKS 1-hop으로 보유에 닿음 (또는 보유가 주인공)
     주의 = 언급만 된 티커에서 왔거나, 제안 링크(점선)를 거침 → 지우지 않고 약하게 (예: 크레도 목표가 하향이
            NVDA·MSFT를 함께 태그한 경우)
   한계: 링크에 아직 부호(동행/반대)가 없다 → '영향 가능'까지만 말한다. THEMES·LINKS는 아직 코드 상수
         (시트 탭 이전은 다음 단계). 새 종목은 좌표가 없으면 지도 오른쪽 '미배치' 칸에 자동으로 놓인다.
   '마지막 확인'은 이 기기 브라우저(localStorage)에만 저장 — PC·폰 읽음 상태는 따로 간다.
   ===================================================================================== */
const NM_LAYOUT={   // [x, y, 상자] — 지도 좌표(viewBox 930×544)
 PLTR:[95,154,"SW"],APP:[95,244,"SW"],TEM:[95,334,"SW"],RKLB:[95,479,"SPC"],
 GOOGL:[262,122,"NEO"],MSFT:[307,214,"NEO"],AMZN:[252,309,"NEO"],ORCL:[307,404,"NEO"],NBIS:[252,492,"NEO"],

 LITE:[772,162,"OPT"],AAOI:[878,162,"OPT"],

 MEM:[560,66,"MEM"],

 {id:"SW", x:40, y:122,w:110,h:250,lab:"AI SOFTWARE",      th:["AI Software"]},

 {id:"NEO",x:195,y:80, w:170,h:456,lab:"CLOUD · NEOCLOUD", th:["Neocloud"]},

 {id:"PWR",x:545,y:344,w:375,h:193,lab:"POWER · EDGE",     th:["Power/Electrification","Edge/Physical AI"]},
];
const NM_TRAY=[[762,256],[832,256],[898,256],[762,300],[832,300],[898,300]];   // 좌표 없는 종목 자리
/* 제안(점선) — THEMES·LINKS를 시트 탭으로 옮기기 전까지 여기서만 쓴다 */
const NM_GROUP={"MU":"MEM","005930.KS":"MEM","000660.KS":"MEM","005930":"MEM","000660":"MEM","삼성전자":"MEM","SK하이닉스":"MEM"};
const NM_LABEL={MEM:"메모리*"};
const NM_PROP_NODE={AMZN:1,BE:1};
const NM_LINKS_PROP=[["AMZN","NVDA","GPU↔cloud capex"],["AMZN","MSFT","hyperscaler"],["BE","ORCL","DC 전력 공급"],["BE","GEV","현장발전 peers"],["NVDA","MEM","HBM 공급"]];
const NM_DC={"강":"#33d17a","약":"#ff5b5b","중":"#b9b9a6"}, NM_DW={"강":"강세","약":"약세","중":"중립"}, NM_DG={"강":"▲","약":"▼","중":"●"};
const NM_HINT={
  flow:"빨간 화살표 = 보유로 들어오는 약세 · 청록 고리 = 보유 · 노드를 누르면 그 종목 중심",
  rep:"흰 테두리 = 리포트 종목 (실선 주인공 · 점선 언급) · 주황 점선 = 1차 파급",
  hold:"보유 중심 · 주황 점선 = 1-hop 이웃 · 화살표 = 이 보유로 들어오는 약세",
  node:"종목 중심 · 주황 점선 = 1-hop 이웃"};
const NM_SEEN_KEY="tkstock.nmSeen";
let NM={sel:"",h:"",tk:"",per:"new",tab:"all",open:"",prev:null};
let NM_C=null, NM_NARROW=null;

const nmTs=n=>`${String(n.d||"").slice(0,10)} ${String(n.t||"00:00").slice(0,5)}`;
const nmKey=n=>`${nmTs(n)}|${n.src||""}|${String(n.th||"").slice(0,40)}`;
const nmDir=n=>n.dir==="강세"?"강":n.dir==="약세"?"약":"중";
const nmNm=id=>NM_LABEL[id]||id;
const nmSg=v=>v==null||!isFinite(v)?"—":(v>0?"+":"")+v.toFixed(2);
function nmUniq(a){const s=new Set();return a.filter(v=>v&&!s.has(v)&&s.add(v));}
function nmMx(a,b){return (a==="S"||b==="S")?"S":(a||b||"");}
function nmDayNum(ds){const d=new Date(String(ds||"").slice(0,10)+"T00:00:00Z");return isNaN(d)?null:Math.round(d.getTime()/864e5);}
function nmShift(ts,ms){
  const d=new Date(String(ts).replace(" ","T")+":00"); if(isNaN(d))return ts;
  const x=new Date(d.getTime()+ms), p=v=>String(v).padStart(2,"0");
  return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())} ${p(x.getHours())}:${p(x.getMinutes())}`;
}
function nmSeenGet(){try{return localStorage.getItem(NM_SEEN_KEY)||"";}catch(e){return "";}}
function nmSeenSet(v){try{if(v)localStorage.setItem(NM_SEEN_KEY,v);else localStorage.removeItem(NM_SEEN_KEY);}catch(e){}}
function nmLatest(){let m="";(NEWS||[]).forEach(n=>{const t=nmTs(n);if(t>m)m=t;});return m;}
function nmTW(s,px){let w=0;for(const ch of String(s))w+=(ch.codePointAt(0)>=0x1100)?px:px*0.62;return Math.round(w);}
function nmTP(c,h){   // 최근 30일, 그 종목이 주인공인 리포트의 목표가 변경 (다른 회사 목표가가 태그로 묻어오지 않게)
  const n=c.all.find(x=>x.tc&&c.PT(x)===h&&c.refDay-(nmDayNum(x.d)??-1e9)<=30);
  return n?`${n.tc} (${String(n.d).slice(5,10)})`:"";
}
function nmStg(id){const o=BY[id];if(o)return `${o.stage||"스테이지 —"} · RS ${fmt(o.rs)}`;return id==="MEM"?"유니버스 밖 묶음":"";}

/* 경계 이벤트: 약세 리포트 1건 → 보유로 닿는 (출발 → 보유) 목록 */
function nmEvents(n,c){
  const out=[]; if(nmDir(n)!=="약")return out;
  const t=c.TG(n), p=c.PT(n);
  t.forEach(x=>{
    const role=(x===p)?"P":"M";
    if(c.HS[x]){out.push({n,from:x,to:x,kind:"dir",role,s:role==="P"?"S":"W",rel:"",prop:false});return;}
    (c.NB[x]||[]).forEach(l=>{
      if(!c.HS[l.t]||t.includes(l.t))return;
      out.push({n,from:x,to:l.t,kind:"ind",role,s:(role==="P"&&!l.prop)?"S":"W",rel:l.rel,prop:l.prop});
    });
  });
  return out;
}
function nmGroup(evs){
  const P={},O=[];
  evs.forEach(e=>{
    if(e.kind!=="ind")return;
    const k=e.from+">"+e.to;
    if(!P[k]){P[k]={from:e.from,to:e.to,rel:e.rel,prop:e.prop,reps:[],s:"",P:false};O.push(k);}
    const pa=P[k]; if(!pa.reps.includes(e.n))pa.reps.push(e.n);
    pa.s=nmMx(pa.s,e.s); if(e.role==="P")pa.P=true;
  });
  return O.map(k=>P[k]).sort((a,b)=>((a.s==="S")?0:1)-((b.s==="S")?0:1)||b.reps.length-a.reps.length);
}

/* 계산은 한 번만: NEWS·HOLD·U(갱신 때 통째로 교체됨)와 기간·마지막 확인이 같으면 재사용 */
function nmCompute(per){
  const stored=nmSeenGet(), latest=nmLatest();
  const seen=stored||(latest?nmShift(latest,-864e5):"");
  const key=per+"|"+seen;
  if(NM_C&&NM_C.news===NEWS&&NM_C.hold===HOLD&&NM_C.u===U&&NM_C.key===key)return NM_C.c;
  const c={per,seen,stored:!!stored,latest};
  const pos={};
  Object.keys(NM_LAYOUT).forEach(k=>{const p=NM_LAYOUT[k];pos[k]={x:p[0],y:p[1],box:p[2]};});
  const extra=nmUniq(U.map(o=>o.tk).concat(Object.keys(HOLD||{}))).filter(t=>!pos[t]&&!NM_GROUP[t]);
  extra.forEach((t,i)=>{if(i<NM_TRAY.length)pos[t]={x:NM_TRAY[i][0],y:NM_TRAY[i][1],box:"TRAY"};});
  c.pos=pos; c.extra=extra;
  const nid=t=>NM_GROUP[t]||(pos[t]?t:null);
  c.nid=nid;
  // LINKS 끝점은 묶음(메모리*)으로 접고, 같은 쌍은 한 번만 — 실선(LINKS)이 제안(점선)보다 먼저라
  // 제안 링크를 LINKS로 옮기면 저절로 실선·'경계' 대상으로 바뀐다
  const em={},eo=[];
  LINKS.map(l=>({a:NM_GROUP[l[0]]||l[0],b:NM_GROUP[l[1]]||l[1],rel:l[2],prop:false}))
    .concat(NM_LINKS_PROP.map(l=>({a:l[0],b:l[1],rel:l[2],prop:true})))
    .forEach(e=>{if(e.a===e.b||!pos[e.a]||!pos[e.b])return;const k=[e.a,e.b].sort().join("|");if(!em[k]){em[k]=e;eo.push(k);}});
  c.edges=eo.map(k=>em[k]);
  const NB={};
  c.edges.forEach(e=>{(NB[e.a]=NB[e.a]||[]).push({t:e.b,rel:e.rel,prop:e.prop});(NB[e.b]=NB[e.b]||[]).push({t:e.a,rel:e.rel,prop:e.prop});});
  c.NB=NB;
  const HELD=nmUniq(Object.keys(HOLD||{}).map(t=>NM_GROUP[t]||t)), HS={};
  HELD.forEach(h=>HS[h]=1); c.HELD=HELD; c.HS=HS;
  c.TG=n=>nmUniq((n.tk||[]).map(nid));
  c.PT=n=>nid((n.tk||[])[0]);
  const all=(NEWS||[]).slice().sort(newsCmp);
  let ref=nmDayNum(CONFIG.ASOF)||0; all.forEach(n=>{const d=nmDayNum(n.d);if(d!=null&&d>ref)ref=d;});
  c.refDay=ref;
  c.isNew=n=>nmTs(n)>seen;
  c.in7=n=>{const d=nmDayNum(n.d);return d!=null&&ref-d>=0&&ref-d<=6;};
  c.all=all; c.byKey={}; all.forEach(n=>{c.byKey[nmKey(n)]=n;});
  c.nNew=all.filter(c.isNew).length; c.n7=all.filter(c.in7).length;
  const PR=all.filter(per==="new"?c.isNew:c.in7); c.PR=PR;
  c.ev=n=>nmEvents(n,c);
  const EV=[]; PR.forEach(n=>c.ev(n).forEach(e=>EV.push(e))); c.EV=EV;
  const RSN={}; EV.forEach(e=>{const k=nmKey(e.n);RSN[k]=nmMx(RSN[k],e.s);}); c.RSN=RSN;
  c.PATHS=nmGroup(EV); c.DIRE=EV.filter(e=>e.kind==="dir");
  const HSUM={}; HELD.forEach(h=>HSUM[h]={reps:{},s:""});
  EV.forEach(e=>{const a=HSUM[e.to];if(!a)return;const k=nmKey(e.n);a.reps[k]=nmMx(a.reps[k],e.s);a.s=nmMx(a.s,e.s);});
  c.HSUM=HSUM;
  c.nS=Object.values(RSN).filter(v=>v==="S").length; c.nW=Object.values(RSN).filter(v=>v==="W").length;
  const NBU={}; HELD.forEach(h=>(NB[h]||[]).forEach(x=>{if(!HS[x.t])NBU[x.t]=1;})); c.NBU=NBU;
  c.tier=n=>{const t=c.TG(n);if(t.some(x=>HS[x]))return 0;if(t.some(x=>NBU[x]))return 1;return 2;};
  c.pri=n=>{const a=RSN[nmKey(n)];if(a==="S")return 0;if(a==="W")return 1;const t=c.tier(n);if(n.typ==="목표가변경"&&t===0)return 2;return t===0?3:(t===1?4:5);};
  // 노드: 크기 = 이 기간 언급 수, 색 = 그 종목이 주인공인 리포트의 순논조
  const CNT={},PN={},PB={},PSN={};
  PR.forEach(n=>{c.TG(n).forEach(x=>CNT[x]=(CNT[x]||0)+1);const p=c.PT(n);if(!p)return;PN[p]=(PN[p]||0)+1;
    const d=nmDir(n);if(d==="강")PB[p]=(PB[p]||0)+1;else if(d==="약")PSN[p]=(PSN[p]||0)+1;});
  Object.assign(c,{CNT,PN,PB,PSN});
  c.theme=nmThemeSig(c);
  const oc={}; all.filter(c.in7).forEach(n=>(n.tk||[]).forEach(t=>{if(!nid(t))oc[t]=(oc[t]||0)+1;}));
  c.outside=Object.entries(oc).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // 한 줄 요약: 경계·주의 리포트를 '같은 주인공·같은 날'끼리 묶는다 (채널만 다른 같은 소식)
  const cg={},cgo=[];
  PR.forEach(n=>{if(!RSN[nmKey(n)])return;const g=(c.PT(n)||(n.tk||[])[0]||"?")+"|"+String(n.d).slice(0,10);
    if(!cg[g]){cg[g]={reps:[],S:[],W:[]};cgo.push(g);}cg[g].reps.push(n);});
  cgo.forEach(g=>{const G=cg[g];
    const nm0=G.reps.map(n=>String(n.th||"")).sort((a,b)=>a.length-b.length)[0];G.name=nm0.length>24?nm0.slice(0,23)+"…":nm0;
    EV.forEach(e=>{if(G.reps.includes(e.n)&&e.s==="S"&&!G.S.includes(e.to))G.S.push(e.to);});
    EV.forEach(e=>{if(G.reps.includes(e.n)&&e.s==="W"&&!G.S.includes(e.to)&&!G.W.includes(e.to))G.W.push(e.to);});});
  cgo.sort((a,b)=>(cg[b].S.length?1:0)-(cg[a].S.length?1:0)||cg[b].reps.length-cg[a].reps.length);
  c.capG=cgo.map(g=>cg[g]);
  NM_C={news:NEWS,hold:HOLD,u:U,key,c};
  return c;
}

/* 테마 신호: 최근 7일 vs 그 전 3주 (서버 narrative_timeline flags의 근사).
   피드가 3주 미만이면 깃발은 달지 않고 7일 건수·순논조만 보여준다. */
function nmThemeSig(c){
  const ages=c.all.map(n=>c.refDay-(nmDayNum(n.d)??c.refDay));
  const span=ages.length?Math.max(...ages):0;
  const boxes=NM_BOX.map(b=>({id:b.id,mem:new Set([].concat(...b.th.map(t=>THEMES[t]||[])))}))
    .concat([{id:"MEM",mem:new Set(Object.keys(NM_GROUP))}]);
  const sig={};
  boxes.forEach(b=>{
    let n7=0,b7=0,s7=0,np=0,bp=0,sp=0;
    c.all.forEach(n=>{
      if(!(n.tk||[]).some(t=>b.mem.has(t)))return;
      const a=c.refDay-(nmDayNum(n.d)??-1e9), d=nmDir(n);
      if(a>=0&&a<=6){n7++;if(d==="강")b7++;else if(d==="약")s7++;}
      else if(a>=7&&a<=27){np++;if(d==="강")bp++;else if(d==="약")sp++;}
    });
    const net7=n7?(b7-s7)/n7:null, netP=np?(bp-sp)/np:null, wk=np/3;
    let flag="";
    if(span>=20){
      if(n7>=3&&np>=6&&net7-netP<=-0.5)flag="◆ 논조 전환↓";
      else if(n7>=3&&np>=6&&net7-netP>=0.5)flag="◆ 논조 전환↑";
      else if(wk>=1&&n7>=4&&n7>=2*wk)flag="↑ 관심 급증";
      else if(wk>=4&&n7<=0.5*wk)flag="↓ 관심 급감";
    }
    sig[b.id]={n7,net7,np,netP,wk,flag};
  });
  sig.span=span;
  return sig;
}
function nmChipText(s){
  if(!s||(!s.n7&&!s.flag))return "";
  if(s.flag.startsWith("◆"))return `${s.flag} ${nmSg(s.net7)} · 이전 ${nmSg(s.netP)}`;
  if(s.flag)return `${s.flag} ${s.n7}건 · 주평균 ${s.wk.toFixed(1)}`;
  return `7D ${s.n7}건 · ${nmSg(s.net7)}`;
}

/* 리포트 1건의 파급 — 직접(주인공·언급) → 1-hop → 보유. 데스크톱 상세와 원문 팝업이 같이 쓴다 */
function nmRipple(c,n){
  const D=c.TG(n), DP=c.PT(n), d=nmDir(n), bear=(d==="약");
  const N1={},N1O=[];
  c.edges.forEach(e=>{const ia=D.includes(e.a),ib=D.includes(e.b);
    if(ia&&!ib){if(!N1[e.b]){N1[e.b]=[];N1O.push(e.b);}N1[e.b].push({from:e.a,rel:e.rel,prop:e.prop});}
    if(ib&&!ia){if(!N1[e.a]){N1[e.a]=[];N1O.push(e.a);}N1[e.a].push({from:e.b,rel:e.rel,prop:e.prop});}});
  const rows=[];
  D.filter(x=>c.HS[x]).forEach(h=>{const s=bear?(h===DP?"S":"W"):"";
    rows.push({k:0,s,badge:"직접",g:NM_DG[d],gc:NM_DC[d],from:nmNm(h)+" ●",role:h===DP?"주인공":"언급",rel:"리포트에 직접",to:nmNm(h)+" ●",tc:"cyan",tail:nmStg(h)});});
  N1O.forEach(id=>N1[id].forEach(l=>{
    const s=(bear&&c.HS[id])?((l.from===DP&&!l.prop)?"S":"W"):"";
    rows.push({k:c.HS[id]?1:2,s,badge:"파급",g:l.from===DP?NM_DG[d]:(bear?"▽":"·"),gc:NM_DC[d],from:nmNm(l.from),role:l.from===DP?"주인공":"언급",
      rel:l.rel+(l.prop?"*":""),to:nmNm(id)+(c.HS[id]?" ●":""),tc:c.HS[id]?"cyan":"",
      tail:s==="S"?"주인공 약세 · 실제 링크":s==="W"?(l.from===DP?"제안 링크":(l.prop?"언급 · 제안 링크":"언급만")):nmStg(id)});}));
  rows.sort((a,b)=>a.k-b.k||((a.s==="S")?0:1)-((b.s==="S")?0:1));
  const held=nmUniq(D.filter(x=>c.HS[x]).concat(N1O.filter(x=>c.HS[x])));
  return {D,DP,N1,N1O,rows,held,d};
}
function nmRowHtml(r){
  const b=r.s==="S"?`<span class="nmbg s">경계</span>`:r.s==="W"?`<span class="nmbg w">주의</span>`:`<span class="nmbg p">${esc(r.badge||"파급")}</span>`;
  return `<div class="nmrow">${b}<span><span class="b" style="color:${r.gc||"var(--dn)"}">${esc(r.g)}</span> <b>${esc(r.from)}</b> <span class="muted">${esc(r.role)}</span></span>`+
    `<span class="amber">—${esc(r.rel)}→</span><span class="${r.tc||"cyan"} b">${esc(r.to)}</span><span class="muted">${esc(r.tail||"")}</span></div>`;
}
/* 원문 팝업에 붙는 '파급' 칸 (데스크톱·폰 공통) */
function nmRippleHtml(n){
  try{
    const c=nmCompute(NM.per), R=nmRipple(c,n);

      `<div class="nmdet nmdetm">${R.rows.map(nmRowHtml).join("")||"<span class='muted mono-sm'>연결된 링크 없음</span>"}</div>`;
  }catch(e){console.warn("[NEWS·MAP] 파급 계산 실패",e);return "";}

function nmPathTxt(c,n){
  const ev=c.ev(n);
  if(ev.length){
    const by={},ord=[],dirs=[];
    ev.forEach(e=>{if(e.kind==="dir"){dirs.push(e.to);return;}
      if(!by[e.from]){by[e.from]={g:e.role==="P"?"▼":"▽",to:[]};ord.push(e.from);}
      if(!by[e.from].to.includes(e.to))by[e.from].to.push(e.to);});
    const parts=ord.map(k=>`${nmNm(k)}${by[k].g} → ${by[k].to.map(h=>nmNm(h)+"●").join(" ")}`);
    if(dirs.length)parts.unshift(`직접 ${nmUniq(dirs).map(h=>nmNm(h)+"●").join(" ")}${c.PT(n)&&c.HS[c.PT(n)]?"":" (주인공 "+((n.tk||[])[0]||"?")+")"}`);
    return parts.join(" · ");
  }
  const t=c.TG(n), tr=c.tier(n), p0=(n.tk||[])[0]||"";
  if(tr===0){
    const hh=t.filter(x=>c.HS[x]), p=c.nid(p0);
    if(p&&c.HS[p]){const rest=hh.filter(x=>x!==p);return `직접 ${nmNm(p)}●${rest.length?" · 언급 "+rest.map(h=>nmNm(h)+"●").join(" "):""}`;}
    return `언급 ${hh.map(h=>nmNm(h)+"●").join(" ")} · 주인공 ${p?nmNm(p):p0}`;
  }
  if(tr===1){const nbs=t.filter(x=>c.NBU[x]);const to=c.HELD.filter(h=>(c.NB[h]||[]).some(x=>nbs.includes(x.t)));
    return `${nbs.map(nmNm).join("·")} → ${to.map(h=>nmNm(h)+"●").join(" ")}`;}
  return (n.tk||[]).slice(0,3).join(" · ");
}

function nmHeldStat(c,h){

/* 지도 (SVG, viewBox 930×544 — 패널 크기에 맞춰 늘고 줄어든다) */
function nmSvg(c,V){
  const P=c.pos, mode=V.mode, R=V.R;
  const XY=id=>[P[id].x,P[id].y];
  const rad=id=>Math.round(9+3*Math.sqrt(c.CNT[id]||0));
  const fill=id=>{const n=c.PN[id]||0;if(!n)return c.CNT[id]?"#1d1d17":"#121210";const v=((c.PB[id]||0)-(c.PSN[id]||0))/n;return v>=0.5?"#1d5c36":v>=0.2?"#2c4a32":v>-0.2?"#3a3a2e":"#7a2424";};
  const AK={}; V.AP.forEach(p=>{AK[p.from+">"+p.to]=1;AK[p.to+">"+p.from]=1;});
  const srcS={},srcW={}; c.PATHS.forEach(p=>{if(p.s==="S")srcS[p.from]=1;else srcW[p.from]=1;});
  const role={};
  Object.keys(P).forEach(id=>{let r="";
    if(mode==="rep")r=R.D.includes(id)?"D":(R.N1[id]?"N":"");
    else if(V.ctr)r=id===V.ctr?"C":((c.NB[V.ctr]||[]).some(x=>x.t===id)?"N":"");
    role[id]=r;});
  const hl=e=>{if(mode==="rep"){const ia=R.D.includes(e.a),ib=R.D.includes(e.b);return ia!==ib?"out":(ia&&ib?"in":"");}
    if(V.ctr)return (e.a===V.ctr||e.b===V.ctr)?"out":""; return "";};
  /* 겹침 피하기 — 라벨·배지·선 라벨을 놓을 때 이미 놓인 것(상자 이름·테마 칩·노드·다른 라벨)과 겹치는 면적이
     가장 작은 자리를 고른다. 노드 라벨은 이 화면에서 보이는 선(화살표·강조 링크)이 지나가는 쪽도 피한다. */
  const OBS=[];
  const ovl=a=>OBS.reduce((s,b)=>{const w=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0),h=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);return s+(w>0&&h>0?w*h:0);},0);
  const LN={};
  const addDir=(a,b)=>{const A=XY(a),B=XY(b);(LN[a]=LN[a]||[]).push(Math.atan2(B[1]-A[1],B[0]-A[0])*180/Math.PI);};
  V.AP.forEach(p=>{if(P[p.from]&&P[p.to]){addDir(p.from,p.to);addDir(p.to,p.from);}});
  c.edges.forEach(e=>{if(hl(e)&&!AK[e.a+">"+e.b]){addDir(e.a,e.b);addDir(e.b,e.a);}});
  const lineHits=(id,s,w,h,gap)=>{
    const r=rad(id), dirs=LN[id]||[];
    const tb=Math.atan2(r+gap,w/2+4)*180/Math.PI, lr=Math.atan2(h/2+3,r+gap)*180/Math.PI;
    return dirs.filter(a=>s==="b"?(a>=tb&&a<=180-tb):s==="t"?(a<=-tb&&a>=-(180-tb)):s==="r"?Math.abs(a)<=lr:Math.abs(a)>=180-lr).length;
  };
  const boxAt=(id,s,w,h,gap)=>{const [x,y]=XY(id),r=rad(id)+gap;
    return s==="b"?{x0:x-w/2,y0:y+r,x1:x+w/2,y1:y+r+h}:s==="t"?{x0:x-w/2,y0:y-r-h,x1:x+w/2,y1:y-r}
      :s==="r"?{x0:x+r,y0:y-h/2,x1:x+r+w,y1:y+h/2}:{x0:x-r-w,y0:y-h/2,x1:x-r,y1:y+h/2};};
  const place=(id,w,h,gap,order,avoid)=>{
    let best=null;
    order.forEach((s,i)=>{if(s===avoid)return;const bx=boxAt(id,s,w,h,gap);const sc=lineHits(id,s,w,h,gap)*100000+ovl(bx)+i;
      if(!best||sc<best.sc)best={s,bx,sc};});
    OBS.push(best.bx); return best;
  };
  const out=[];
  out.push(`<svg viewBox="0 0 930 544" preserveAspectRatio="xMidYMid meet" role="img" aria-label="파급 노출 지도"><defs>
    <marker id="nmAhS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff5b5b"/></marker>
    <marker id="nmAhW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a85656"/></marker></defs>`);
  const chip=(x,y,t,fg,bd,bg)=>{const w=nmTW(t,10.5)+10;OBS.push({x0:x,y0:y,x1:x+w,y1:y+16});
    return `<rect x="${x}" y="${y}" width="${w}" height="16" fill="${bg}" stroke="${bd}"/><text x="${x+5}" y="${y+12}" font-size="10.5" fill="${fg}">${esc(t)}</text>`;};
  NM_BOX.forEach(b=>{
    out.push(`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="#0e0e0b" stroke="#26261c" stroke-dasharray="3 3"/><text x="${b.x+4}" y="${b.y+12}" font-size="9.5" letter-spacing="1" fill="#8b8b76">${esc(b.lab)}</text>`);
    OBS.push({x0:b.x+2,y0:b.y+2,x1:b.x+6+nmTW(b.lab,9.5)+b.lab.length,y1:b.y+15});
    const s=c.theme[b.id], t=nmChipText(s);
    if(t)out.push(chip(b.x,b.y-24,t,s.flag?"#ffd23f":"#b9b9a6",s.flag?"#b37c00":"#3a3a2c",s.flag?"#1b1706":"#111110"));
  });
  if(P.MEM){const s=c.theme.MEM,t=nmChipText(s);if(t)out.push(chip(P.MEM.x+22,P.MEM.y-8,t,s.flag?"#ffd23f":"#b9b9a6",s.flag?"#b37c00":"#3a3a2c",s.flag?"#1b1706":"#111110"));}
  if(c.extra.length){const tt=`미배치 · 좌표 없음${c.extra.length>NM_TRAY.length?" (+"+(c.extra.length-NM_TRAY.length)+")":""}`;
    out.push(`<text x="722" y="238" font-size="9.5" letter-spacing="1" fill="#8b8b76">${esc(tt)}</text>`);OBS.push({x0:720,y0:228,x1:726+nmTW(tt,9.5)+tt.length,y1:241});}
  Object.keys(P).forEach(id=>{const [x,y]=XY(id),r=rad(id)+(c.HS[id]?5:1);OBS.push({x0:x-r,y0:y-r,x1:x+r,y1:y+r});});
  // 링크
  c.edges.forEach(e=>{
    const A=XY(e.a),B=XY(e.b),h=hl(e);
    let col="#34342a",w=1,op=0.9;
    if(h==="out"){col="#ffb000";w=2;op=1;}else if(h==="in"){col="#ffffff";w=2;op=1;}else if(mode!=="flow")op=0.3;
    if(AK[e.a+">"+e.b])op=0;
    out.push(`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${col}" stroke-width="${w}"${e.prop?' stroke-dasharray="5 4"':""} opacity="${op}"/>`);
  });
  // 경계·주의 화살표 (보유 쪽으로)
  V.AP.forEach(p=>{
    if(!P[p.from]||!P[p.to])return;
    const A=XY(p.from),B=XY(p.to),dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
    const ra=rad(p.from)+(c.HS[p.from]?7:3), rb=rad(p.to)+(c.HS[p.to]?9:5), strong=(p.s==="S");
    out.push(`<line x1="${(A[0]+ux*ra).toFixed(1)}" y1="${(A[1]+uy*ra).toFixed(1)}" x2="${(B[0]-ux*rb).toFixed(1)}" y2="${(B[1]-uy*rb).toFixed(1)}" stroke="${strong?"#ff5b5b":"#a85656"}" stroke-width="${strong?3:2}"${strong?"":' stroke-dasharray="6 4"'} stroke-linecap="round" marker-end="url(#${strong?"nmAhS":"nmAhW"})"/>`);
  });
  // 노드 (원) — 그리는 순서는 그대로, 라벨 자리는 중요한 노드(보유 → 경계 출발 → 언급 많은 순)부터 잡는다
  const nodesSvg=[], labels=[];
  Object.keys(P).forEach(id=>{
    const [x,y]=XY(id), r=rad(id), n=c.CNT[id]||0, ro=role[id], held=!!c.HS[id];
    let st="#3a3a2c",sw=1,da="";
    if(ro==="D"){st="#ffffff";sw=2;if(R&&id!==R.DP)da="4 3";}
    else if(ro==="C"){st="#ffffff";sw=2;}
    else if(ro==="N"){st="#ffb000";sw=2;da="4 3";}
    else if(mode==="flow"&&srcS[id]){st="#ff5b5b";sw=2;}
    else if(mode==="flow"&&srcW[id]){st="#c46a6a";sw=2;da="4 3";}
    else if(id==="MEM"){st="#7d7d68";da="3 3";}
    else if(NM_PROP_NODE[id]||P[id].box==="TRAY"){st="#b37c00";da="3 3";}
    const op=mode==="flow"?((n||held||srcS[id]||srcW[id])?1:0.5):(ro?1:0.25);
    const f=(ro==="D"&&R&&id===R.DP)?NM_DC[R.d]:fill(id), o=BY[id];
    const tip=`${nmNm(id)}${held?" · 보유":""}${o?` · ${o.stage||"스테이지 —"} · RS ${fmt(o.rs)}`:""} · ${c.per==="new"?"확인 이후":"7일"} ${n}건 (주인공 ${c.PN[id]||0})`;
    nodesSvg.push(`<g class="nmnode" data-nm="node:${escA(id)}" opacity="${op}"><title>${esc(tip)}</title><circle cx="${x}" cy="${y}" r="${r+9}" fill="transparent"/>`+
      (held?`<circle cx="${x}" cy="${y}" r="${r+4}" fill="none" stroke="#4fd4ff" stroke-width="2"/>`:"")+
      `<circle class="nmdot" cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${st}" stroke-width="${sw}"${da?` stroke-dasharray="${da}"`:""}/></g>`);
  });
  out.push(nodesSvg.join(""));
  const prio=id=>(id===V.ctr?-1e5:0)+(role[id]==="D"?-5e4:0)+(c.HS[id]?0:1e4)+((srcS[id]||srcW[id])?0:1e3)-(c.CNT[id]||0);
  Object.keys(P).sort((a,b)=>prio(a)-prio(b)).forEach(id=>{
    const [x,y]=XY(id), r=rad(id), n=c.CNT[id]||0, ro=role[id], held=!!c.HS[id];
    const op=mode==="flow"?((n||held||srcS[id]||srcW[id])?1:0.5):(ro?1:0.25);
    const t=nmNm(id)+(held?" ●":"")+(n?" "+n:""), g=held?7:3, w=nmTW(t,12)+6;
    const pl=place(id,w,16,g,["b","t","r","l"],""), s=pl.s;
    let lx=x,ly=y,anc="middle";
    if(s==="b")ly=y+r+g+12; else if(s==="t")ly=y-r-g-4; else if(s==="r"){lx=x+r+g+3;ly=y+4;anc="start";} else {lx=x-r-g-3;ly=y+4;anc="end";}
    labels.push(`<text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="12" font-weight="700" fill="${held?"#4fd4ff":(ro==="N"?"#ffb000":"#e9e9e4")}" stroke="#0b0b0d" stroke-width="3.5" paint-order="stroke" opacity="${op}" pointer-events="none">${esc(t)}</text>`);
    if(held&&mode==="flow"){
      const a=c.HSUM[id], ns=a?Object.values(a.reps).filter(v=>v==="S").length:0, nw=a?Object.values(a.reps).filter(v=>v==="W").length:0;
      if(ns||nw){
        const bt=ns?`경계 ${ns}`:`주의 ${nw}`, bw=nmTW(bt,10.5)+10, b2=place(id,bw,15,g+2,["r","l","t","b"],s).bx;
        labels.push(`<g pointer-events="none"><rect x="${b2.x0.toFixed(1)}" y="${b2.y0.toFixed(1)}" width="${bw}" height="15" fill="${ns?"#ff5b5b":"#1f0d0d"}" stroke="#ff5b5b"${ns?"":' stroke-dasharray="3 2"'}/><text x="${(b2.x0+5).toFixed(1)}" y="${(b2.y0+11).toFixed(1)}" font-size="10.5" font-weight="700" fill="${ns?"#000000":"#ff8a8a"}">${esc(bt)}</text></g>`);
      }
    }
  });
  // 선 라벨 (화살표 건수 · 강조 링크 관계) — 선을 따라 몇 자리를 시험해 가장 덜 겹치는 곳
  const perp=(A,B)=>{const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1;let nx=-dy/L,ny=dx/L;if(ny>0||(ny===0&&nx<0)){nx=-nx;ny=-ny;}return [nx,ny];};
  const tagAt=(H,O,t,fg,bd,bg)=>{
    const w=nmTW(t,10.5)+8, nn=perp(H,O); let best=null;
    [0.5,0.6,0.4,0.7,0.3,0.78,0.22].forEach((k,i)=>[1,-1].forEach((sd,j)=>{
      const cx=H[0]+(O[0]-H[0])*k+nn[0]*12*sd, cy=H[1]+(O[1]-H[1])*k+nn[1]*12*sd;
      const bx={x0:cx-w/2,y0:cy-7.5,x1:cx+w/2,y1:cy+7.5}, sc=ovl(bx)+i*2+j;
      if(!best||sc<best.sc)best={cx,cy,bx,sc};}));
    OBS.push(best.bx);
    return `<g pointer-events="none"><rect x="${best.bx.x0.toFixed(1)}" y="${best.bx.y0.toFixed(1)}" width="${w}" height="15" fill="${bg}" stroke="${bd}"/><text x="${best.cx.toFixed(1)}" y="${(best.cy+4).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${fg}">${esc(t)}</text></g>`;
  };
  const tags=[];
  V.AP.forEach(p=>{if(!P[p.from]||!P[p.to])return;const strong=(p.s==="S");
    tags.push(tagAt(XY(p.from),XY(p.to),mode==="rep"?`${strong?"▼":"▽"} ${p.rel}${p.prop?"*":""}`:`${strong?"▼":"▽"}${p.reps.length}`,
      strong?"#ff5b5b":"#e0a0a0",strong?"#ff5b5b":"#8a4a4a",strong?"#1f0d0d":"#120a0a"));});
  c.edges.forEach(e=>{if(hl(e)==="out"&&!AK[e.a+">"+e.b]){
    const hubA=mode==="rep"?R.D.includes(e.a):e.a===V.ctr;
    tags.push(tagAt(XY(hubA?e.a:e.b),XY(hubA?e.b:e.a),e.rel+(e.prop?"*":""),"#ffb000","#b37c00","#000000"));}});
  out.push(labels.join(""), tags.join(""), `</svg>`);
  return out.join("");
}

/* 지도 아래 상세 — 모드별 */

      `<div class="nmdh"><span class="muted">주인공</span> <b>${esc(R.DP?nmNm(R.DP):((n.tk||[])[0]||"—"))}</b> <span class="muted">· 티커</span> ${tks} <span class="muted">→ 1차 파급</span> <span class="amber b">${esc(R.N1O.map(x=>nmNm(x)+(c.HS[x]?"●":"")).join(" · ")||"없음")}</span> <span class="muted">→</span> <span class="cyan b">보유 ${R.held.length}/${c.HELD.length}</span>${same.length?` <span class="muted">· 같은 사건 ${esc(same.map(x=>(x.src||"")+" "+String(x.t||"")).join(", "))}</span>`:""}</div>`+
      (R.rows.map(nmRowHtml).join("")||`<div class="muted">이 리포트의 종목에 연결된 링크 없음</div>`);

    const chain=ord.map(k=>hr[k]).sort((a,b)=>newsCmp(a.n,b.n)).map(x=>`<div class="nmrow">${x.s==="S"?'<span class="nmbg s">경계</span>':'<span class="nmbg w">주의</span>'}`+

    ` <span class="muted">· ${c.per==="new"?"확인 이후":"7일"} 태그 ${c.CNT[id]||0}건 · 주인공 ${c.PN[id]||0}건 (강${c.PB[id]||0} 약${c.PSN[id]||0})</span>${o?` <span class="k" data-cmd="${escA(id)}">종목 상세 ▸</span>`:""}</div>`+
    `<div class="nmdh"><span class="muted">1-hop</span> <span style="color:#b9b9a6">${esc((c.NB[id]||[]).map(x=>nmNm(x.t)+(c.HS[x.t]?"●":"")+(x.prop?"*":"")+" ("+x.rel+")").join(" · ")||"링크 없음")}</span></div>`+
    (trs.slice(0,6).map(n=>{const d=nmDir(n);return `<div class="nmdh"><span class="muted">${esc(nmTs(n).slice(5))}</span> <span style="color:#b9b9a6">${esc(n.src||"")}</span> <span class="b" style="color:${NM_DC[d]}">${NM_DW[d]}</span> <span class="k" data-nm="sel:${escA(nmKey(n))}">${esc(n.th||"")}</span> <span class="muted">${c.PT(n)===id?"주인공":"언급"}</span></div>`;}).join("")||`<div class="muted">이 기간에 이 종목 태그 리포트 없음</div>`);

/* 인박스 — C안 순서. 데스크톱: 행 = 지도 선택 · 폰: 행 = 원문 팝업(파급 포함) */
function nmInbox(c,phone){
  let base=c.PR, ctx="";
  if(!phone&&NM.h){const set=[NM.h].concat((c.NB[NM.h]||[]).map(x=>x.t));base=base.filter(n=>c.TG(n).some(x=>set.includes(x)));ctx=`보유 ${NM.h} ● 와 1-hop 이웃 태그만 · ${base.length}건`;}
  else if(!phone&&NM.tk){base=base.filter(n=>c.TG(n).includes(NM.tk));ctx=`${nmNm(NM.tk)} 태그 리포트만 · ${base.length}건`;}
  const T=[["all","전체",()=>true],["alert",phone?"경계":"경계·주의",n=>!!c.RSN[nmKey(n)]],["d",phone?"직접":"보유 직접",n=>c.tier(n)===0],["i",phone?"간접":"보유 간접",n=>c.tier(n)===1],["o","그 외",n=>c.tier(n)===2]];
  const cur=T.find(t=>t[0]===NM.tab)||T[0];
  const tabs=T.map(t=>`<button type="button" class="nmb${t[0]===cur[0]?" on":""}${t[0]==="alert"?" red":""}" data-nm="tab:${t[0]}">${t[1]} ${base.filter(t[2]).length}</button>`).join("");
  const rows=base.slice().sort((a,b)=>(c.pri(a)-c.pri(b))||newsCmp(a,b)).filter(cur[2]).map(n=>nmInboxRow(c,n,phone)).join("");
  const empty=`<div class="muted" style="padding:8px">${c.per==="new"?"마지막 확인 이후 새 리포트 없음 — 7일로 넓혀 보세요":"해당 리포트 없음"}</div>`;
  const colh=phone?"":`<div class="nmcolh"><span>제목 · 방향 · 시각 · 출처 · 보유 경로</span><span>핵심논지 (telegram_report_index) · 누르면 아래에 원문</span></div>`;   // === [V48]
  return `<div class="panel nminbox${phone?" ph":""}">${ph("INBOX",`${c.per==="new"?"확인 이후":"7일"} ${base.length}건 · 경계 순`)}<div class="nmtabs">${tabs}</div>${ctx?`<div class="nmctx cyan">${esc(ctx)}</div>`:""}${colh}<div class="nmlist" id="nmList">${rows||empty}</div>${phone?"":nmReader(c)}</div>`;
}
function nmInboxRow(c,n,phone){
  const k=nmKey(n), a=c.RSN[k], t=c.tier(n), on=!phone&&NM.sel===k, d=nmDir(n);
  const TL=["직접","간접","그 외"], TC=["cyan","amber","muted"];
  const badge=a==="S"?`<span class="nmbg s">경계</span>`:a==="W"?`<span class="nmbg w">주의</span>`

  const act=phone?`data-news="${n._i}"`:`data-nm="sel:${escA(k)}"`;
  const L=`<span class="nmi1">${badge}<span class="nmit">${esc(n.th||"(제목 없음)")}</span>${n.tc?`<span class="warn nmitp">[${esc(n.tc)}]</span>`:""}</span>`+
    `<span class="nmi2"><span class="b" style="color:${NM_DC[d]}">${NM_DW[d]}</span><span class="muted">${esc(nmTs(n).slice(5))}</span><span class="nmisrc">${esc(n.src||"")}</span>${n.sim?"<span class='tag muted'>SIM</span>":""}<span class="nmip ${a?"nmw":TC[t]}">${esc(nmPathTxt(c,n))}</span></span>`;
  if(phone)return `<button type="button" class="nmir${a==="S"?" s":""}" ${act} title="눌러서 원문·파급 보기">${L}</button>`;

  return `<button type="button" class="nmir${on?" on":""}${a==="S"?" s":""}" ${act} title="눌러서 지도에 파급 + 아래에 원문 (다시 누르면 해제)">`+
    `<span class="nmic">${L}</span><span class="nmith">${th?esc(th):`<span class="muted">핵심논지 = 제목</span>`}</span></button>`;
}

/* === [V48] 핵심논지 — 제목과 같으면 비움 === */
function nmThesis(n){const t=String(n.thesis||"").trim();return t&&t!==String(n.th||"").trim()?t:"";}
/* === [V48] 원문 전체: 페이로드의 raw는 900자 컷 → 누를 때 GAS ?mode=raw&r=행&t=제목 으로 그 한 행만 받는다.
   받은 원문은 행번호로 보관(5분 자동 갱신으로 NEWS가 바뀌어도 다시 받지 않음). 구버전 Code.gs면 900자만 보이고 그렇다고 밝힌다. */
const NM_RAW={};
function nmRawKey(n){return n&&n.row!=null?String(n.row)+"|"+String(n.th||""):"";}
function nmRawHtml(n){
  const k=nmRawKey(n), got=k?NM_RAW[k]:null, cut=String(n.raw||"");
  if(got&&got.ok)return `<div class="nmraw">${esc(got.raw||"(원문 없음)")}</div>`;
  if(got&&got.err)return `<div class="nmraw">${esc(cut)}${cut.length>=900?" …":""}</div><div class="muted mono-sm">원문 전체를 못 받았습니다 (${esc(got.err)}) — 앞 900자만 표시</div>`;
  if(k&&CONFIG.LIVE_URL&&!n.sim)return `<div class="nmraw ld">${cut?esc(cut)+(cut.length>=900?" …":""):""}

원문 전체 불러오는 중…</div>`;
  if(!cut)return `<div class="muted">원문 없음</div>`;
  return `<div class="nmraw">${esc(cut)}${cut.length>=900?" …":""}</div>${cut.length>=900&&!n.sim?`<div class="muted mono-sm">앞 900자 — Code.gs를 V48로 올리면 누를 때 원문 전체를 받습니다</div>`:""}`;
}
function nmRawLoad(n,after){
  const k=nmRawKey(n);
  if(!k||!CONFIG.LIVE_URL||n.sim||NM_RAW[k])return;
  NM_RAW[k]={loading:true};
  const u=CONFIG.LIVE_URL+(CONFIG.LIVE_URL.indexOf("?")>=0?"&":"?")+"mode=raw&r="+encodeURIComponent(n.row)+"&t="+encodeURIComponent(String(n.th||"").slice(0,300));
  jsonpGet(u,20000).then(j=>{
    if(j&&j.ok&&typeof j.raw==="string")NM_RAW[k]={ok:true,raw:j.raw};
    else if(j&&Array.isArray(j.universe))NM_RAW[k]={err:"구버전 Code.gs — mode=raw 없음"};
    else NM_RAW[k]={err:(j&&j.error)||"빈 응답"};
  }).catch(e=>{NM_RAW[k]={err:String(e&&e.message||e).slice(0,80)};}).then(()=>{if(after)after(n);});

function nmEgo(c,h){
  const rank={}; c.PATHS.forEach(p=>{if(p.to===h)rank[p.from]=(p.s==="S")?0:1;});
  const nbs=(c.NB[h]||[]).slice().sort((a,b)=>((a.t in rank)?rank[a.t]:2)-((b.t in rank)?rank[b.t]:2)||(c.CNT[b.t]||0)-(c.CNT[a.t]||0));
  const CX=175,CY=74,RX=128,RY=46,k=nbs.length,pos={}; pos[h]=[CX,CY];
  nbs.forEach((x,i)=>{const a=(180+360*i/Math.max(k,1))*Math.PI/180;pos[x.t]=[Math.round(CX+RX*Math.cos(a)),Math.round(CY+RY*Math.sin(a))];});
  const rr=id=>id===h?17:Math.min(14,Math.round(6+2*Math.sqrt(c.CNT[id]||0)));
  const out=[`<svg class="nmego" viewBox="0 0 350 152" role="img" aria-label="${escA(nmNm(h))}와 1-hop 이웃">`];
  nbs.forEach(x=>{if(x.t in rank)return;const A=pos[h],B=pos[x.t];out.push(`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#3a3a2c"${x.prop?' stroke-dasharray="4 3"':""}/>`);});
  c.PATHS.filter(p=>p.to===h&&pos[p.from]).forEach(p=>{
    const A=pos[p.from],B=pos[h],dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,s=(p.s==="S");
    const ra=rr(p.from)+2, rb=rr(h)+8;
    out.push(`<line x1="${(A[0]+ux*ra).toFixed(1)}" y1="${(A[1]+uy*ra).toFixed(1)}" x2="${(B[0]-ux*rb).toFixed(1)}" y2="${(B[1]-uy*rb).toFixed(1)}" stroke="${s?"#ff5b5b":"#a85656"}" stroke-width="${s?3:2}"${s?"":' stroke-dasharray="6 4"'} stroke-linecap="round" marker-end="url(#${s?"nmAhS":"nmAhW"})"/>`);
  });
  const fill=id=>{const n=c.PN[id]||0;if(!n)return c.CNT[id]?"#1d1d17":"#121210";const v=((c.PB[id]||0)-(c.PSN[id]||0))/n;return v>=0.5?"#1d5c36":v>=0.2?"#2c4a32":v>-0.2?"#3a3a2e":"#7a2424";};
  [h].concat(nbs.map(x=>x.t)).forEach(id=>{
    const [x,y]=pos[id], r=rr(id), isC=(id===h), src=(id in rank), nb=nbs.find(z=>z.t===id), prop=!isC&&nb&&nb.prop;
    const st=isC?"#ffffff":src?(rank[id]===0?"#ff5b5b":"#c46a6a"):(prop?"#b37c00":"#3a3a2c"), da=(!isC&&(src&&rank[id]===1||prop))?' stroke-dasharray="3 2"':"";
    const op=(isC||src||c.CNT[id])?1:0.5, up=!isC&&y<CY-5;
    out.push(`<g opacity="${op}">${isC?`<circle cx="${x}" cy="${y}" r="${r+4}" fill="none" stroke="#4fd4ff" stroke-width="2"/>`:""}<circle cx="${x}" cy="${y}" r="${r}" fill="${fill(id)}" stroke="${st}" stroke-width="${isC||src?2:1}"${da}/>`+
      `<text x="${x}" y="${up?y-r-4:y+r+(isC?16:12)}" text-anchor="middle" font-size="10" font-weight="700" fill="${isC?"#4fd4ff":src?(rank[id]===0?"#ff5b5b":"#e0a0a0"):"#b9b9a6"}" stroke="#0b0b0d" stroke-width="3" paint-order="stroke">${esc(isC?nmNm(h)+" ●":nmNm(id)+(prop&&nmNm(id).slice(-1)!=="*"?"*":"")+(c.CNT[id]?" "+c.CNT[id]:""))}</text></g>`);
  });
  out.push(`</svg>`);
  return out.join("");
}
