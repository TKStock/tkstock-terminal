/* ===================== [V45] 4 REGIME·RRG — 사분면 보드 (REGIME + RRG 통합, B안) =====================
   한 화면, 세 질문:
   ① 지금 레짐은?          → 맨 위 한 줄: REG 점수와 세 구성요소(시장 이긴 섹터 · 경기−방어 · VIX)
   ② 지금 돈은 어느 칸에?  → 네 칸 판(RS × 4주 변화). 섹터 = 칸 안의 칩, 오른쪽 열에 있는 섹터 수 = 브레드스
   ③ 무엇이 움직였나?      → 칸을 넘은 섹터는 화살표 (점선 = 이번 주 처음·확인 전, 실선 = 2주 연속·확정)
   아래 '칸 분포 13주' 막대가 레짐의 시간축 (막대를 누르면 그 주의 판).
   숫자는 rebuildAll의 SX·REG 그대로다 — 여기서는 주를 맞추고 그리기만 한다.
   ※ 주는 날짜(weekKey)로 맞춘다: 섹터마다 히스토리 길이가 달라도 같은 주끼리 비교된다.
   ※ VIX 52주 백분위는 쓰지 않는다 (VIXH는 시드값 — 일별 VIX 기록이 생기면 붙인다). */
const RG_POS={"개선":[0,0],"주도":[1,0],"소외":[0,1],"약화":[1,1]};   // [열: 0 = RS≤0 · 1 = RS>0, 행: 0 = 4주 변화≥0]
const RG_ORDER=["개선","주도","소외","약화"];                     // 2×2 판의 칸 (왼쪽 위부터)
const RG_QD={"주도":"#103a22","약화":"#3a320c","소외":"#3d1313","개선":"#0c3140"};
const RG_RO={"개선":"개선으로","소외":"소외로","주도":"주도로","약화":"약화로"};
// Dashboard '섹터'(야후 분류) → SPDR 섹터 ETF. ETF·INDEX 행이나 모르는 이름은 표시하지 않는다.
const RG_SECMAP={technology:"XLK",informationtechnology:"XLK",communicationservices:"XLC",commsvcs:"XLC",
  industrials:"XLI",financialservices:"XLF",financials:"XLF",healthcare:"XLV",
  consumercyclical:"XLY",consumerdiscretionary:"XLY",consdisc:"XLY",consumerdefensive:"XLP",consumerstaples:"XLP",consstaples:"XLP",
  energy:"XLE",utilities:"XLU",realestate:"XLRE",basicmaterials:"XLB",materials:"XLB"};
let RG={sel:"",wk:null,am:"1w",K:null};   // sel = 고른 섹터 · wk = 고른 주(null = 지금) · am = 화살표 기준(1w 전주 · 4w 4주 전)
let RG_NARROW=null;
const rgS=(v,d=2)=>v==null||isNaN(v)?"—":(v>0?"+":"")+fmt(v,d);

function rgSecOf(o){const k=String((o&&o.sec)||"").toLowerCase().replace(/[^a-z]/g,"");return RG_SECMAP[k]||null;}
function rgHold(){const m={};U.filter(o=>o.held).forEach(o=>{const e=rgSecOf(o);if(e)(m[e]=m[e]||[]).push(o.tk);});return m;}

/* 주 축: 모든 섹터 히스토리의 weekKey 합집합. 히스토리가 없으면(SIM) 끝에서부터 맞춘다 */
function rgWeeks(){
  const keys={}, lab={}; let real=false;
  SX.forEach(s=>{
    s._wk=null;
    if(Array.isArray(s._rsD)&&Array.isArray(s._rs)&&s._rsD.length===s._rs.length){
      real=true; s._wk={};
      s._rsD.forEach((d,i)=>{const k=weekKey(d); if(!k)return; s._wk[k]=i; keys[k]=1; if(!lab[k]||String(d)>lab[k])lab[k]=String(d);});
    }
  });
  if(real){const W=Object.keys(keys).sort(); return {W,real:true,lab:W.map(k=>lab[k].slice(5,10))};}
  const n=Math.max(0,...SX.map(s=>Array.isArray(s._rs)?s._rs.length:0));
  return {W:Array.from({length:n},(_,i)=>"i"+i),real:false,lab:Array.from({length:n},(_,i)=>i===n-1?"이번 주":(i-n+1)+"주")};
}
function rgIx(s,j,G){
  if(j<0||!Array.isArray(s._rs))return -1;
  if(G.real&&s._wk){const i=s._wk[G.W[j]]; return i==null?-1:i;}
  const i=s._rs.length-(G.W.length-j); return i<0?-1:i;
}
function rgQ(s,j,G){const i=rgIx(s,j,G); return i>=0&&Array.isArray(s.q)?(s.q[i]||null):null;}
function rgRS(s,j,G){const i=rgIx(s,j,G); return i>=0?s._rs[i]:null;}
function rgM4(s,j,G){const i=rgIx(s,j,G); return i>=4?s._rs[i]-s._rs[i-4]:null;}

/* 판 모델: 고른 주 k의 칸 · 이동(화살표) · 고스트(이전 자리) */
function rgModel(){
  const G=rgWeeks(), K=G.W.length-1;
  if(RG.K!==K){RG.K=K; RG.wk=null;}                                  // 새 주가 들어오면 '지금'으로 돌아온다
  const k=(RG.wk==null||RG.wk<0||RG.wk>K)?K:RG.wk, L=RG.am==="4w"?4:1, isNow=k===K;
  const list=SX.filter(s=>Array.isArray(s._rs)&&s._rs.length);
  const Q=(s,j)=>rgQ(s,j,G);
  const moved=[], conf=[];
  list.forEach(s=>{const a=Q(s,k-L), b=Q(s,k); if(a&&b&&a!==b)moved.push(s);});
  if(L===1)list.forEach(s=>{const a=Q(s,k-2), b=Q(s,k-1), c=Q(s,k); if(a&&b&&c&&b===c&&a!==b)conf.push(s);});
  const all=moved.concat(conf);
  const from=s=>conf.includes(s)?Q(s,k-2):Q(s,k-L);
  const mem={}, gh={};
  RG_ORDER.forEach(q=>{
    const a=list.filter(s=>Q(s,k)===q).sort((x,y)=>rgRS(y,k,G)-rgRS(x,k,G));
    const inn=a.filter(s=>all.includes(s)), stay=a.filter(s=>!all.includes(s));
    mem[q]=RG_POS[q][1]===0?stay.concat(inn):inn.concat(stay);          // 새로 들어온 섹터는 넘어온 경계 쪽 끝에
    gh[q]=[];
  });
  // 고스트 자리: 같은 열로 움직였으면 바깥쪽 절반, 다른 열로 갔으면 가운데 쪽 절반 → 화살표가 짧고 덜 엉킨다
  all.forEach(s=>{const f=from(s), t=Q(s,k), fc=RG_POS[f][0], tc=RG_POS[t][0];
    gh[f].push({s,cf:conf.includes(s),to:t,half:fc===tc?(fc===0?0:1):(fc===0?1:0)});});
  RG_ORDER.forEach(q=>{const c=[0,0]; gh[q].forEach(g=>{g.row=c[g.half]++;});});
  return {G,K,k,L,isNow,list,moved,conf,all,from,mem,gh,Q,H:rgHold(),noQ:list.filter(s=>!Q(s,k))};
}
function rgStreak(m,s,q){let c=0; for(let j=m.k; j>=0&&m.Q(s,j)===q; j--)c++; return c;}
function rgBreadthAt(m,j){let n=0,any=false; m.list.forEach(s=>{const r=rgRS(s,j,m.G); if(r!=null){any=true; if(r>0)n++;}}); return any?n:null;}

/* 다음 주 판정선: 4주 변화의 기준점(3주 전 RS)이 이미 정해져 있어, 다음 주 칸은 다음 주 RS 하나로 결정된다 */
function rgNext(s){
  const r=s._rs, n=Array.isArray(r)?r.length:0; if(n<5||!s.quad)return null;
  const b=r[n-4], now=r[n-1], cur=s.quad;
  const seg=b>=0?[{lo:null,hi:0,q:"소외"},{lo:0,hi:b,q:"약화"},{lo:b,hi:null,q:"주도"}]
               :[{lo:null,hi:b,q:"소외"},{lo:b,hi:0,q:"개선"},{lo:0,hi:null,q:"주도"}];
  const rng=g=>b>=0?(g.q==="소외"?"RS ≤ 0":g.q==="약화"?`0 < RS < ${rgS(b)}`:`RS ≥ ${rgS(b)}`)
                   :(g.q==="소외"?`RS < ${rgS(b)}`:g.q==="개선"?`${rgS(b)} ≤ RS ≤ 0`:"RS > 0");
  const flat=quadOf(now,now-b), keep=seg.find(g=>g.q===cur);
  let flatTxt;
  if(flat===cur&&keep){
    const dl=keep.lo==null?Infinity:now-keep.lo, dh=keep.hi==null?Infinity:keep.hi-now, mg=Math.min(dl,dh), edge=dl<=dh?keep.lo:keep.hi;
    flatTxt=`제자리면 ${cur} 유지`+(isFinite(mg)?` · 경계(${edge===0?"0":rgS(edge)})까지 ${fmt(mg)}`:"");
  }else flatTxt=`제자리면 다음 주 ${RG_RO[flat]} 바뀜`;
  return {b,now,seg,cur,flat,flips:flat!==cur,
    keepTxt:keep?`${rng(keep)} → ${cur} 유지`:`다음 주엔 ${cur}에 머물 수 없음 (기준점 ${rgS(b)} ≥ 0)`,
    others:seg.filter(g=>g.q!==cur).map(g=>`${rng(g)} ${g.q}`).join(" · "), flatTxt};
}
function rgNextHtml(nr){
  const xs=[0,nr.b,nr.now], lo0=Math.min(...xs), hi0=Math.max(...xs), sp=Math.max(hi0-lo0,4), lo=lo0-sp*0.22, hi=hi0+sp*0.22;

function psPolicy(list){
  let pol=null,band=null,cap=null;
  for(const j of list){
    const txt=String(j.text||"")+"\n"+String(j.falsify||"");
    if(!pol){
      const t=txt.match(PS_TAG);
      if(t){const k=psTagPol(t[1]); if(k){pol={k,why:t[0].trim(),j,tag:true};
        const bm=t[1].match(/(\d{1,2})\s*[-~–]\s*(\d{1,2})\s*%/); if(bm&&!band)band=[+bm[1],+bm[2]];
        const cm=t[1].match(/상한\s*(\d{1,2})\s*%/); if(cm&&cap==null)cap=+cm[1];}}
      if(!pol){for(const [k,rx] of PS_RX){const m=txt.match(rx); if(m){pol={k,why:m[0],j,tag:false};break;}}}
    }
    if(!band){const m=txt.match(/최소\s*(\d{1,2})\s*%[^\n]{0,15}최대\s*(\d{1,2})\s*%/)||txt.match(/밴드\s*(\d{1,2})\s*[-~–]\s*(\d{1,2})\s*%/); if(m)band=[+m[1],+m[2]];}
    if(cap==null){const m=txt.match(/비중\s*상한\s*(\d{1,2})\s*%/); if(m)cap=+m[1];}
  }
  return {k:pol?pol.k:"atr",why:pol?pol.why:"",j:pol?pol.j:null,tag:pol?pol.tag:false,band,cap};
}

function psDefaultSel(M){   // 처음 열 때: 이탈 → 손볼 것(F 확인·테제 없음·P 경고) 중 비중 큰 것 → 비중 큰 것

/* === [V35] 자동 갱신 ===
   ⚠️ 작성 중인 글을 지우면 안 된다. render()가 화면을 통째로 다시 그리므로
      입력 중이거나 팝업이 열려 있으면 이번 주기는 건너뛴다. */
/* === [V42] 실패 후 빠른 재시도 (20초 → 1분 → 2분, 이후엔 5분 주기) === */
let RETRY_T=null, RETRY_N=0;
function scheduleRetry(){
  if(RETRY_T)return null;
  const waits=[20000,60000,120000];
  const w=waits[Math.min(RETRY_N,waits.length-1)]; RETRY_N++;
  RETRY_T=setTimeout(()=>{RETRY_T=null; autoSync();},w);
  return w;
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"||!CONFIG.LIVE_URL)return;
  const age=LAST_SYNC?Date.now()-LAST_SYNC:Infinity;
  if(!LIVE_ON||LIVE_STALE||age>(CONFIG.REFRESH_MIN||5)*60000)autoSync();   // 다시 볼 때 낡았으면 즉시 갱신
});
function autoSync(){
  if(!CONFIG.LIVE_URL||!CONFIG.REFRESH_MIN)return;
  if(MODAL)return;
  if(SAVING)return;                                   // === [V42] 저장 확인 중에는 무거운 갱신을 겹치지 않음
  if(document.visibilityState==="hidden")return;      // === [V42] 안 보는 동안엔 요청 안 함 → 돌아오면 바로 갱신
  /* === [V42] 명령창(CMD)은 화면을 열면 커서가 기본으로 들어가는 곳이라, 거기 커서가 있으면
     '입력 중'으로 보고 건너뛰던 규칙 때문에 자동 갱신이 사실상 멈춰 있었다. 한 번 SIM으로
     떨어지면 다시 시도하지 않아 켜둔 화면이 계속 SIM으로 남던 원인. → 명령창은 글자가 있을
     때만 건너뛰고, 일지·필터 같은 다른 입력칸에 커서가 있을 때는 계속 건너뛴다. */
  const a=document.activeElement;
  if(a&&a.id==="cmd"){if(a.value.trim())return;}
  else if(isTypingTarget(a))return;
  tryLive({silent:true});
}

  if(t){if(MODAL)modalClose();go(t.getAttribute("data-cmd"));return;}  // 모달 안 티커 클릭 → 닫고 이동
  const nmx=e.target.closest("[data-nm]");                            // === [V44] NEWS·MAP 조작 (선택·포커스·기간·탭)
  if(nmx){nmAct(nmx.getAttribute("data-nm"));return;}
  const rgx=e.target.closest("[data-rg]");                            // === [V45] REGIME·RRG 조작 (섹터·주·화살표 기준)
  if(rgx){rgAct(rgx.getAttribute("data-rg"));return;}
  const rvx=e.target.closest("[data-rv]");                            // === [V47] REV·VAL 조작 (종목·기간)
  if(rvx){rvAct(rvx.getAttribute("data-rv"));return;}
  const psx=e.target.closest("[data-ps]");                            // === [V47] PORT·STAGE 조작 (종목·예수금)
  if(psx){psAct(psx.getAttribute("data-ps"));return;}
  const nn=e.target.closest("[data-news]");
  if(nn){newsModal(+nn.getAttribute("data-news"));return;}
  // === [V43] 일지 읽기 창: 열기 / 상태 변경 / 원문 복사
  const jj=e.target.closest("[data-jid]");
  if(jj){jOpen(jj.getAttribute("data-jid"));return;}
  const js=e.target.closest("[data-jst]");
  if(js){jSetStatus(js.getAttribute("data-jst"));return;}
  if(e.target.closest("[data-jcopy]")){jCopy();return;}
});
el("cmd").addEventListener("keydown",e=>{if(e.key==="Enter"){go(e.target.value);e.target.value="";}else if(e.key==="Escape"){if(MODAL){modalClose();return;}e.target.value="";if((state.view==="NEWS"||state.view==="MAP")&&nmFocused()){nmAct("reset");return;}if((state.view==="REGIME"||state.view==="RRG")&&rgFocused()){rgAct("reset");return;}if((state.view==="REV"||state.view==="VAL")&&rvFocused()){rvAct("reset");return;}if((state.view==="PORT"||state.view==="STAGE")&&psFocused()){psAct("reset");return;}go("MENU");}});   // === [V44]
/* === [V32] 입력 중에는 전역 단축키를 잡지 않는다 ===
   기존 핸들러는 el("cmd")만 예외로 뒀다. 그래서 THESIS 폼(제목·내용·반증조건·티커)이나
   필터 입력창에 숫자를 치면 그 즉시 다른 함수 화면으로 넘어가 글이 날아갔다.
   → 편집 가능한 요소(INPUT/TEXTAREA/SELECT/contenteditable)에 포커스가 있으면
     숫자·'/'·ESC를 전부 그 요소에 넘긴다. ESC는 화면 이동 대신 포커스 해제로 처리. */
function isTypingTarget(t){
  if(!t)return false;
  const tag=(t.tagName||"").toUpperCase();
  return tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||t.isContentEditable===true;
}
document.addEventListener("keydown",e=>{
  if(MODAL){if(e.key==="Escape")modalClose();return;}   // === [V24] 모달 우선
  if(isTypingTarget(e.target)||isTypingTarget(document.activeElement)){
    if(e.key==="Escape"&&document.activeElement!==el("cmd")){
      e.preventDefault();
      try{document.activeElement.blur();}catch(_){}
    }
    return;                                             // 숫자·'/'는 그대로 입력됨
  }
  if(e.key==="Escape"){if((state.view==="NEWS"||state.view==="MAP")&&nmFocused()){nmAct("reset");return;}if((state.view==="REGIME"||state.view==="RRG")&&rgFocused()){rgAct("reset");return;}if((state.view==="REV"||state.view==="VAL")&&rvFocused()){rvAct("reset");return;}if((state.view==="PORT"||state.view==="STAGE")&&psFocused()){psAct("reset");return;}go("MENU");}   // === [V44]
  else if(e.key==="/"){e.preventDefault();el("cmd").focus();}
  else if(e.key==="r"||e.key==="R"){e.preventDefault();manualSync();}   // === [V35] 즉시 갱신
  else if(/^[1-9]$/.test(e.key)&&+e.key<=FUNCS.length){go(e.key);}   // === [V49] 1~7
});


/* LIVE 데이터: GAS doGet(Code.gs)이 Dashboard·Holdings 탭을 JSON으로 반환하면
   RAW/HOLD/SECT/CONFIG를 교체하고 rebuildAll()로 전체 재조립 후 재렌더링.
   NEWS/CATALYSTS(정성 데이터)는 별도 연동 전까지 데모(SIM) 유지.

   === [V37] fetch → JSONP 전환 ===
   증상: 브라우저 주소창으로 /exec 을 열면 JSON이 정상으로 보이는데,
         이 파일(file://)의 fetch()는 항상 실패해 SIM 폴백이 떴다.
   원인: file:// 페이지의 fetch는 Origin이 null이다. Apps Script는
         /exec → script.googleusercontent.com 으로 302 리디렉션하는데,
         이 조합에서 브라우저가 응답 읽기를 차단한다. 배포를 몇 번
         다시 해도 해결되지 않는 이유다 — 배포 문제가 아니었다.
   해법: <script> 태그 로드는 CORS 검사를 받지 않는다. doGet이
         ?callback=이름 을 받으면 JSON을 이름(...)으로 감싸 JS로 돌려주고
         (Code.gs V34), 여기서는 fetch 대신 script 태그로 불러온다.
         file:// 에서도, https 호스팅에서도 동일하게 동작한다.
   쓰기(doPost)는 fetch mode:"no-cors"로 전송한다 — 응답은 못 읽지만
   기록은 되므로, 저장 후 JSONP로 Journal을 다시 읽어 실재 여부로 판정한다
   (V31의 엔드투엔드 확인 원칙 그대로). */

function jsonpGet(url,timeoutMs){
  return new Promise((resolve,reject)=>{
    const cb="__tk_jsonp_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    const sc=document.createElement("script");
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error(`응답 시간 초과(${Math.round((timeoutMs||25000)/1000)}초) — 서버(Apps Script) 처리가 늦었습니다. `
        +"자주 반복되면 Apps Script 편집기 > 실행 기록에서 doGet 소요 시간을 확인하세요."));
    },timeoutMs||25000);
    function cleanup(){clearTimeout(timer);try{delete window[cb];}catch(e){}sc.remove();}
    window[cb]=(data)=>{cleanup();resolve(data);};
    sc.onerror=()=>{cleanup();reject(new Error("스크립트 로드 실패 (네트워크 또는 URL 오류)"));};
    sc.src=url+(url.indexOf("?")>=0?"&":"?")+"callback="+cb+"&_ts="+Date.now();
    document.head.appendChild(sc);
  });
}
async function tryLive(opts){
  const silent=!!(opts&&opts.silent);
  if(!CONFIG.LIVE_URL)return;
  const _prevNews=Array.isArray(NEWS)?NEWS.length:0;
  let _scroll=0;
  try{_scroll=(document.scrollingElement||document.documentElement).scrollTop||0;}catch(e0){}
  try{
    const j=await jsonpGet(CONFIG.LIVE_URL,45000);   // === [V37] fetch → JSONP · [V42] 전체 페이로드는 45초까지 기다림 ===
    if(j && j.error) throw new Error(j.error);
    if(!j || !Array.isArray(j.universe) || !j.universe.length) throw new Error("빈 응답(universe 없음)");

    if(j.asof) CONFIG.ASOF=j.asof;
    if(j.vix!=null) CONFIG.VIX=j.vix;

    // universe row = [tk,sec,px,rs,ud,tgt,gap%,e0,e1,e2,p0,p1,p2,g1%,g2%,peg1,peg2, stopPx]
    RAW=j.universe.map(row=>row.slice(0,17));
    LIVE_STOP={}; LIVE_STAGE={}; LIVE_MA={};
    j.universe.forEach(row=>{
      if(row[17]!=null) LIVE_STOP[row[0]]=row[17];
      if(row[18]) LIVE_STAGE[row[0]]=String(row[18]).trim();
      // === [V34] 19~22 = MA20 · MA50 · 60일 고점 · 고점대비(%) ===
      if(row[19]!=null||row[21]!=null)
        LIVE_MA[row[0]]={ma20:row[19],ma50:row[20],hi60:row[21],dd:row[22]};
    });
    // === [V40] 주 1점으로 정리 (Code.gs V40이면 이미 정리돼 와서 그대로 통과)
    LIVE_EPSH=weeklyHist((j.epsHist&&typeof j.epsHist==="object")?j.epsHist:{});
    LIVE_RSH=weeklyHist((j.rsHist&&typeof j.rsHist==="object")?j.rsHist:{});
    // === [V46] VAL 실측 z — Code.gs perHist (없으면 epsHist의 [날짜,EPS,PER] 세 번째 값)
    LIVE_PERH=weeklyHist((j.perHist&&typeof j.perHist==="object")?j.perHist:perFromEpsHist(j.epsHist));
    LIVE_PERH_ON=Object.keys(LIVE_PERH).length>0;
    LIVE_PERH_SENT=!!(j.perHist&&typeof j.perHist==="object");
    LIVE_VALH=weeklyRows((j.perHist&&typeof j.perHist==="object")?j.perHist:{});   // === [V47] 경주선용 (점 전체)
    LIVE_CASH=(j.cash&&typeof j.cash==="object")?j.cash:null;                      // === [V47] 예수금 (Cash 탭)
    LIVE_AI=(j.verdicts&&typeof j.verdicts==="object")?j.verdicts:{};              // === [V47] AI판정 최신
    JOURNAL=Array.isArray(j.journal)?j.journal:[];
    LIVE_GAS={ver:j.gasVer||null,hasPost:!!j.hasPost};   // === [V31] 배포 신선도
    LIVE_INDEX=(j.index&&typeof j.index==="object")?j.index:null;

    if(j.holdings) HOLD=j.holdings;
    if(Array.isArray(j.sectors)&&j.sectors.length) SECT=j.sectors;
    if(Array.isArray(j.news)) NEWS=j.news;   // telegram_report_index 실측 리포트로 교체 (없으면 SIM 데모 유지)
    // === [V38] 촉매 캘린더 · 섹터 EPS (Catalysts / SectorEPS 탭) ===
    // 탭이 비어 있으면 빈 배열이 온다 → CATALYSTS는 SIM 시드를 유지해 화면이
    // 비어 보이지 않게 하고, 한 건이라도 있으면 통째로 교체한다.
    if(Array.isArray(j.catalysts)&&j.catalysts.length) CATALYSTS=j.catalysts;
    if(j.sectorEps&&Array.isArray(j.sectorEps.rows)) SECTOR_EPS=j.sectorEps;

    LIVE_ON=true; LIVE_STALE=false; LIVE_MS=(j.ms!=null?j.ms:null);   // === [V42]
    RETRY_N=0; if(RETRY_T){clearTimeout(RETRY_T);RETRY_T=null;}
    rebuildAll();
    paintTop();paintTape();paintFkeys();
    render();
    // === [V35] 자동 갱신 시 보던 위치를 잃지 않게 스크롤 복원 ===
    if(silent){try{(document.scrollingElement||document.documentElement).scrollTop=_scroll;}catch(e1){}}
    LAST_SYNC=Date.now(); _connCache=""; paintConn();
    // === [V35] 새로 들어온 리포트 알림 (분류기가 태깅을 마친 건만 집계된다) ===
    const _added=(Array.isArray(NEWS)?NEWS.length:0)-_prevNews;
    if(silent&&_added>0) flashHint(`새 리포트 ${_added}건 — 1 NEWS·MAP`);
  }catch(err){
    LAST_LIVE_ERR=(err&&err.message)||String(err);
    console.error("[tryLive] 실패:",err);
    _connCache="";
    if(LIVE_ON&&LAST_SYNC){
      /* === [V42] 이미 실데이터를 받은 상태면 LIVE를 유지하고 '갱신 지연'만 표시 ===
         V41까지는 갱신 한 번만 실패해도 전체가 SIM으로 떨어졌고, 그 상태에선 저장 버튼도 잠겼다
         (2026-09-29 저장 직후 재조회가 늦어 발생). 화면의 데이터는 직전 값 그대로 유효하다. */
      LIVE_STALE=true; paintConn(); scheduleRetry();
      if(!silent)flashHint("갱신 실패 — 직전 데이터 유지 (다시 시도: R)");
    }else{
      LIVE_ON=false;
      const w=scheduleRetry();
      el("conn").innerHTML=`<span class='dn k' onclick="manualSync()" title="${esc(LAST_LIVE_ERR)} — 클릭하면 즉시 재시도">◆ 연결 실패${w?` · ${Math.round(w/1000)}초 뒤 재시도`:" · 재시도 예정"}</span>`;
      if(state.view==="MENU")render();                // 배너 문구 갱신
    }
  }
}

/* === [V41] SETUP — 연결 설정 화면 (값은 이 브라우저 localStorage에만) === */
const URL_RE=/^https:\/\/script\.google\.com\/.+\/exec$/;
function openSetup(first){
  MODAL=true; jModalReset();                          // === [V43]
  const hasAny=!!(secretGet(SECRET_KEYS.url)||secretGet(SECRET_KEYS.key));
  el("modal").innerHTML=
   `<div style="display:flex;justify-content:space-between;align-items:center">
      <span class="amber b" style="font-size:14px">⚙ 연결 설정${first?" — 첫 실행":""}</span>
      <span class="k" onclick="setupDemo()">✕ ${first?"데모로 보기":"닫기"}</span></div>
    <div class="muted mono-sm" style="margin-top:6px;line-height:1.6">입력한 값은 <b>이 기기의 이 브라우저</b>에만 저장됩니다. 파일·저장소·다른 기기에는 남지 않습니다.<br>PC와 폰은 각각 한 번씩 입력하세요.</div>
    <div class="sep"></div>

      style="box-sizing:border-box;width:100%;margin-top:4px;padding:8px;background:#161b22;color:var(--white);border:1px solid var(--line);font:inherit">
    <label class="b" for="stKey" style="display:block;margin-top:10px">일지 저장 키 <span class="muted mono-sm">(THESIS 저장에만 필요 · Code.gs의 WRITE_KEY와 같은 값)</span></label>
    <input id="stKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="비워 두면 읽기 전용" value="${esc(CONFIG.WRITE_KEY||"")}"
      style="box-sizing:border-box;width:100%;margin-top:4px;padding:8px;background:#161b22;color:var(--white);border:1px solid var(--line);font:inherit">
    <div id="stMsg" class="mono-sm" style="margin-top:8px;min-height:1.4em"></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <span class="k" onclick="setupSave()">▶ 저장하고 연결</span>
      ${hasAny?`<span class="k" onclick="setupClear()">🗑 이 기기에서 지우기</span>`:""}
    </div>`;
  el("modalbg").style.display="flex";
  // 폰에서는 자동 포커스 안 함(키보드가 바로 올라와 화면을 가림). PC(마우스)에서만.
  try{if(matchMedia("(pointer:fine)").matches)setTimeout(()=>{try{el(CONFIG.LIVE_URL?"stKey":"stUrl").focus({preventScroll:true});}catch(e){}},50);}catch(e){}
}
function setupMsg(t,cls){const m=el("stMsg");if(m)m.innerHTML=`<span class="${cls||"muted"}">${esc(t)}</span>`;}
async function setupSave(){
  const u=el("stUrl").value.trim(), k=el("stKey").value.trim();
  if(!u){setupMsg("URL을 입력하세요 (읽기 전용으로 쓰려면 키는 비워도 됩니다)","dn");return;}
  if(!URL_RE.test(u)){setupMsg("형식이 다릅니다 — https://script.google.com/…/exec 로 끝나는 배포 URL이어야 합니다","dn");return;}
  const ok=secretSet(SECRET_KEYS.url,u)&secretSet(SECRET_KEYS.key,k);
  if(u!==CONFIG.LIVE_URL){LIVE_ON=false;LAST_SYNC=null;LIVE_STALE=false;}   // === [V42] 주소가 바뀌면 새로 판정
  CONFIG.LIVE_URL=u; CONFIG.WRITE_KEY=k;
  setupMsg("연결 확인 중…","warn");
  const _prevSync=LAST_SYNC;
  await tryLive();
  if(LIVE_ON&&LAST_SYNC&&LAST_SYNC!==_prevSync){
    modalClose();
    flashHint(ok?"연결됨 — 이 기기에 저장했습니다":"연결됨 — 단, 이 브라우저가 저장을 막아 다음 실행 때 다시 물을 수 있습니다");
  }else{
    MODAL=true; el("modalbg").style.display="flex";
    setupMsg("연결 실패: "+(LAST_LIVE_ERR||"알 수 없는 오류")+" — URL을 확인하세요 (값은 저장해 두었습니다)","dn");
  }
}

  secretSet(SECRET_KEYS.url,""); secretSet(SECRET_KEYS.key,"");
  CONFIG.LIVE_URL=""; CONFIG.WRITE_KEY="";

}

/* === [V38] 서비스 워커 등록 ===
   https가 아니면 navigator.serviceWorker 자체가 없거나 등록이 거부된다.
   그 경우 조용히 넘어간다 — file:// 사용에 아무 영향이 없다. */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js")
      .catch(err=>console.warn("[SW] 등록 실패:",err));
  });
}
