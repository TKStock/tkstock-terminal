<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- === [V38] PWA === 
     file:// 로 열면 이 세 줄은 조용히 무시된다 (manifest·SW 모두 https 필요).
     GitHub Pages 등 https에 올렸을 때만 '홈 화면에 추가'가 활성화된다.
     로컬 파일 사용은 지금과 똑같이 계속 된다. -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#090b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TKSTOCK">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>TKSTOCK TERMINAL</title>
<style>
  :root{
    --bg:#000000; --panel:#0b0b0d; --panel2:#111114; --line:#26261c;
    --amber:#ffb000; --amber-dim:#b37c00; --white:#e9e9e4; --muted:#7d7d68;
    --up:#33d17a; --dn:#ff5b5b; --cyan:#4fd4ff; --violet:#c08cff; --warn:#ffd23f;
    --hdr-fg:#000000;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);}
  body{
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
    color:var(--white); font-size:12px; line-height:1.35;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  #app{display:flex; flex-direction:column; height:100vh;}
  a,.k{color:var(--cyan); cursor:pointer; text-decoration:none;}
  .k:hover{background:var(--cyan); color:#000;}
  .amber{color:var(--amber);} .muted{color:var(--muted);} .up{color:var(--up);} .dn{color:var(--dn);}
  .cyan{color:var(--cyan);} .warn{color:var(--warn);} .violet{color:var(--violet);}
  .b{font-weight:700;}

  /* top bar */
  #topbar{display:flex; align-items:center; gap:14px; padding:5px 10px;
    background:linear-gradient(#151510,#0a0a08); border-bottom:1px solid var(--line);}
  #brand{font-weight:800; letter-spacing:2px; color:var(--amber);}
  #brand .go{background:var(--amber); color:#000; padding:0 5px; margin-left:6px; border-radius:1px;}
  #topbar .stat{white-space:nowrap;}
  #topbar .spacer{flex:1;}
  #reglight{padding:1px 8px; border:1px solid var(--line); border-radius:2px; font-weight:700;}
  #clock{color:var(--muted);}
  #conn{font-weight:700;}

  /* command bar */
  #cmdbar{display:flex; align-items:center; gap:8px; padding:4px 10px;
    background:#0a0a08; border-bottom:1px solid var(--line);}
  #prompt{color:var(--amber); font-weight:700;}
  #cmd{flex:0 0 auto; width:230px; background:#000; border:1px solid var(--amber-dim);
    color:var(--amber); font:inherit; padding:2px 6px; outline:none; text-transform:uppercase;}
  #cmd:focus{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber-dim) inset;}
  #cmdhint{color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  #cmdhint b{color:var(--amber-dim);}

  /* ticker tape */
  #tape{overflow:hidden; white-space:nowrap; border-bottom:1px solid var(--line);
    background:#050504; padding:3px 0; position:relative;}
  #tapeInner{display:inline-block; padding-left:100%; animation:tape 55s linear infinite;}
  #tape:hover #tapeInner{animation-play-state:paused;}
  @keyframes tape{from{transform:translateX(0)} to{transform:translateX(-50%)}}
  .tq{margin:0 18px;} .tq .sym{color:var(--amber);} .tq .px{color:var(--white);}

  /* screen */
  #screen{flex:1; overflow:auto; padding:8px; }
  #screen::-webkit-scrollbar{width:9px;height:9px;} #screen::-webkit-scrollbar-thumb{background:#2a2a1c;}
  .viewhdr{display:flex; align-items:baseline; gap:10px; margin-bottom:6px;}
  .viewhdr .code{background:var(--amber); color:#000; font-weight:800; padding:1px 7px;}
  .viewhdr .ttl{color:var(--amber); font-weight:700; letter-spacing:1px;}
  .viewhdr .sub{color:var(--muted);}

  .panel{border:1px solid var(--line); background:var(--panel); margin-bottom:8px;}
  .panel>.ph{background:var(--amber); color:#000; font-weight:700; padding:2px 8px; letter-spacing:.5px;
    display:flex; justify-content:space-between; align-items:center;}
  .panel>.ph .rt{font-weight:600; color:#3a2b00;}
  .panel>.pb{padding:6px 8px;}
  .grid{display:grid; gap:8px;}
  .g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:900px){.g2,.g3{grid-template-columns:1fr;}}

  table{border-collapse:collapse; width:100%;}
  th,td{padding:1px 8px 1px 0; text-align:right; white-space:nowrap;}
  th{color:var(--amber-dim); font-weight:600; border-bottom:1px solid var(--line); text-align:right;}
  th:first-child,td:first-child{text-align:left; padding-left:2px;}
  tr.row:hover td{background:#17170f;}
  td.sym{color:var(--cyan); cursor:pointer;} td.sym:hover{background:var(--cyan); color:#000;}
  .bar{display:inline-block; height:8px; vertical-align:middle;}
  .tag{padding:0 5px; border:1px solid currentColor; border-radius:2px; font-size:10px; font-weight:700;}
  .chip{padding:0 5px; border-radius:2px; font-weight:700;}
  .chip.on{background:var(--up); color:#000;} .chip.off{background:var(--dn); color:#000;}
  .chip.neu{background:#333; color:var(--white);}

  /* launchpad tiles */
  .tiles{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:8px;}
  @media(max-width:1100px){.tiles{grid-template-columns:repeat(2,1fr);}}
  .tile{border:1px solid var(--line); background:var(--panel); padding:8px; cursor:pointer; position:relative;}
  .tile:hover{border-color:var(--amber); background:var(--panel2);}
  .tile .num{position:absolute; top:6px; right:8px; color:var(--amber-dim); font-weight:800;}
  .tile .code{color:var(--amber); font-weight:800; letter-spacing:1px;}
  .tile .nm{color:var(--white); margin-top:2px;} .tile .ko{color:var(--muted); font-size:11px;}

  .banner{border:1px solid var(--amber-dim); background:#1a1204; color:var(--warn);
    padding:4px 8px; margin-bottom:8px; font-size:11px;}
  .foot{padding:3px 10px; border-top:1px solid var(--line); background:#0a0a08; color:var(--muted);
    display:flex; gap:14px; flex-wrap:wrap;}
  .foot .k{padding:0 4px;}
  .sep{height:1px;background:var(--line);margin:6px 0;}
  .kpi{font-size:20px; font-weight:800;}
  .mono-sm{font-size:11px;}
  svg text{font-family:inherit;}
  .legend span{margin-right:12px;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:3px;}
  /* === [V24] 뉴스 팝업 모달 === */
  #modalbg{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;z-index:60;align-items:flex-start;justify-content:center;padding:6vh 12px}
  #modal{width:min(760px,100%);max-height:82vh;overflow:auto;background:#0d1117;border:1px solid var(--amber);padding:14px 16px;box-shadow:0 0 30px rgba(0,0,0,.6)}
  #modal .mraw{white-space:pre-wrap;word-break:break-word;background:#161b22;border:1px solid var(--bd);padding:8px;margin-top:6px;font-size:12px;line-height:1.5}
  [data-news]{cursor:pointer}
  /* === [V40] 섹터 로테이션 보드 === */
  .rrghead{padding:6px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;line-height:1.5}
  .qs{display:inline-flex;gap:1px;vertical-align:middle}
  .qs i{display:inline-block;width:14px;height:15px;font-style:normal;font-size:9.5px;line-height:15px;text-align:center;color:#000;font-weight:800;font-family:system-ui,sans-serif}
  .qs i.na{background:#1a1a14}
  tr.hl td{background:#1b1706}
  .rrgcards{display:none;grid-template-columns:1fr;gap:6px}
  .rcard{border:1px solid var(--line);background:var(--panel2);padding:7px 8px;display:flex;flex-direction:column;gap:5px}
  .rcard .rtop{display:flex;justify-content:space-between;align-items:center}
  .rcard .rq{color:#000;font-weight:800;padding:0 6px;border-radius:2px;font-family:system-ui,sans-serif;font-size:11px}
  .rcard .rnum{display:flex;flex-wrap:wrap;gap:4px 12px}
  .rcard .rv{font-family:system-ui,sans-serif;line-height:1.45}
  @media(max-width:700px){.rrgtable{display:none}.rrgcards{display:grid}}
  /* === [V41] 폰 폭: 상단 상태줄이 화면 밖으로 밀려(레이아웃 폭 ~640px) 페이지가 옆으로 스크롤되던 것 → 줄바꿈 === */
  @media(max-width:700px){#topbar{flex-wrap:wrap;gap:4px 10px}#topbar .spacer{display:none}#clock{font-size:11px}#modal{box-sizing:border-box}}
</style>
</head>
<body>
<div id="modalbg"><div id="modal"></div></div>
<div id="app">
  <div id="topbar">
    <span id="brand">TKSTOCK<span class="go">&lt;GO&gt;</span></span>
    <span class="stat muted">VIX <span id="tbvix" class="warn b"></span></span>
    <span class="stat muted">BREADTH <span id="tbbr" class="b"></span></span>
    <span id="reglight">REGIME</span>
    <span class="stat muted">P/L <span id="tbpl" class="b"></span></span>
    <span id="tbviol"></span>
    <span class="spacer"></span>
    <span id="conn" class="warn">◆ SIM FEED</span>
    <span id="clock"></span>
  </div>

  <div id="cmdbar">
    <span id="prompt">CMD▸</span>
    <input id="cmd" autocomplete="off" spellcheck="false" placeholder="함수코드 또는 티커…">
    <span id="cmdhint"></span>
  </div>

  <div id="tape"><span id="tapeInner"></span></div>

  <div id="screen"></div>

  <div class="foot" id="fkeys"></div>
</div>

<script>
"use strict";
/* ============================================================================
   TKSTOCK TERMINAL  —  10개 고도화 방안 통합 콕핏
   1 NEWS  종목별 뉴스 사이드카        6 REGIME 시장 레짐·브레드스
   2 CAT   촉매 캘린더                 7 RRG    섹터 로테이션
   3 MAP   공급망·테마 파급 맵          8 REV    컨센서스 EPS 리비전
   4 RISK  ATR 손절·규칙 엔진          9 VAL    밸류에이션 Z-스코어
   5 PORT  포지션·손익 블로터          10 SIG   신호 백테스트·애널리스트 원장

   [DATA] 단면(현재가/RS/U/D/EPS/PER/PEG/목표가/보유단가/섹터ETF/VIX)은
   실제 시트(2026-07-19)에서 읽은 값. 시계열(ATR·MA·PER히스토리·EPS리비전·
   백테스트)은 현재값에 앵커링한 시드(seed) 데이터로 로직을 실제 구동한다.
   → LIVE 연결: [V41] 파일에 URL·키를 넣지 않는다. 첫 실행 때 SETUP 화면에서 입력 → 이 브라우저에만 저장.
   ========================================================================== */

/* === [V40] RRG → 섹터 로테이션 보드 ===
   ① 히스토리를 '주당 1점'으로 정리한다 (weeklyHist). Database는 주말에 토·일 두 행을 써서
      rsHist의 26개 날짜가 실제로는 13주였고, "5칸 전" 비교는 2주 변화였다.
      같은 이유로 epsHist의 마지막 두 점이 토·일이면 EPS WoW가 0 → REV 브레드스가 '보합'으로 쏠렸다.
      Code.gs V40이 주 1점으로 보내지만, 구버전 GAS여도 여기서 한 번 더 정리한다.
   ② RS 시계열의 마지막 점 = 대시보드 현재 RS. 주중에도 머리가 움직이고,
      표의 RS와 그림의 점이 같은 값이 된다 (V39까지는 점 X=대시보드, 꼬리=Database로 어긋났다).
   ③ 사분면 = RS × 4주 변화 (RS>0 & Δ≥0 주도 / RS>0 & Δ<0 약화 / RS≤0 & Δ≥0 개선 / RS≤0 & Δ<0 소외).
      U/D는 칸을 나누지 않고 숫자로만 보여준다. 커넥터 sector_rotation도 같은 기준.
   ④ 화면: 한 줄 결론 → 보드(13주 흐름·RS 추이·판정) → 보조 RRG. 폭 700px 이하에서는 카드.
   ⑤ 전이는 2주 연속 같은 칸일 때 '확정'으로 본다 (주간 흔들림 필터). */

const CONFIG = {
  LIVE_URL: "",              // === [V41] 비워 둔다. SETUP에서 입력한 값이 localStorage에서 채워진다 (아래 SECRETS)
  WRITE_KEY: "",             // === [V41] 비워 둔다. 일지 저장용 키 — Code.gs의 WRITE_KEY와 같은 값을 SETUP에서 입력
  ATR_N: 2.5,                // 시트 헤더 n
  VIX: 18.77,
  ASOF: "2026-07-19",

  /* === [V33] TradingView 차트 임베드 ===
     자체 캔들 렌더러 대신 TradingView 위젯(무료·브랜딩 표시 조건)을 iframe으로 붙인다.
     ⚠️ 이건 '그림'이라 터미널 룰 엔진이 읽지 못한다 — MA20·DD-10 판정은
        Python이 계산한 숫자로 별도 실측화한다(차트와 규칙은 다른 물건). */
  /* === [V35] 자동 갱신 주기(분) — 0이면 끔 ===
     지금까지 tryLive()는 페이지 로드 시 1회만 돌았다. 화면을 켜둔 채로 있으면
     켠 시점의 데이터를 계속 보게 된다 (뉴스가 안 들어오는 것처럼 보이던 원인). */
  REFRESH_MIN: 5,
  TV_ENABLE: true,
  TV_HEIGHT: "min(58vh, 460px)",
  // 자동 인식이 틀리는 종목만 여기서 거래소를 고정 (예: "NBIS":"NASDAQ:NBIS")
  TV_MAP: { "S&P 500": "SP:SPX", "^GSPC": "SP:SPX" },
};

/* === [V41] 비밀값 분리 ===
   V40까지는 LIVE_URL(시트 전체를 읽는 웹앱 주소)과 WRITE_KEY가 이 파일 안에 있었다.
   공개 저장소(GitHub Pages)에 올리면 누구나 포트폴리오를 읽고 일지를 쓸 수 있게 된다.
   → 파일에는 빈 값만 두고, 첫 실행 때 SETUP 화면에서 받아 '이 기기의 이 브라우저'에만 저장한다.
     다른 기기(PC·폰)는 각각 한 번씩 입력. 명령창에 SETUP(또는 하단 ⚙)으로 언제든 수정·삭제. */
const SECRET_KEYS={url:"tkstock.liveUrl",key:"tkstock.writeKey"};
function secretGet(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
function secretSet(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);return true;}catch(e){return false;}}
CONFIG.LIVE_URL=secretGet(SECRET_KEYS.url);
CONFIG.WRITE_KEY=secretGet(SECRET_KEYS.key);
let LAST_LIVE_ERR="";

/* ---- 단면 데이터 (실측, Main 탭 2026-07-19) -------------------------------
   [tkr, sec, px, rs, ud, tgt, gap%, e26,e27,e28, p26,p27,p28, g27,g28, peg27,peg28] */
let RAW = [
 ["NBIS","Comm Svcs",177.71,-10.17,1.00,244.21,37.42,-2.22,-1.29,-0.70,null,null,null,41.89,45.74,null,null],
 ["GEV","Industrials",1057.84,-6.67,0.92,1221.48,15.47,15.48,24.61,34.81,68.34,42.98,30.39,58.98,41.45,0.73,0.73],
 ["PWR","Industrials",628.53,-21.20,0.51,759.51,20.84,14.00,16.42,19.79,44.90,38.28,31.76,17.29,20.52,2.21,1.55],
 ["LITE","Technology",732.82,-23.65,0.88,1104.89,50.77,13.05,23.02,36.06,56.15,31.83,20.32,76.40,56.65,0.42,0.36],
 ["MRVL","Technology",188.68,8.37,1.61,253.69,34.45,5.98,8.73,8.96,31.55,21.61,21.06,45.99,2.63,0.47,8.01],
 ["PLTR","Technology",132.38,-2.31,1.12,183.12,38.33,1.47,2.09,3.01,90.05,63.34,43.98,42.18,44.02,1.50,1.00],
 ["NVDA","Technology",202.81,-3.56,0.84,302.31,49.06,12.45,15.28,15.51,16.29,13.27,13.08,22.73,1.51,0.58,8.66],
 ["GOOGL","Comm Svcs",346.77,-14.09,0.58,433.51,25.01,14.21,14.66,17.30,24.40,23.65,20.04,3.17,18.01,7.46,1.11],
 ["MSFT","Technology",393.82,-5.92,1.12,558.21,41.74,18.09,21.09,24.52,21.77,18.67,16.06,16.58,16.26,1.13,0.99],
 ["AAOI","Technology",102.41,-43.90,0.64,151.30,47.74,0.89,4.77,null,115.07,21.47,null,435.96,null,0.05,null],
 ["QCOM","Technology",171.78,-11.72,1.18,222.73,29.66,10.85,11.63,14.47,15.83,14.77,11.87,7.19,24.42,2.05,0.49],
 ["AVGO","Technology",370.83,-13.96,0.78,524.51,41.44,12.83,20.29,26.41,28.90,18.28,14.04,58.14,30.16,0.31,0.47],
 ["NVTS","Technology",11.46,-32.55,0.98,14.46,26.20,-0.17,-0.14,-0.11,null,null,null,17.65,21.43,null,null],
 ["ORCL","Technology",126.41,-35.88,0.53,251.85,99.23,9.78,13.66,15.55,12.93,9.25,8.13,39.67,13.84,0.23,0.59],
 ["APP","Comm Svcs",424.54,-10.70,0.84,654.60,54.19,16.01,21.45,27.40,26.52,19.79,15.49,33.98,27.74,0.58,0.56],
 ["RKLB","Industrials",67.62,-21.37,0.94,114.33,69.08,-0.26,-0.04,0.28,null,null,241.50,84.62,800.00,null,0.30],
 ["TEM","Healthcare",52.47,-3.18,1.14,67.06,27.81,-0.35,-0.03,0.63,null,null,83.29,91.43,2200.00,null,0.04],

/* 보유 — [V41] 공개 배포용 가상 데모값 (실제 평균단가·수량 아님).
   LIVE 연결 시 Holdings 탭 실데이터로 통째로 교체된다. */
let HOLD = {
  NVDA:{avg:180.00, qty:10},
  MSFT:{avg:400.00, qty:5},
  GEV:{avg:1000.00, qty:2},
};

/* 섹터 ETF (Main) [tkr, px, rs, ud, name, cyc/def] */
let SECT = [
 ["XLK",175.59,2.14,0.92,"Technology","cyc"],
 ["XLF",56.26,7.65,1.39,"Financials","cyc"],
 ["XLV",161.09,10.02,1.20,"Health Care","def"],

 ["XLB",50.53,-4.48,0.95,"Materials","cyc"],
];

/* 테마 & 공급망 링크 (방안 3) */
const THEMES = {
 "AI Compute":["NVDA","AVGO","MRVL","GOOGL","MSFT","NBIS"],
 "Optical/DCI":["LITE","AAOI","MRVL","AVGO"],

/* ============================ 시드 히스토리 엔진 ============================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedFor(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const std=a=>{const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)));};
const pctRank=(a,v)=>a.filter(x=>x<=v).length/a.length*100;
const fmt=(v,d=2)=>v==null||isNaN(v)?"—":(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

const cls=v=>v>0?"up":v<0?"dn":"muted";

function genDaily(tk,px,rs){
  const r=mulberry32(seedFor(tk+"|dly"));
  const N=130, vol=0.016+r()*0.022, drift=(rs/100)/N*1.4;
  let c=[1]; for(let i=1;i<N;i++){c.push(c[i-1]*(1+drift+(r()*2-1)*vol));}
  const sc=px/c[N-1]; c=c.map(x=>x*sc);
  const hi=c.map(x=>x*(1+(0.25+r()*0.6)*vol)), lo=c.map(x=>x*(1-(0.25+r()*0.6)*vol));
  return {c,hi,lo,vol};
}
function genWeekly(tk,e27,daily){
  const r=mulberry32(seedFor(tk+"|wk")), W=26;
  const dir=r()<0.5?-1:1, mag=0.0004+r()*0.0045;               // 리비전 드리프트
  let eps=[],cur=e27; for(let i=0;i<W;i++){eps.unshift(cur);cur=cur/(1+dir*mag);}
  const wp=[]; for(let i=0;i<W;i++){const idx=daily.c.length-1-(W-1-i)*5; wp.push(daily.c[Math.max(0,idx)]);}
  const per=eps.map((e,i)=> e>0? wp[i]/e : null);
  return {eps,per,wp,dir};
}
function genRS(tk,curRS){
  const r=mulberry32(seedFor(tk+"|rs")), W=13; let s=[];
  let v=curRS+(r()*2-1)*22;
  for(let i=0;i<W-1;i++){s.push(v); v=v*0.72+(r()*2-1)*14;}
  s.push(curRS); return s;                                     // 마지막=현재
}
function atr(d,p=14){const {c,hi,lo}=d,t=[];for(let i=1;i<c.length;i++){t.push(Math.max(hi[i]-lo[i],Math.abs(hi[i]-c[i-1]),Math.abs(lo[i]-c[i-1])));}const s=t.slice(-p);return avg(s);}

/* === [V40] 주 1점 정리 — Code.gs weeklyPick과 같은 규칙 ===
   ISO 주(월~일)마다: 그 주 첫 주말 행(토요일 우선), 주말 행이 없으면 가장 늦은 평일. */
function weekKey(ds){
  const d=new Date(String(ds).slice(0,10)+"T00:00:00Z"); if(isNaN(d))return null;
  const dow=d.getUTCDay(); return new Date(d.getTime()-((dow+6)%7)*864e5).toISOString().slice(0,10);
}
function weeklyHist(obj){
  const out={};
  Object.keys(obj||{}).forEach(tk=>{
    const arr=obj[tk]; if(!Array.isArray(arr))return;
    const wk={};
    arr.slice().sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).forEach(p=>{
      const ds=String(p[0]).slice(0,10), k=weekKey(ds); if(!k)return;
      const dow=new Date(ds+"T00:00:00Z").getUTCDay(), we=(dow===0||dow===6), cur=wk[k];
      if(!cur||(we&&!cur.we)||(!we&&!cur.we)) wk[k]={p:[ds,p[1]],we};
    });
    out[tk]=Object.keys(wk).sort().map(k=>wk[k].p);
  });
  return out;
}

      stage:s[6]!=null&&s[6]!==""?String(s[6]).trim():null, dd:(s[7]!=null&&isFinite(s[7]))?s[7]:null};   // === [V40] [6]스테이지 [7]고점대비
    o._rs=genRS(o.tk+"s",o.rs);o._rsD=null;o.rsReal=false;
    // === [V23] 섹터 ETF RS도 Database 실측으로 (있으면) — [V40] 주 1점 + 머리점
    const rw=rsWeekly(o.tk,o.rs);
    if(rw){o._rs=rw.v;o._rsD=rw.d;o.rsReal=true;o.rsN=rw.v.length;}
    const r=o._rs, n=r.length;
    o.mom=n>=5?r[n-1]-r[n-5]:null;
    o.q=r.map((v,i)=>i>=4?quadOf(v,v-r[i-4]):null);                       // 주별 사분면
    o.quad=o.q[n-1];
    let st=0; for(let i=n-1;i>=4&&o.q[i]===o.quad;i--)st++; o.streak=st;    // 현재 칸 연속 주수
    return o;});
  // === [V40] RS 순위 (지금 · 4주 전)
  const _r4=s=>s._rs.length>=5?s._rs[s._rs.length-5]:null;
  SX.forEach(s=>{s._r0=null;s._r4=null;});
  SX.filter(s=>s.rs!=null).sort((a,b)=>b.rs-a.rs).forEach((s,i)=>s._r0=i+1);
  SX.filter(s=>_r4(s)!=null).sort((a,b)=>_r4(b)-_r4(a)).forEach((s,i)=>s._r4=i+1);

  U.forEach(o=>{
    const n30=newsFor(o.tk,30), n7=newsFor(o.tk,7);
    o.nCnt30=n30.length; o.nCnt7=n7.length;
    o.nSent=n30.length? avg(n30.map(x=>DVAL[x.dir])) : null;
    o.nLastTC=(n30.find(x=>x.tc)||{}).tc||"";
    o.nBearHeld=o.held && n7.some(x=>x.dir==="약세");
  });

  /* 시장 레짐 (방안 6) */
  REG=(()=>{
    const brdRS=SX.filter(s=>s.rs>0).length, brdUD=SX.filter(s=>s.ud>1).length;
    const def=avg(SX.filter(s=>s.grp==="def").map(s=>s.rs)), cyc=avg(SX.filter(s=>s.grp==="cyc").map(s=>s.rs));
    const spread=cyc-def;                                         // >0 risk-on
    const vixPct=pctRank(VIXH,CONFIG.VIX);
    const vixBand=CONFIG.VIX<15?"CALM":CONFIG.VIX<20?"NORMAL":CONFIG.VIX<30?"ELEVATED":"STRESS";
    let score=0; score+=brdRS>=6?1:brdRS>=4?0:-1; score+=spread>2?1:spread<-2?-1:0; score+=CONFIG.VIX<18?1:CONFIG.VIX>24?-1:0;
    const light=score>=2?["RISK-ON","up"]:score<=-1?["RISK-OFF","dn"]:["NEUTRAL","warn"];
    return {brdRS,brdUD,def,cyc,spread,vixPct,vixBand,score,light};
  })();

  /* 포트폴리오 집계 (방안 5) */
  PORT=(()=>{const h=U.filter(o=>o.held);const mv=h.reduce((a,o)=>a+o.mv,0),cost=h.reduce((a,o)=>a+o.cost,0);
    const upl=mv-cost; const secW={}; h.forEach(o=>secW[o.sec]=(secW[o.sec]||0)+o.mv);
    return {h,mv,cost,upl,ret:(mv/cost-1)*100,secW};})();

  /* 신호 백테스트 (방안 10) — 시드 주간 데이터 위, 유니버스 집계 */
  BT=(()=>{
    let a4=[],aZ=[];
    U.forEach(o=>{const rs=o._rs, wp=o._w.wp, per=o._w.per;
      for(let i=1;i<rs.length-4&&i<wp.length-4;i++){                 // RS 0선 상향 돌파 → 4주
        if(rs[i-1]<0&&rs[i]>=0){a4.push((wp[i+4]/wp[i]-1)*100);}
      }
      for(let i=0;i<per.length-4;i++){                               // 자기PER z<-1 → 4주
        const hist=per.slice(0,i+1).filter(x=>x!=null); if(hist.length>5&&per[i]!=null){const z=(per[i]-avg(hist))/(std(hist)||1); if(z<-1)aZ.push((wp[i+4]/wp[i]-1)*100);}
      }
    });
    const sum=a=>a.length?{n:a.length,avg:avg(a),hit:a.filter(x=>x>0).length/a.length*100}:{n:0,avg:0,hit:0};
    return {rsX:sum(a4), zLow:sum(aZ)};
  })();
}

const DONUT_COLORS=["#ffb000","#4fd4ff","#33d17a","#c08cff","#ff5b5b","#ffd23f",
                    "#5ab0ff","#8ce99a","#ff9f6e","#b0b8c4","#e879f9","#2dd4bf"];
function donutSvg(items,size,thick){
  const total=items.reduce((a,it)=>a+it.v,0);
  if(!(total>0))return "";
  const R=(size-thick)/2, C=2*Math.PI*R, cx=size/2, cy=size/2;
  let off=0;
  const segs=items.map(it=>{
    const len=C*(it.v/total);
    const s=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${it.c}"
      stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"
      ><title>${esc(it.k)} ${(it.v/total*100).toFixed(1)}%</title></circle>`;
    off+=len; return s;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#161b22" stroke-width="${thick}"/>
    ${segs}</svg>`;
}

     중요도(H/M/L)로 색을 달리해, 같은 D-데이라도 무게가 구분되게 했다. */
  const now=new Date(CONFIG.ASOF);

  }).join("");
  const near=CATALYSTS.filter(c=>{const dd=Math.round((new Date(c.d)-now)/864e5);

/* === [V40] 섹터 로테이션 보드 (RRG 대체) ===
   읽는 순서: ① 맨 위 한 줄(이번 주 바뀐 것) → ② 노란 줄 섹터의 13주 흐름 → ③ 아래 RRG로 위치 감각.
   숫자는 전부 SX(rebuildAll)에서 온다 — 여기서는 그리기만 한다. */
const SEC_KO={XLK:"기술",XLF:"금융",XLV:"헬스케어",XLY:"경기소비재",XLC:"커뮤니케이션",XLI:"산업재",
              XLP:"필수소비재",XLE:"에너지",XLU:"유틸리티",XLRE:"부동산",XLB:"소재"};
const RRG_COLS=13;     // 보드에 보여줄 주 수
const RRG_TAIL=4;      // 보조 RRG 꼬리 길이(주)
function rrgVerdict(s,withRank){
  const q=s.q||[], n=q.length, cur=s.quad, p1=n>=2?q[n-2]:null, p4=n>=5?q[n-5]:null;
  if(!cur)return "<span class='muted'>데이터 부족 (5주 미만)</span>";
  let t;
  if(cur==="주도")      t=(p4&&p4!=="주도")?`주도 진입 (4주 전 ${p4})`:`주도 ${s.streak}주째`;
  else if(cur==="약화") t=(p1==="주도")?"이번 주 주도에서 꺾임":`강하지만 힘 빠지는 중 ${s.streak}주째`;
  else if(cur==="개선") t=(p1==="소외")?"바닥에서 돌아서는 중 · 관찰 후보":`약하지만 좋아지는 중 ${s.streak}주째`;
  else                  t=(p4==="주도"||p4==="약화")?`4주 사이 주도권 상실 (${p4}→소외)`:`소외 ${s.streak}주째`;
  if(withRank&&s._r4&&s._r0&&Math.abs(s._r4-s._r0)>=3)t+=` · 순위 ${s._r4}→${s._r0}`;
  const tags=[];
  if(Math.abs(s.rs)<1||(s.mom!=null&&Math.abs(s.mom)<1))tags.push("경계선");
  if(s.streak===1&&p1&&p1!==cur)tags.push("2주 확인 전");
  return esc(t)+(tags.length?` <span class="muted">· ${tags.join(" · ")}</span>`:"");
}
function rsSpark(arr,w,h,col){
  if(!arr||arr.length<2)return "";
  const mn=Math.min(0,...arr),mx=Math.max(0,...arr),rg=(mx-mn)||1,p=2;
  const X=i=>p+i/(arr.length-1)*(w-2*p), Y=v=>p+(mx-v)/rg*(h-2*p);
  const pts=arr.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const i4=arr.length-5;
  return `<svg width="${w}" height="${h}" style="display:block">
    <polygon points="${X(0)},${Y(0)} ${pts} ${X(arr.length-1)},${Y(0)}" fill="${col}" fill-opacity="0.13"/>
    <line x1="${p}" x2="${w-p}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#4a4a3a" stroke-dasharray="2 2"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.4"/>
    ${i4>=0?`<circle cx="${X(i4).toFixed(1)}" cy="${Y(arr[i4]).toFixed(1)}" r="1.8" fill="#8a8672"/>`:""}

function vRev(){
  const cov=U.filter(o=>o.wow!=null&&isFinite(o.wow));
  const real=cov.filter(o=>o.epsReal);
  const up=cov.filter(o=>o.wow>REV_EPS_TH), dn=cov.filter(o=>o.wow<-REV_EPS_TH);
  const flat=cov.length-up.length-dn.length;
  const net=cov.length?((up.length-dn.length)/cov.length*100):0;
  const diff=cov.length?(up.length/cov.length*100):0;

  const c4=cov.filter(o=>o.rev4!=null&&isFinite(o.rev4));
  const up4=c4.filter(o=>o.rev4>REV_EPS_TH).length, dn4=c4.filter(o=>o.rev4<-REV_EPS_TH).length;
  const net4=c4.length?((up4-dn4)/c4.length*100):0;

  // 확산지수 게이지 (0~100%, 50이 중립)
  const gauge=`<div style="position:relative;height:14px;background:#161b22;border:1px solid var(--bd);margin:6px 0">
     <div style="position:absolute;left:0;top:0;bottom:0;width:${diff.toFixed(1)}%;background:${diff>=50?'var(--up)':'var(--dn)'};opacity:.55"></div>
     <div style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--fg)"></div>
     <div style="position:absolute;left:4px;top:-1px;font-size:10px" class="b">${diff.toFixed(0)}%</div></div>`;

  // === [V30] 성숙도 판정: 실측 스냅샷이 몇 주치 쌓였는가 ===
  const snapN=real.length?Math.max(...real.map(o=>o.epsN||0)):0;
  const matBadge = real.length===0
    ? `<span class="tag dn">SIM · 실측 0주</span>`
    : (snapN>=REV_MATURE_N
        ? `<span class="tag up">실측 ${snapN}주</span>`
        : `<span class="tag warn">IMMATURE · 실측 ${snapN}/${REV_MATURE_N}주</span>`);

  // === [V30] 섹터별 평균 리비전 — 표본 N이 얇은 섹터는 값을 감추고 N/A ===
  const bySec={};
  cov.forEach(o=>{(bySec[o.sec]=bySec[o.sec]||[]).push(o.wow);});
  const secAll=Object.entries(bySec).map(([s,a])=>[s,avg(a),a.length]);
  const secOK=secAll.filter(r=>r[2]>=REV_SEC_MIN_N).sort((a,b)=>b[1]-a[1]);
  const secNA=secAll.filter(r=>r[2]<REV_SEC_MIN_N).sort((a,b)=>b[2]-a[2]);
  const secRows=
    secOK.map(([s,m,n])=>
      `<tr class="row"><td style="text-align:left">${esc(s)}</td><td class="${cls(m)} b">${pct(m,2)}</td><td class="b">${n}</td><td>${barSpan(m,3,m>=0?'#33d17a':'#ff5b5b')}</td></tr>`).join("")
   +secNA.map(([s,m,n])=>
      `<tr class="row"><td style="text-align:left" class="muted">${esc(s)}</td><td class="muted">N/A</td><td class="muted">${n}</td><td class="muted mono-sm">표본 &lt;${REV_SEC_MIN_N}</td></tr>`).join("");

  // 종목별 리비전 (실측 우선 정렬)
  const rows=cov.slice().sort((a,b)=>(b.rev4??b.wow??-999)-(a.rev4??a.wow??-999)).map(o=>{
    const tc=o.nLastTC;
    const r4=o.rev4!=null&&isFinite(o.rev4)?`<span class="${cls(o.rev4)} b">${pct(o.rev4)}</span>`:"<span class='muted'>—</span>";
    const src=o.epsReal?`<span class="tag" style="color:var(--up)">실 ${o.epsN}주</span>`:"<span class='tag muted'>SIM</span>";
    return `<tr class="row">${symTd(o.tk)}<td>${o.stage?stageChip(o.stage):"<span class='muted'>—</span>"}</td><td>${fmt(o.e27)}</td><td class="${cls(o.wow)}">${pct(o.wow,2)}</td><td>${r4}</td><td>${spark(o.epsSeries,110,24,(o.rev4??o.wow)>=0?'#33d17a':'#ff5b5b')}</td><td>${src}</td><td class="${tc.includes('-')?'dn':tc?'up':''}">${esc(tc)||"—"}</td></tr>`;
  }).join("");

  const kpi=(l,v,c)=>`<div><span class="muted">${l}</span> <span class="${c} kpi" style="font-size:18px">${v}</span></div>`;
  return vHeader("REV")+
   `<div class="grid g3">
     <div class="panel">${ph("REVISION BREADTH · WoW","상향 종목 비중(확산지수) · 50%가 중립")}<div class="pb">
        ${kpi("순브레드스",(net>=0?"+":"")+net.toFixed(0)+"%",net>=0?"up":"dn")}
        ${gauge}
        <div><span class="up b">▲ ${up.length}</span> · <span class="muted">보합 ${flat}</span> · <span class="dn b">▼ ${dn.length}</span> <span class="muted">/ ${cov.length}종목</span></div>
     </div></div>
     <div class="panel">${ph("REVISION BREADTH · 4주",matBadge)}<div class="pb">
        ${kpi("순브레드스",(net4>=0?"+":"")+net4.toFixed(0)+"%",net4>=0?"up":"dn")}
        <div class="sep"></div>
        <div><span class="up b">▲ ${up4}</span> · <span class="dn b">▼ ${dn4}</span> <span class="muted">/ ${c4.length}종목</span></div>
        <div class="muted mono-sm">4주 히스토리 보유 종목만 집계</div>
     </div></div>
     <div class="panel">${ph("데이터 커버리지","실측 vs 시드")}<div class="pb">
        <div>실측(Database) <span class="up b">${real.length}</span> / 시드 <span class="muted b">${cov.length-real.length}</span></div>
        <div class="sep"></div>
        <div class="muted mono-sm">${real.length?`Database 주간 스냅샷에서 선행 EPS 시계열을 읽어 계산. 스냅샷이 쌓일수록 4주 지표 커버리지가 넓어집니다.`:`아직 실측 히스토리 없음 — Database에 주간 스냅샷이 2회 이상 쌓이면 자동 전환됩니다.`}</div>
     </div></div>
   </div>
   ${vSectorEps()}
   <div class="grid g2">
     <div class="panel">${ph("SECTOR BREADTH",matBadge)}<div class="pb"><table>
       <tr><th style="text-align:left">섹터</th><th>평균 WoW</th><th>N</th><th></th></tr>${secRows||"<tr><td class='muted'>데이터 없음</td></tr>"}</table>
       <div class="muted mono-sm" style="margin-top:6px">※ 섹터 평균 WoW 리비전. <b>N &lt; ${REV_SEC_MIN_N}인 섹터는 N/A</b> — 종목 1~2개의 EPS 변화는 섹터 신호가 아니라 개별 노이즈입니다.${snapN>=REV_MATURE_N?"":` 스냅샷 ${snapN}/${REV_MATURE_N}주 — 4주 리비전이 성립하기 전이라 방향만 참고하세요.`}</div></div></div>
     <div class="panel">${ph("해석 가이드")}<div class="pb">
       <div class="mono-sm">확산지수 <span class="b">&gt;60%</span> — 광범위한 상향, 리스크온 구간</div>
       <div class="mono-sm">확산지수 <span class="b">40~60%</span> — 혼조, 종목선택 장세</div>
       <div class="mono-sm">확산지수 <span class="b">&lt;40%</span> — 광범위한 하향, 실적 사이클 둔화 신호</div>
       <div class="sep"></div>
       <div class="muted mono-sm">※ 지수 레벨보다 <b>방향의 폭</b>이 사이클 전환을 먼저 알려줍니다. 개별 종목 하향은 노이즈일 수 있으나 브레드스 붕괴는 사이클 신호입니다.</div>
     </div></div>
   </div>
   <div class="panel">${ph("ESTIMATE REVISION MOMENTUM","선행 EPS · 주간(WoW) · 4주 변화")}<div class="pb"><table>
     <tr><th>티커</th><th>스테이지</th><th>선행 EPS</th><th>WoW</th><th>4주</th><th>추이</th><th>출처</th><th>목표가Δ(뉴스)</th></tr>${rows}</table></div></div>`;
}

/* === [V23] 테제 카드 + 매매일지·아이디어 (Journal 탭 연동) === */
const KIND_COL={"테제":"amber","매매일지":"cyan","아이디어":"violet"};
const ST_COL={"활성":"up","관찰":"warn","검증됨":"cyan","폐기":"muted"};
let TH_FILTER="";
const _idSafe=id=>String(id).replace(/[^A-Za-z0-9_-]/g,"");

/* === [V31] 저장 결과를 '추정'하지 않는다 ===
   기존 코드는 응답 파싱에 실패하면 {ok:true}를 돌려줬다. 배포가 낡아 doPost가 없거나
   Apps Script가 HTML 에러 페이지를 반환해도 화면엔 "✓ 저장됨"이 떴다는 뜻이다.
   저장 여부는 시트를 다시 읽어 확인하고(thesisAdd), 여기서는 사실만 돌려준다. */
async function jPost(payload){
  /* === [V37] no-cors 전송 ===
     file:// 에서는 POST 응답도 읽을 수 없다 (tryLive와 같은 이유).
     mode:"no-cors"는 응답을 opaque로 만들지만 전송 자체는 이뤄지므로,
     성공 여부는 응답이 아니라 '시트를 다시 읽어 실제로 있는지'로 판정한다.
     V31이 이미 그렇게 설계돼 있어서(thesisAdd의 엔드투엔드 확인) 여기만
     바꾸면 나머지는 그대로 맞물린다. res.id는 못 받게 되므로 판정은
     제목·내용 매칭으로 바뀐다 (thesisAdd 쪽 수정 참조). */
  payload.key=CONFIG.WRITE_KEY;
  try{
    await fetch(CONFIG.LIVE_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)});
    return {sent:true};
  }catch(e){
    return {sent:false,error:"전송 실패 — "+e.message};
  }
}
/* === [V42] 저장 확인 — Journal 탭만 가볍게, 짧은 간격으로 여러 번 ===
   V41까지는 저장 뒤 '전체' 데이터(텔레그램 인덱스·Database 포함)를 다시 받아 확인했다.
   저장 직후엔 시트 재계산과 겹쳐 25초 한도를 넘기는 일이 있었고, 그러면 터미널 전체가 SIM으로
   떨어지고 버튼이 '저장 중…'에서 멈췄다 (2026-09-29 MSFT·AMZN 편출 — 실제 기록은 돼 있었음).
   → ?mode=journal (Code.gs V42)로 Journal 탭만 읽는다. 구버전 GAS면 전체 페이로드가 오지만
     거기에도 journal 필드가 있으니 똑같이 동작한다(느릴 뿐). 확인 실패가 LIVE 상태를 건드리지 않는다. */
async function refreshJournal(timeoutMs){
  const u=CONFIG.LIVE_URL+(CONFIG.LIVE_URL.indexOf("?")>=0?"&":"?")+"mode=journal";
  const j=await jsonpGet(u,timeoutMs||30000);
  if(!j||!Array.isArray(j.journal))throw new Error((j&&j.error)||"journal 응답 없음");
  JOURNAL=j.journal;
  if(j.gasVer)LIVE_GAS={ver:j.gasVer,hasPost:!!j.hasPost};
  return JOURNAL;
}
async function confirmJournal(pred,onTry){
  const waits=[1000,3000,6000];
  let err="";
  for(let i=0;i<waits.length;i++){
    await new Promise(r=>setTimeout(r,waits[i]));
    if(onTry)onTry(i+1,waits.length);
    try{await refreshJournal(30000); if(pred())return {ok:true};}
    catch(e){err=(e&&e.message)||String(e);}
  }
  return {ok:false,err};
}
function thMsg(html){const m=el("thMsg");if(m)m.innerHTML=html;}
async function thesisAdd(){
  if(SAVING)return;                                   // === [V42] 연타로 두 번 저장되는 것 방지
  if(!LIVE_ON){flashHint("LIVE 연결 필요 — SETUP에서 URL 입력 후 사용 가능");return;}
  if(!CONFIG.WRITE_KEY){flashHint("일지 저장 키가 없음 — SETUP에서 입력");openSetup();return;}
  const kind=el("thKind").value, tk=el("thTk").value.trim().toUpperCase();
  const title=el("thTitle").value.trim(), text=el("thText").value.trim(), fal=el("thFal").value.trim();
  if(!title&&!text){flashHint("제목 또는 내용을 입력하세요");return;}
  thDraftSave();                                      // 확인 전까지 이 기기에 보관
  const before=new Set(JOURNAL.map(x=>String(x.id)));
  const t200=title.slice(0,200).trim(), x4000=text.slice(0,20000).trim();   // Code.gs V42 한도와 동일
  const setBtn=(busy)=>{const b=el("thSave");if(!b)return;b.textContent=busy?"저장 중…":"💾 저장";
    b.style.pointerEvents=busy?"none":"";b.style.opacity=busy?".5":"";};
  SAVING=true; setBtn(true); thMsg("<span class='muted'>전송 중…</span>");
  const finish=(html)=>{SAVING=false; setBtn(false); thMsg(html);};
  try{
    const res=await jPost({action:"add",kind,tk,title,text,falsify:fal});
    if(!res.sent){finish(`<span class='dn'>전송 실패 — ${esc(res.error||"네트워크 오류")}. 글은 그대로 있으니 다시 눌러도 됩니다.</span>`);return;}
    const c=await confirmJournal(
      ()=>JOURNAL.some(x=>!before.has(String(x.id))&&((t200&&x.title===t200)||(x4000&&x.text===x4000))),
      (n,m)=>thMsg(`<span class='muted'>전송됨 — 시트 기록 확인 중 (${n}/${m})…</span>`));
    if(c.ok){
      SAVING=false;
      TH_FIELDS.forEach(k=>{const e=el(k); if(e&&k!=="thKind")e.value="";});   // 확인됐으니 폼을 비운다
      thDraftClear(); render();                       // (render가 빈 폼을 보관 → 초안도 비워진 상태 유지)
      thMsg("<span class='up'>✓ 저장됨 — Journal 탭 기록을 확인했습니다</span>");
      flashHint("✓ 저장됨");
    }else{
      finish(`<span class='warn'>전송은 됐지만 기록 확인이 안 됐습니다. <b>다시 누르지 말고</b> 잠시 뒤 R(새로고침)로 목록을 확인하세요 — 다시 누르면 같은 글이 두 번 저장될 수 있습니다.`
        +` 계속 안 보이면 SETUP의 일지 저장 키가 Code.gs의 WRITE_KEY와 같은지 확인하세요.</span>`
        +(c.err?` <span class='muted'>(${esc(c.err)})</span>`:""));
    }
  }catch(err){finish(`<span class='dn'>저장 실패: ${esc(err.message)}</span>`);}
}
async function thesisStatus(id,status){
  if(SAVING)return;
  if(!LIVE_ON){flashHint("LIVE 연결 필요");return;}
  SAVING=true;
  try{
    const res=await jPost({action:"setstatus",id,status});
    if(!res.sent){flashHint("실패: "+res.error);return;}
    flashHint("상태 변경 전송 — 확인 중…");
    const c=await confirmJournal(()=>{const row=JOURNAL.find(x=>String(x.id)===String(id));return !!row&&row.status===status;});
    SAVING=false;
    if(c.ok){render();flashHint("✓ 상태 → "+status);}
    else flashHint("상태 변경 확인이 늦어짐 — 잠시 뒤 R로 확인하세요");
  }catch(err){flashHint("실패: "+err.message);}
  finally{SAVING=false;}
}

/* === [V42] 작성 중인 일지 보존 ===
   재렌더(자동 갱신·화면 이동·저장 확인)나 새로고침으로 긴 글이 날아가지 않게, 저장이 '확인'될
   때까지 이 브라우저에 임시 보관한다. */
const TH_FIELDS=["thKind","thTk","thTitle","thText","thFal"], TH_DRAFT_KEY="tkstock.thDraft";
function thDraftSave(){
  if(!el("thTitle"))return;
  const d={}; let any=false;
  TH_FIELDS.forEach(k=>{const e=el(k); if(e){d[k]=e.value; if(k!=="thKind"&&e.value.trim())any=true;}});
  try{if(any)localStorage.setItem(TH_DRAFT_KEY,JSON.stringify(d)); else localStorage.removeItem(TH_DRAFT_KEY);}catch(e){}
}
function thDraftClear(){try{localStorage.removeItem(TH_DRAFT_KEY);}catch(e){}}
function thDraftRestore(){
  let d=null; try{d=JSON.parse(localStorage.getItem(TH_DRAFT_KEY)||"null");}catch(e){}
  if(!d)return;
  TH_FIELDS.forEach(k=>{const e=el(k); if(e&&d[k]!=null)e.value=d[k];});
  thMsg("<span class='muted'>작성 중이던 글을 불러왔습니다 (저장이 확인되면 비워집니다)</span>");
}
document.addEventListener("input",e=>{if(e.target&&TH_FIELDS.includes(e.target.id))thDraftSave();});
document.addEventListener("change",e=>{if(e.target&&e.target.id==="thKind")thDraftSave();});

/* === [V22] Weinstein 스테이지 뷰 === */
const STAGE_META={1:["바닥·축적","cyan","기저 형성. 돌파 대기 — 관찰 리스트"],
                  2:["상승·마크업","up","추세 진행. 신규/추가 매수 국면"],
                  3:["천정·분산","warn","모멘텀 소진. 신규 매수 자제·비중 축소 검토"],
                  4:["하락·마크다운","dn","추세 하락. 보유 시 규칙 점검 필요"]};
function stageChip(label){
  const n=parseInt(label,10);
  if(!n||!STAGE_META[n])return `<span class="muted">${esc(label||"—")}</span>`;
  return `<span class="${STAGE_META[n][1]} b">${esc(label)}</span>`;
}

function vStage(){
  const cov=U.filter(o=>o.stageNum);
  const none=U.filter(o=>!o.stageNum).map(o=>o.tk);
  const cnt={1:0,2:0,3:0,4:0}; cov.forEach(o=>cnt[o.stageNum]++);
  const tot=cov.length||1;
  const bull=((cnt[1]+cnt[2])/tot*100);

  const dist=[1,2,3,4].map(n=>{
    const w=(cnt[n]/tot*100);
    return `<div style="margin-bottom:5px"><span class="${STAGE_META[n][1]} b">${n} ${STAGE_META[n][0]}</span>
      <span class="muted">${cnt[n]}종목 (${w.toFixed(0)}%)</span>
      <div style="height:8px;background:#161b22;border:1px solid var(--bd);margin-top:2px">
        <div style="height:100%;width:${w.toFixed(1)}%;background:var(--${STAGE_META[n][1]});opacity:.6"></div></div></div>`;
  }).join("");

  // 보유 중 Stage 3/4 = 최우선 경고
  const warn=cov.filter(o=>o.held&&o.stageNum>=3)
    .sort((a,b)=>b.stageNum-a.stageNum)
    .map(o=>`<div><span class="${o.stageNum===4?'dn':'warn'} b">${esc(o.stage)}</span> ${symLink(o.tk)}
       <span class="muted">손익 </span><span class="${cls(o.pnl)}">${pct(o.pnl)}</span>
       <span class="muted">· RS </span><span class="${cls(o.rs)}">${fmt(o.rs)}</span></div>`).join("");

  const rows=cov.slice().sort((a,b)=>a.stageNum-b.stageNum||b.rs-a.rs).map(o=>
    `<tr class="row">${symTd(o.tk)}<td>${o.held?"<span class='cyan'>●</span>":""}</td><td>${stageChip(o.stage)}</td>
     <td style="text-align:left" class="muted">${esc(o.sec)}</td>
     <td class="${cls(o.rs)}">${fmt(o.rs)}</td><td class="${o.ud>1?'up':'muted'}">${fmt(o.ud)}</td>
     <td class="${cls(o.ddFromHi)}">${pct(o.ddFromHi)}</td>
     <td class="muted mono-sm" style="text-align:left">${esc(STAGE_META[o.stageNum][2])}</td></tr>`).join("");

  return vHeader("STAGE")+
   `<div class="grid g3">
     <div class="panel">${ph("STAGE 분포","Weinstein 4단계 · 주봉 30주선 기준")}<div class="pb">${dist}
        <div class="sep"></div><div><span class="muted">강세(1+2) 비중</span> <span class="${bull>=50?'up':'dn'} kpi" style="font-size:18px">${bull.toFixed(0)}%</span></div></div></div>
     <div class="panel">${ph("보유 · 주의 필요","Stage 3/4 보유 포지션")}<div class="pb">${warn||"<span class='up'>보유 종목 모두 Stage 1/2 — 이상 없음</span>"}</div></div>
     <div class="panel">${ph("판정 기준")}<div class="pb">
       <div class="mono-sm"><span class="cyan b">1 바닥</span> 하락 후 30주선 평탄 + 가격 횡보</div>
       <div class="mono-sm"><span class="up b">2 상승</span> 가격이 <b>상승하는</b> 30주선 위</div>
       <div class="mono-sm"><span class="warn b">3 천정</span> 상승 후 30주선 평탄 + 모멘텀 소진</div>
       <div class="mono-sm"><span class="dn b">4 하락</span> 가격이 <b>하락하는</b> 30주선 아래</div>
       <div class="sep"></div>
       <div class="muted mono-sm">2년 주봉 실측. 상장 35주 미만은 판정 불가(—).${none.length?` 미판정: ${none.map(esc).join(", ")}`:""}</div>
     </div></div>
   </div>
   <div class="panel">${ph("STAGE LADDER","단계 → RS 순")}<div class="pb"><table>
     <tr><th>티커</th><th>보유</th><th>스테이지</th><th style="text-align:left">섹터</th><th>RS</th><th>U/D</th><th>고점대비</th><th style="text-align:left">대응</th></tr>${rows||"<tr><td class='muted'>스테이지 데이터 없음 — Dashboard '스테이지' 열이 채워지면 표시됩니다</td></tr>"}</table></div></div>`;
}

function vVal(){
  const rows=U.filter(o=>o.pz!=null).slice().sort((a,b)=>a.pz-b.pz).map(o=>{
    const z=o.pz, sig=z<-1?"저평가":z>1?"고평가":"중립", col=z<-1?"up":z>1?"dn":"muted";
    return `<tr class="row">${symTd(o.tk)}<td>${fmt(o.p27)}</td><td class="${col} b">${fmt(z,2)}σ</td><td>${o.ppct.toFixed(0)}%ile</td><td>${barSpan(z,3,z<0?'#33d17a':'#ff5b5b')}</td><td class="${col}">${sig}</td><td>${fmt(o.peg27)}</td><td>${spark(o._w.per.filter(x=>x!=null),110,24,'#c08cff')}</td></tr>`;
  }).join("");
  const noHist=U.filter(o=>o.pz==null).map(o=>o.tk);
  return vHeader("VAL")+
   `<div class="panel">${ph("VALUATION Z-SCORE","현재 27년 PER vs 자기 26주 히스토리 (z / 백분위)")}<div class="pb"><table>
     <tr><th>티커</th><th>27E PER</th><th>Z-스코어</th><th>백분위</th><th></th><th>신호</th><th>PEG27</th><th>PER 추이</th></tr>${rows}</table>
     <div class="muted mono-sm" style="margin-top:6px">적자/PER 부재로 제외: ${noHist.map(esc).join(", ")||"없음"}. ※ 절대 PER이 아니라 자기 역사 대비 위치 — 평균회귀 셋업 포착. KOSPI PER/PBR 밴드 방법론 이식.</div></div></div>`;
}

function vSig(){

  const card=(t,o,note)=>`<div class="panel">${ph(t)}<div class="pb"><div class="kpi ${o.avg>=0?'up':'dn'}">${pct(o.avg)}</div><div>적중률 <span class="${o.hit>=50?'up':'dn'} b">${o.hit.toFixed(0)}%</span> · 표본 ${o.n}</div><div class="muted mono-sm">${note}</div></div></div>`;
  const calls=NEWS.filter(n=>n.typ==="목표가변경").map(n=>`<tr class="row"><td>${n.d.slice(5)}</td><td style="text-align:left">${esc(n.src)}</td><td style="text-align:left">${n.tk.map(t=>BY[t]?symLink(t):esc(t)).join(",")}</td><td class="${n.tc.includes('-')?'dn':'up'}">${esc(n.tc)}</td><td class="muted">${BY[n.tk[0]]?"결과 대기":"유니버스 외"}</td><td>${n.sim?"<span class='tag muted'>SIM</span>":"<span class='tag' style='color:var(--up)'>실</span>"}</td></tr>`).join("");
  return vHeader("SIG")+
   `<div class="grid g2">
     ${card("신호 A · RS 0선 상향돌파 → 4주","undefined"===typeof s?{}:s.rsX,"유니버스 전체·시드 주간. 모멘텀 진입 신호의 순방향 기대수익")}
     ${card("신호 B · 자기PER z<-1 → 4주",s.zLow,"밸류 되돌림 진입. 평균회귀 신호의 4주 성과")}
   </div>
   <div class="panel">${ph("ANALYST CALL LEDGER","목표가 변경 콜 → 실현 검증 (출처별 적중률)")}<div class="pb"><table>
     <tr><th>일자</th><th style="text-align:left">출처</th><th style="text-align:left">티커</th><th>목표가Δ</th><th>결과</th><th>구분</th></tr>${calls||"<tr><td class='muted'>목표가 변경 콜 없음</td></tr>"}</table>
     <div class="muted mono-sm" style="margin-top:6px">※ 실측 목표가콜은 유니버스 외(HK/KR)라 결과 미산출. LIVE 시 목표가변동 + Database 사후가격으로 출처별 hit-rate 집계. 백테스트 표본 작음 — 방향성 참고용, 커브피팅 경계.</div></div></div>`;
}

function vSec(tk){
  const o=BY[tk]; if(!o)return vHeader("MENU")+`<div class="banner">알 수 없는 코드: ${esc(tk)}. HELP 입력 또는 하단 함수키.</div>`+vMenu();
  const news=newsFor(tk,60);
  const flags=[o.fStop?"<span class='dn tag'>STOP</span>":"",o.fMA?"<span class='warn tag'>&lt;MA20</span>":"",o.fDD?"<span class='dn tag'>DD-10</span>":""].filter(Boolean).join(" ")||"<span class='up'>정상</span>";
  const kv=(k,v)=>`<tr><td class="muted" style="text-align:left">${k}</td><td class="b">${v}</td></tr>`;
  return `<div class="viewhdr"><span class="code">${tk}</span><span class="ttl">${esc(o.sec)}</span><span class="sub">${usd(o.px)} · 목표 ${usd(o.tgt)} (괴리 ${pct(o.gap)})${o.stage?" · "+stageChip(o.stage):""}</span></div>
   ${tvPanel(tk)}
   <div class="grid g3">
     <div class="panel">${ph("QUOTE / MOMENTUM")}<div class="pb"><table>
        ${kv("현재가",usd(o.px))}${kv("RS(상대강도)",`<span class="${cls(o.rs)}">${fmt(o.rs)}</span>`)}${kv("RS 4주 모멘텀",`<span class="${cls(o.rsMom)}">${fmt(o.rsMom)}</span>`)}${kv("U/D Ratio",`<span class="${o.ud>1?'up':'muted'}">${fmt(o.ud)}</span>`)}${kv("목표가 괴리",`<span class="up">${pct(o.gap)}</span>`)}
     </table><div style="margin-top:4px">${spark(o._d.c,240,34,'#4fd4ff')}</div></div></div>
     <div class="panel">${ph("VALUATION")}<div class="pb"><table>
        ${kv("27E PER",fmt(o.p27))}${kv("28E PER",fmt(o.p28))}${kv("PER Z-스코어",o.pz!=null?`<span class="${o.pz<-1?'up':o.pz>1?'dn':'muted'}">${fmt(o.pz,2)}σ (${o.ppct.toFixed(0)}%ile)</span>`:"—")}${kv("PEG 27/28",`${fmt(o.peg27)} / ${fmt(o.peg28)}`)}${kv("성장률 27/28",`${pct(o.g27)} / ${pct(o.g28)}`)}
     </table></div></div>
     <div class="panel">${ph("RISK / RULES")}<div class="pb"><table>
        ${kv("ATR손절가",usd(o.stop))}${kv("손절까지",`<span class="${o.px<o.stop?'dn':'muted'}">${pct((o.px/o.stop-1)*100)}</span>`)}${kv("MA20",`${usd(o.ma20)} <span class="${cls(o.px-o.ma20)}">${o.px<o.ma20?'하회':'상회'}</span>`)}${kv("고점(60d)대비",`<span class="${cls(o.ddFromHi)}">${pct(o.ddFromHi)}</span>`)}${kv("규칙상태",flags)}
     </table></div></div>
   </div>
   <div class="grid g3">
     <div class="panel">${ph("EST REVISION")}<div class="pb"><table>${kv("선행 EPS",fmt(o.e27))}${kv("WoW",`<span class="${cls(o.wow)}">${pct(o.wow,2)}</span>`)}${kv("4주",o.rev4!=null&&isFinite(o.rev4)?`<span class="${cls(o.rev4)}">${pct(o.rev4)}</span>`:"<span class='muted'>—</span>")}${kv("출처",o.epsReal?`<span class="up">실측 ${o.epsN}주</span>`:"<span class='muted'>시드</span>")}</table><div style="margin-top:4px">${spark(o.epsSeries,200,28,(o.rev4??o.wow)>=0?'#33d17a':'#ff5b5b')}</div></div></div>
     <div class="panel">${ph("POSITION")}<div class="pb">${o.held?`<table>${kv("수량",o.qty)}${kv("평단",usd(o.avg))}${kv("손익%",`<span class="${cls(o.pnl)} b">${pct(o.pnl)}</span>`)}${kv("미실현$",usd(o.upl,0))}${kv("비중",(o.mv/PORT.mv*100).toFixed(1)+"%")}</table>`:"<span class='muted'>미보유</span>"}</div></div>
     <div class="panel">${ph("NEWS SIDECAR")}<div class="pb"><div>심리 ${o.nSent==null?"<span class='muted'>—</span>":`<span class="${o.nSent>0?'up':o.nSent<0?'dn':'muted'} b">${fmt(o.nSent,2)}</span>`} · 30D ${o.nCnt30} · 목표가Δ ${esc(o.nLastTC)||"—"}</div><div class="sep"></div>${news.length?news.map(n=>`<div class="mono-sm"><span class="muted">${n.d.slice(5)}</span> <span class="${n.dir==='강세'?'up':n.dir==='약세'?'dn':'muted'}">${n.dir}</span> ${esc(n.th).slice(0,52)} ${n.sim?"<span class='tag muted'>SIM</span>":""}</div>`).join(""):"<span class='muted'>커버리지 없음</span>"}</div></div>
   </div>
   ${(()=>{
     /* === [V32] 종목 상세: '테제'만이 아니라 이 종목의 Journal 기록 전체를 보여준다 ===
        기존에는 kind==="테제"인 것만 걸렀다. 그런데 저장 폼의 기본 선택값이 '매매일지'라,
        구분을 바꾸지 않고 저장한 기록은 종목 화면에 아예 뜨지 않았다.
        게다가 0건이면 패널 자체를 렌더하지 않아 '기록이 없는 것'과 '화면이 고장난 것'을
        구분할 수 없었다 → 항상 패널을 띄우고, 없으면 없다고 말한다. */
     const mine=JOURNAL.filter(j=>j.tk===tk&&j.status!=="폐기");
     const rank={"테제":0,"매매일지":1,"아이디어":2};
     mine.sort((a,b)=>((rank[a.kind]??9)-(rank[b.kind]??9))||String(b.d||"").localeCompare(String(a.d||"")));
     const nTh=mine.filter(j=>j.kind==="테제").length;
     const head=ph("THESIS · JOURNAL — 이 종목",
       mine.length?`테제 ${nTh} · 전체 ${mine.length}건 · 상태 관리는 12 THESIS`:"기록 없음");
     if(!mine.length)return `<div class="panel">${head}<div class="pb">
        <div class="muted mono-sm">${esc(tk)} 관련 기록이 없습니다. <span class="k" onclick="go('12')">12 THESIS</span> 에서 남기면 여기에 표시됩니다. (구분을 '테제'로 저장하면 테제로 집계됩니다)</div>
       </div></div>`;
     return `<div class="panel">${head}<div class="pb">`+
       mine.map(j=>`<div style="margin-bottom:6px">
         <span class="${KIND_COL[j.kind]||'muted'} b">${esc(j.kind)}</span>
         <span class="${ST_COL[j.status]||'muted'} b">[${esc(j.status)}]</span>
         <span class="b">${esc(j.title||"(무제)")}</span>
         <span class="muted mono-sm">${esc((j.d||"").slice(0,10))}</span>
         ${j.text?`<div class="mono-sm">${esc(j.text)}</div>`:""}
         ${j.falsify?`<div class="mono-sm"><span class="dn b">반증:</span> ${esc(j.falsify)}</div>`:""}</div>`).join("")+`</div></div>`;})()}`;
}

/* === [V42] 실패 후 빠른 재시도 (20초 → 1분 → 2분, 이후엔 5분 주기) === */
let RETRY_T=null, RETRY_N=0;
function scheduleRetry(){
  if(RETRY_T)return null;
  const waits=[20000,60000,120000];
  const w=waits[Math.min(RETRY_N,waits.length-1)]; RETRY_N++;
  RETRY_T=setTimeout(()=>{RETRY_T=null; autoSync();},w);
  return w;
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible"||!CONFIG.LIVE_URL)return;

});
function autoSync(){
  if(!CONFIG.LIVE_URL||!CONFIG.REFRESH_MIN)return;
  if(MODAL)return;
  if(SAVING)return;                                   // === [V42] 저장 확인 중에는 무거운 갱신을 겹치지 않음
  if(document.visibilityState==="hidden")return;      // === [V42] 안 보는 동안엔 요청 안 함 → 돌아오면 바로 갱신
  /* === [V42] 명령창(CMD)은 화면을 열면 커서가 기본으로 들어가는 곳이라, 거기 커서가 있으면
     '입력 중'으로 보고 건너뛰던 규칙 때문에 자동 갱신이 사실상 멈춰 있었다. 한 번 SIM으로
     떨어지면 다시 시도하지 않아 켜둔 화면이 계속 SIM으로 남던 원인. → 명령창은 글자가 있을
     때만 건너뛰고, 일지·필터 같은 다른 입력칸에 커서가 있을 때는 계속 건너뛴다. */
  const a=document.activeElement;
  if(a&&a.id==="cmd"){if(a.value.trim())return;}
  else if(isTypingTarget(a))return;

function isTypingTarget(t){

/* LIVE 데이터: GAS doGet(Code.gs)이 Dashboard·Holdings 탭을 JSON으로 반환하면
   RAW/HOLD/SECT/CONFIG를 교체하고 rebuildAll()로 전체 재조립 후 재렌더링.
   NEWS/CATALYSTS(정성 데이터)는 별도 연동 전까지 데모(SIM) 유지.

   === [V37] fetch → JSONP 전환 ===
   증상: 브라우저 주소창으로 /exec 을 열면 JSON이 정상으로 보이는데,
         이 파일(file://)의 fetch()는 항상 실패해 SIM 폴백이 떴다.
   원인: file:// 페이지의 fetch는 Origin이 null이다. Apps Script는
         /exec → script.googleusercontent.com 으로 302 리디렉션하는데,
         이 조합에서 브라우저가 응답 읽기를 차단한다. 배포를 몇 번
         다시 해도 해결되지 않는 이유다 — 배포 문제가 아니었다.
   해법: <script> 태그 로드는 CORS 검사를 받지 않는다. doGet이
         ?callback=이름 을 받으면 JSON을 이름(...)으로 감싸 JS로 돌려주고
         (Code.gs V34), 여기서는 fetch 대신 script 태그로 불러온다.
         file:// 에서도, https 호스팅에서도 동일하게 동작한다.
   쓰기(doPost)는 fetch mode:"no-cors"로 전송한다 — 응답은 못 읽지만
   기록은 되므로, 저장 후 JSONP로 Journal을 다시 읽어 실재 여부로 판정한다
   (V31의 엔드투엔드 확인 원칙 그대로). */

function jsonpGet(url,timeoutMs){
  return new Promise((resolve,reject)=>{
    const cb="__tk_jsonp_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    const sc=document.createElement("script");
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error(`응답 시간 초과(${Math.round((timeoutMs||25000)/1000)}초) — 서버(Apps Script) 처리가 늦었습니다. `
        +"자주 반복되면 Apps Script 편집기 > 실행 기록에서 doGet 소요 시간을 확인하세요."));
    },timeoutMs||25000);
    function cleanup(){clearTimeout(timer);try{delete window[cb];}catch(e){}sc.remove();}
    window[cb]=(data)=>{cleanup();resolve(data);};
    sc.onerror=()=>{cleanup();reject(new Error("스크립트 로드 실패 (네트워크 또는 URL 오류)"));};
    sc.src=url+(url.indexOf("?")>=0?"&":"?")+"callback="+cb+"&_ts="+Date.now();
    document.head.appendChild(sc);
  });
}
async function tryLive(opts){
  const silent=!!(opts&&opts.silent);
  if(!CONFIG.LIVE_URL)return;
  const _prevNews=Array.isArray(NEWS)?NEWS.length:0;
  let _scroll=0;
  try{_scroll=(document.scrollingElement||document.documentElement).scrollTop||0;}catch(e0){}
  try{
    const j=await jsonpGet(CONFIG.LIVE_URL,45000);   // === [V37] fetch → JSONP · [V42] 전체 페이로드는 45초까지 기다림 ===
    if(j && j.error) throw new Error(j.error);
    if(!j || !Array.isArray(j.universe) || !j.universe.length) throw new Error("빈 응답(universe 없음)");

    if(j.asof) CONFIG.ASOF=j.asof;
    if(j.vix!=null) CONFIG.VIX=j.vix;

    // universe row = [tk,sec,px,rs,ud,tgt,gap%,e0,e1,e2,p0,p1,p2,g1%,g2%,peg1,peg2, stopPx]
    RAW=j.universe.map(row=>row.slice(0,17));
    LIVE_STOP={}; LIVE_STAGE={}; LIVE_MA={};
    j.universe.forEach(row=>{
      if(row[17]!=null) LIVE_STOP[row[0]]=row[17];
      if(row[18]) LIVE_STAGE[row[0]]=String(row[18]).trim();
      // === [V34] 19~22 = MA20 · MA50 · 60일 고점 · 고점대비(%) ===
      if(row[19]!=null||row[21]!=null)
        LIVE_MA[row[0]]={ma20:row[19],ma50:row[20],hi60:row[21],dd:row[22]};
    });
    // === [V40] 주 1점으로 정리 (Code.gs V40이면 이미 정리돼 와서 그대로 통과)
    LIVE_EPSH=weeklyHist((j.epsHist&&typeof j.epsHist==="object")?j.epsHist:{});
    LIVE_RSH=weeklyHist((j.rsHist&&typeof j.rsHist==="object")?j.rsHist:{});
    JOURNAL=Array.isArray(j.journal)?j.journal:[];
    LIVE_GAS={ver:j.gasVer||null,hasPost:!!j.hasPost};   // === [V31] 배포 신선도
    LIVE_INDEX=(j.index&&typeof j.index==="object")?j.index:null;

    if(j.holdings) HOLD=j.holdings;
    if(Array.isArray(j.sectors)&&j.sectors.length) SECT=j.sectors;
    if(Array.isArray(j.news)) NEWS=j.news;   // telegram_report_index 실측 리포트로 교체 (없으면 SIM 데모 유지)
    // === [V38] 촉매 캘린더 · 섹터 EPS (Catalysts / SectorEPS 탭) ===
    // 탭이 비어 있으면 빈 배열이 온다 → CATALYSTS는 SIM 시드를 유지해 화면이
    // 비어 보이지 않게 하고, 한 건이라도 있으면 통째로 교체한다.
    if(Array.isArray(j.catalysts)&&j.catalysts.length) CATALYSTS=j.catalysts;
    if(j.sectorEps&&Array.isArray(j.sectorEps.rows)) SECTOR_EPS=j.sectorEps;

    LIVE_ON=true; LIVE_STALE=false; LIVE_MS=(j.ms!=null?j.ms:null);   // === [V42]
    RETRY_N=0; if(RETRY_T){clearTimeout(RETRY_T);RETRY_T=null;}
    rebuildAll();
    paintTop();paintTape();paintFkeys();
    render();
    // === [V35] 자동 갱신 시 보던 위치를 잃지 않게 스크롤 복원 ===
    if(silent){try{(document.scrollingElement||document.documentElement).scrollTop=_scroll;}catch(e1){}}
    LAST_SYNC=Date.now(); _connCache=""; paintConn();
    // === [V35] 새로 들어온 리포트 알림 (분류기가 태깅을 마친 건만 집계된다) ===
    const _added=(Array.isArray(NEWS)?NEWS.length:0)-_prevNews;
    if(silent&&_added>0) flashHint(`새 리포트 ${_added}건 — 1 NEWS`);
  }catch(err){
    LAST_LIVE_ERR=(err&&err.message)||String(err);
    console.error("[tryLive] 실패:",err);
    _connCache="";
    if(LIVE_ON&&LAST_SYNC){
      /* === [V42] 이미 실데이터를 받은 상태면 LIVE를 유지하고 '갱신 지연'만 표시 ===
         V41까지는 갱신 한 번만 실패해도 전체가 SIM으로 떨어졌고, 그 상태에선 저장 버튼도 잠겼다
         (2026-09-29 저장 직후 재조회가 늦어 발생). 화면의 데이터는 직전 값 그대로 유효하다. */
      LIVE_STALE=true; paintConn(); scheduleRetry();
      if(!silent)flashHint("갱신 실패 — 직전 데이터 유지 (다시 시도: R)");
    }else{
      LIVE_ON=false;
      const w=scheduleRetry();
      el("conn").innerHTML=`<span class='dn k' onclick="manualSync()" title="${esc(LAST_LIVE_ERR)} — 클릭하면 즉시 재시도">◆ 연결 실패${w?` · ${Math.round(w/1000)}초 뒤 재시도`:" · 재시도 예정"}</span>`;
      if(state.view==="MENU")render();                // 배너 문구 갱신
    }
  }
}

      <span class="amber b" style="font-size:14px">⚙ 연결 설정${first?" — 첫 실행":""}</span>
      <span class="k" onclick="setupDemo()">✕ ${first?"데모로 보기":"닫기"}</span></div>
    <div class="muted mono-sm" style="margin-top:6px;line-height:1.6">입력한 값은 <b>이 기기의 이 브라우저</b>에만 저장됩니다. 파일·저장소·다른 기기에는 남지 않습니다.<br>PC와 폰은 각각 한 번씩 입력하세요.</div>
    <div class="sep"></div>
    <label class="b" for="stUrl">Apps Script 웹앱 URL</label>
    <input id="stUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="https://script.google.com/macros/s/…/exec" value="${esc(CONFIG.LIVE_URL||"")}"
      style="box-sizing:border-box;width:100%;margin-top:4px;padding:8px;background:#161b22;color:var(--white);border:1px solid var(--line);font:inherit">
    <label class="b" for="stKey" style="display:block;margin-top:10px">일지 저장 키 <span class="muted mono-sm">(THESIS 저장에만 필요 · Code.gs의 WRITE_KEY와 같은 값)</span></label>
    <input id="stKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="비워 두면 읽기 전용" value="${esc(CONFIG.WRITE_KEY||"")}"
      style="box-sizing:border-box;width:100%;margin-top:4px;padding:8px;background:#161b22;color:var(--white);border:1px solid var(--line);font:inherit">
    <div id="stMsg" class="mono-sm" style="margin-top:8px;min-height:1.4em"></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <span class="k" onclick="setupSave()">▶ 저장하고 연결</span>
      ${hasAny?`<span class="k" onclick="setupClear()">🗑 이 기기에서 지우기</span>`:""}
    </div>`;
  el("modalbg").style.display="flex";
  // 폰에서는 자동 포커스 안 함(키보드가 바로 올라와 화면을 가림). PC(마우스)에서만.
  try{if(matchMedia("(pointer:fine)").matches)setTimeout(()=>{try{el(CONFIG.LIVE_URL?"stKey":"stUrl").focus({preventScroll:true});}catch(e){}},50);}catch(e){}
}
function setupMsg(t,cls){const m=el("stMsg");if(m)m.innerHTML=`<span class="${cls||"muted"}">${esc(t)}</span>`;}
async function setupSave(){
  const u=el("stUrl").value.trim(), k=el("stKey").value.trim();
  if(!u){setupMsg("URL을 입력하세요 (읽기 전용으로 쓰려면 키는 비워도 됩니다)","dn");return;}
  if(!URL_RE.test(u)){setupMsg("형식이 다릅니다 — https://script.google.com/…/exec 로 끝나는 배포 URL이어야 합니다","dn");return;}
  const ok=secretSet(SECRET_KEYS.url,u)&secretSet(SECRET_KEYS.key,k);
  if(u!==CONFIG.LIVE_URL){LIVE_ON=false;LAST_SYNC=null;LIVE_STALE=false;}   // === [V42] 주소가 바뀌면 새로 판정
  CONFIG.LIVE_URL=u; CONFIG.WRITE_KEY=k;
  setupMsg("연결 확인 중…","warn");
  const _prevSync=LAST_SYNC;
  await tryLive();
  if(LIVE_ON&&LAST_SYNC&&LAST_SYNC!==_prevSync){
    modalClose();
    flashHint(ok?"연결됨 — 이 기기에 저장했습니다":"연결됨 — 단, 이 브라우저가 저장을 막아 다음 실행 때 다시 물을 수 있습니다");
  }else{
    MODAL=true; el("modalbg").style.display="flex";
    setupMsg("연결 실패: "+(LAST_LIVE_ERR||"알 수 없는 오류")+" — URL을 확인하세요 (값은 저장해 두었습니다)","dn");
  }
}
function setupClear(){
  secretSet(SECRET_KEYS.url,""); secretSet(SECRET_KEYS.key,"");
  CONFIG.LIVE_URL=""; CONFIG.WRITE_KEY="";
  try{sessionStorage.removeItem("tkstock.demo");}catch(e){}
  location.reload();
}
function setupDemo(){
  try{sessionStorage.setItem("tkstock.demo","1");}catch(e){}
  modalClose();
}

/* INIT */
applyStartView();paintTop();paintTape();paintFkeys();tick();
setInterval(()=>{tick();paintConn();},1000);          // === [V35] 경과시간 표기 갱신
if(CONFIG.LIVE_URL)el("conn").innerHTML="<span class='muted'>◌ 연결 중…</span>";   // === [V42]
render();tryLive();
/* === [V41] 첫 실행: 저장된 URL이 없으면 SETUP (데모로 보기를 누른 세션은 다시 묻지 않음) === */
(function(){let demo="";try{demo=sessionStorage.getItem("tkstock.demo")||"";}catch(e){}
  if(!CONFIG.LIVE_URL&&!demo)openSetup(true);})();
if(CONFIG.REFRESH_MIN>0) setInterval(autoSync,CONFIG.REFRESH_MIN*60000);   // === [V35] 자동 갱신
el("cmd").focus();

/* === [V38] 서비스 워커 등록 ===
   https가 아니면 navigator.serviceWorker 자체가 없거나 등록이 거부된다.
   그 경우 조용히 넘어간다 — file:// 사용에 아무 영향이 없다. */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js")
      .catch(err=>console.warn("[SW] 등록 실패:",err));
  });
}
</script>
</body>
</html>
